version: "3"

vars:
  APP_NAME: "JFTrade"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: "pnpm"
  VITE_PORT: '{{.WAILS_VITE_PORT | default "3003"}}'
  GOOS: '{{.GOOS | default OS}}'
  PINEWORKER_BUNDLE: '{{.JFTRADE_PINEWORKER_BUNDLE | default "var/pineworker/worker.mjs"}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    desc: Builds the application for the current platform
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    desc: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    desc: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    desc: Runs the application in Wails development mode
    cmds:
      - go tool wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  prepare:release:
    desc: Explicitly prepares frontend, bindings, Pine and market-data release inputs
    cmds:
      - pnpm run prepare:desktop-release

  prepare:dev:
    desc: Explicitly builds the external PineTS worker used by desktop development
    cmds:
      - pnpm run build:pineworker:dev

  doctor:
    desc: Verifies the pinned Wails CLI and host desktop prerequisites
    cmds:
      - go tool wails3 doctor
