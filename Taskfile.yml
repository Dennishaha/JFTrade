version: "3"

vars:
  APP_NAME: "JFTrade"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: "pnpm"

# Keep the historical platform-qualified task names available as thin Tauri
# aliases.  They are still useful to local scripts and external contributors,
# while the actual build/dev implementation lives in the package scripts.
includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    desc: Builds the Tauri desktop application for the current platform
    cmds:
      - pnpm run build:desktop

  package:
    desc: Builds the Tauri desktop bundles for the current platform
    cmds:
      - pnpm run build:desktop

  run:
    desc: Runs the Tauri desktop application
    cmds:
      - pnpm run dev:desktop

  dev:
    desc: Runs the application in Tauri development mode
    cmds:
      - pnpm run dev:desktop

  prepare:release:
    desc: Explicitly prepares Tauri frontend, Pine and market-data release inputs
    cmds:
      - pnpm run prepare:tauri-release

  prepare:dev:
    desc: Explicitly builds the external PineTS worker used by desktop development
    cmds:
      - pnpm run build:pineworker:dev

  doctor:
    desc: Verifies the Tauri CLI and host desktop prerequisites
    dir: apps/desktop/src-tauri
    cmds:
      - pnpm exec tauri info
