[workspace]
members = ["crates/jftrade-engine"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/jftrade/jftrade-main"
rust-version = "1.97.1"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tonic = "=0.14.6"
tonic-health = "=0.14.6"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
