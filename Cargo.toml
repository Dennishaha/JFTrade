[workspace]
members = [
  "crates/jftrade-broker",
  "crates/jftrade-engine",
  "crates/jftrade-kernel",
  "crates/jftrade-store-sqlite",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/jftrade/jftrade-main"
rust-version = "1.97.1"

[workspace.dependencies]
jftrade-kernel = { path = "crates/jftrade-kernel", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
thiserror = "=2.0.20"
time = { version = "=0.3.55", default-features = false, features = ["formatting", "parsing", "serde", "std"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tonic = "=0.14.6"
tonic-health = "=0.14.6"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
