[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketdata-sidecar"
version = "0.2.0"
description = "Local Python market-data sidecar for JFTrade"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = []

[project.optional-dependencies]
runtime = [
  "yfinance==0.2.61",
  "akshare==1.18.91",
  "curl_cffi==0.16.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.3",
  "pydantic==2.13.4",
]
build = [
  "pyinstaller==6.22.0",
]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[project.scripts]
marketdata-sidecar = "marketdata_sidecar.main:main"
yfinance-sidecar = "marketdata_sidecar.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:'asyncio\\.iscoroutinefunction' is deprecated and slated for removal in Python 3\\.16; use inspect\\.iscoroutinefunction\\(\\) instead:DeprecationWarning:fastapi\\.routing",
]
