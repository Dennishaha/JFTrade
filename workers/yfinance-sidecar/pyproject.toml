[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yfinance-sidecar"
version = "0.1.0"
description = "Local Yahoo Finance market-data sidecar for JFTrade"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = []

[project.optional-dependencies]
runtime = [
  "yfinance==0.2.61",
  "curl_cffi==0.15.0",
  "fastapi==0.115.14",
  "uvicorn==0.35.0",
  "pydantic==2.12.2",
]
build = [
  "pyinstaller==6.21.0",
]
test = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.0.0",
]

[project.scripts]
yfinance-sidecar = "yfinance_sidecar.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
