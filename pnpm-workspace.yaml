packages:
  - apps/web
  - workers/pineworker

catalog:
  vue: 3.5.41
  vitest: ^4.1.10

overrides:
  "@vue/test-utils>js-beautify": 2.0.3
  brace-expansion: ">=5.0.9"
  dompurify: ">=3.4.13"
  nanoid: "3.3.18"
  postcss: ">=8.5.23"
  undici: ">=7.29.0"
  vue: "catalog:"

supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - arm64
    - x64
  libc:
    - glibc
    - musl

minimumReleaseAge: 1440
strictDepBuilds: true
autoInstallPeers: false
allowBuilds:
  fsevents: false
  "protobufjs@7.6.5": true
  "vue-demi@0.14.10": true
