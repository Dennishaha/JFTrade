version: "3"

tasks:
  build:
    desc: Builds the Tauri Windows application
    cmds:
      - pnpm run build:desktop

  package:
    desc: Builds the Tauri Windows bundles
    cmds:
      - pnpm run build:desktop

  package:msix:
    desc: Deprecated alias for the Tauri Windows bundle build
    cmds:
      - pnpm run build:desktop

  generate:syso:
    desc: Deprecated alias; Tauri owns Windows resource generation
    cmds:
      - pnpm exec tauri info

  run:
    desc: Runs the Tauri Windows development application
    cmds:
      - pnpm run dev:desktop
