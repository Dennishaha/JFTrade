version: "3"

tasks:
  build:
    desc: Builds the Tauri Linux application
    cmds:
      - pnpm run build:desktop

  package:
    desc: Builds the Tauri Linux bundles
    cmds:
      - pnpm run build:desktop

  # Retain names used by older Taskfile callers; packaging is now owned by
  # the Tauri CLI and emits the configured AppImage/deb/rpm bundles.
  package:appimage:
    desc: Deprecated alias for the Tauri Linux bundle build
    cmds:
      - pnpm run build:desktop

  package:linux:
    desc: Deprecated alias for the Tauri Linux bundle build
    cmds:
      - pnpm run build:desktop

  package:appimage:prepared:
    desc: Deprecated alias for a prepared Tauri Linux AppImage build
    cmds:
      - pnpm run build:desktop

  package:linux:prepared:
    desc: Deprecated alias for a prepared Tauri Linux package build
    cmds:
      - pnpm run build:desktop

  generate:desktop:
    desc: Deprecated alias; Tauri generates desktop metadata during bundling
    cmds:
      - pnpm exec tauri info

  run:
    desc: Runs the Tauri Linux development application
    cmds:
      - pnpm run dev:desktop
