version: "3"

tasks:
  build:
    desc: Builds the Tauri macOS application
    cmds:
      - pnpm run build:desktop

  package:
    desc: Builds the Tauri macOS bundles
    cmds:
      - pnpm run build:desktop

  run:
    desc: Runs the Tauri macOS development application
    cmds:
      - pnpm run dev:desktop
