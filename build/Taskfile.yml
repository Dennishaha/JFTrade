version: "3"

tasks:
  dev:frontend:
    desc: Runs the Vue development server for Tauri development
    dir: .
    env:
      JFTRADE_DESKTOP_MODE: "1"
      TAURI_VITE_PORT: '{{.TAURI_VITE_PORT | default "3003"}}'
      VITE_DEV_API_TARGET: '{{.VITE_DEV_API_TARGET | default "http://127.0.0.1:3008"}}'
    cmds:
      - pnpm run dev:web

  build:frontend:
    desc: Builds release frontend assets when explicitly requested
    cmds:
      - pnpm run build:frontend-assets

  prepare:release-assets:
    desc: Explicitly prepares all embedded Tauri release assets
    cmds:
      - pnpm run prepare:tauri-release

  # Compatibility aliases for callers of the retired Wails task graph.  The
  # aliases intentionally route to the Tauri preparation/check commands and
  # never invoke the removed Go desktop toolchain.
  generate:bindings:
    desc: Deprecated alias; Tauri has no generated Go bindings
    cmds:
      - pnpm run check:tauri-release-runtime

  generate:icons:
    desc: Deprecated alias; Tauri icons are checked in and configured directly
    cmds:
      - pnpm exec tauri info

  update:build-assets:
    desc: Deprecated alias for Tauri release runtime preparation
    cmds:
      - pnpm run prepare:tauri-release

  verify:release-inputs:
    desc: Verifies prepared Tauri release runtime inputs
    cmds:
      - pnpm run check:tauri-release-runtime

  go:mod:tidy:
    desc: Runs go mod tidy explicitly
    internal: true
    cmds:
      - go mod tidy
