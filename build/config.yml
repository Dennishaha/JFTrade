version: "3"

info:
  companyName: JFTrade
  productName: JFTrade
  productIdentifier: com.jftrade.desktop
  description: JFTrade desktop application
  copyright: Copyright (C) 2026 JFTrade Contributors
  comments: Wails v3 desktop shell for JFTrade
  version: 0.0.0

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - apps/web
      - dist
      - bin
      - var
    file:
      - .DS_Store
      - .gitignore
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: go tool wails3 build DEV=true
      type: blocking
    - cmd: go tool wails3 task common:dev:frontend
      type: background
    - cmd: go tool wails3 task run
      type: primary

fileAssociations: []
