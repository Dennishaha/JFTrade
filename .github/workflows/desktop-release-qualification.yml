name: Desktop Release Qualification

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact vX.Y.Z tag checked out by the release candidate
        required: true
        type: string
      source_run_id:
        description: Successful Desktop Release run containing the four platform package artifacts
        required: true
        type: string
      source_run_attempt:
        description: Attempt of the source Desktop Release dry-run
        required: false
        default: "1"
        type: string
      evidence_run_id:
        description: Successful signing/evidence workflow run containing externally produced updater, SBOM, rollback, backup and security evidence
        required: true
        type: string
      evidence_run_attempt:
        description: Attempt of the external signing/evidence workflow run
        required: true
        type: string
      evidence_workflow:
        description: Workflow filename that produced the external evidence artifact
        required: true
        type: string
      evidence_artifact:
        description: Exact artifact name containing release-evidence-inputs.json and real prerequisite files
        required: true
        type: string
      evidence_manifest:
        description: Relative manifest path inside evidence_artifact
        required: false
        default: release-evidence-inputs.json
        type: string

permissions: {}

jobs:
  qualify:
    name: Build artifact-bound candidate evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Verify source release run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          RELEASE_REF: ${{ inputs.release_ref }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "source_run_id must be a positive integer" >&2; exit 1; }
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo "source_run_attempt must be a positive integer" >&2; exit 1; }
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release_ref must be a vX.Y.Z tag" >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_REF" ]] || {
            echo "Qualification must be dispatched from the published tag ref; selected ref is $GITHUB_REF" >&2
            exit 1
          }
          commit_sha="$(git rev-parse HEAD)"
          run_json="$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e \
            --arg sha "$commit_sha" \
            --arg tag "$RELEASE_REF" \
            --arg attempt "$SOURCE_RUN_ATTEMPT" \
            '.status == "completed" and .conclusion == "success" and .head_sha == $sha and (.head_branch == $tag or .head_branch == ("refs/tags/" + $tag)) and (.run_attempt|tostring) == $attempt and (.path == ".github/workflows/desktop-release.yml" or .path == "desktop-release.yml")' \
            <<<"$run_json" >/dev/null || {
            echo "source run is not a successful Desktop Release run bound to $RELEASE_REF@$commit_sha attempt $SOURCE_RUN_ATTEMPT" >&2
            exit 1
          }

      - name: Verify external release evidence run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_WORKFLOW: ${{ inputs.evidence_workflow }}
          RELEASE_REF: ${{ inputs.release_ref }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "evidence_run_id must be a positive integer" >&2; exit 1; }
          [[ "$EVIDENCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo "evidence_run_attempt must be a positive integer" >&2; exit 1; }
          [[ "$EVIDENCE_WORKFLOW" =~ ^[A-Za-z0-9._/-]+\.yml$ ]] || { echo "evidence_workflow must be a workflow filename ending in .yml" >&2; exit 1; }
          run_json="$(gh api "repos/$REPOSITORY/actions/runs/$EVIDENCE_RUN_ID")"
          commit_sha="$(git rev-parse HEAD)"
          jq -e \
            --arg sha "$commit_sha" \
            --arg tag "$RELEASE_REF" \
            --arg attempt "$EVIDENCE_RUN_ATTEMPT" \
            --arg workflow ".github/workflows/$EVIDENCE_WORKFLOW" \
            '.status == "completed" and .conclusion == "success" and .head_sha == $sha and (.head_branch == $tag or .head_branch == ("refs/tags/" + $tag)) and (.run_attempt|tostring) == $attempt and (.path == $workflow or .path == ($workflow | sub("^\.github/workflows/"; "")))' \
            <<<"$run_json" >/dev/null || {
            echo "external evidence run is not a successful workflow bound to $RELEASE_REF@$commit_sha attempt $EVIDENCE_RUN_ATTEMPT" >&2
            exit 1
          }
          artifacts_json="$(gh api "repos/$REPOSITORY/actions/runs/$EVIDENCE_RUN_ID/artifacts?per_page=100")"
          jq -e --arg name "${{ inputs.evidence_artifact }}" --argjson run_id "$EVIDENCE_RUN_ID" \
            '.artifacts[] | select(.name == $name and .expired == false and .workflow_run.id == $run_id)' \
            <<<"$artifacts_json" >/dev/null || {
            echo "external evidence artifact is missing or expired in run $EVIDENCE_RUN_ID" >&2
            exit 1
          }

      - name: Download macOS source artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-release-macos
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: incoming/desktop-release-macos

      - name: Download Linux source artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-release-linux
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: incoming/desktop-release-linux

      - name: Download Windows x64 source artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-release-windows
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: incoming/desktop-release-windows

      - name: Download Windows ARM64 source artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-release-windows-arm64
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: incoming/desktop-release-windows-arm64

      - name: Download external release evidence artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.evidence_artifact }}
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: incoming/release-evidence

      - name: Assemble candidate inputs and prerequisite evidence
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_WORKFLOW: ${{ inputs.evidence_workflow }}
          EVIDENCE_MANIFEST: ${{ inputs.evidence_manifest }}
          COMMIT_SHA: ${{ github.sha }}
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
          QUALIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$RELEASE_REF"
          commit_sha="$(git rev-parse HEAD)"
          export COMMIT_SHA="$commit_sha"
          mkdir -p candidate-inputs/evidence
          find_one() {
            local search_root="$1" pattern="$2" label="$3"
            mapfile -t matches < <(find "$search_root" -type f -name "$pattern" -print | sort)
            [[ "${#matches[@]}" -eq 1 ]] || { echo "$label count is ${#matches[@]}" >&2; exit 1; }
            printf '%s\n' "${matches[0]}"
          }
          copy_one() {
            local source="$1" name="$2"
            cp "$source" "candidate-inputs/$name"
            [[ -s "candidate-inputs/$name" ]]
          }
          [[ "$EVIDENCE_MANIFEST" != /* && "$EVIDENCE_MANIFEST" != *".."* && "$EVIDENCE_MANIFEST" != *$'\n'* ]] || {
            echo "evidence_manifest must be a relative path without traversal" >&2
            exit 1
          }
          for platform in macos-arm64 linux-x64 windows-x64 windows-arm64; do
            source_dir="incoming/desktop-release-${platform%%-*}"
            [[ "$platform" == "windows-arm64" ]] && source_dir="incoming/desktop-release-windows-arm64"
            manifest="$(find_one "$source_dir" "tauri-release-$platform.json" "$platform manifest")"
            copy_one "$manifest" "tauri-release-$platform.json"
          done
          copy_one "$(find_one incoming/desktop-release-macos '*.dmg' 'macOS package')" "JFTrade-$release_tag-macos-arm64.dmg"
          copy_one "$(find_one incoming/desktop-release-linux '*.AppImage' 'Linux AppImage')" "JFTrade-$release_tag-linux-x64.AppImage"
          copy_one "$(find_one incoming/desktop-release-linux '*.deb' 'Linux deb')" "JFTrade-$release_tag-linux-x64.deb"
          copy_one "$(find_one incoming/desktop-release-linux '*.rpm' 'Linux rpm')" "JFTrade-$release_tag-linux-x64.rpm"
          copy_one "$(find_one incoming/desktop-release-windows '*-setup.exe' 'Windows x64 package')" "JFTrade-$release_tag-windows-x64-setup.exe"
          copy_one "$(find_one incoming/desktop-release-windows-arm64 '*-setup.exe' 'Windows ARM64 package')" "JFTrade-$release_tag-windows-arm64-setup.exe"
          (cd candidate-inputs && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

          node scripts/rust-migration/check-stage9-closeout.mjs --candidate-static > candidate-inputs/evidence/candidate-admission.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const root = "candidate-inputs";
          const tag = process.env.RELEASE_REF;
          const commitSha = process.env.COMMIT_SHA;
          const sourceRun = {
            id: process.env.SOURCE_RUN_ID,
            attempt: Number(process.env.SOURCE_RUN_ATTEMPT),
            workflow: "desktop-release.yml",
            ref: `refs/tags/${tag}`,
            commitSha,
          };
          const qualificationRun = {
            id: process.env.QUALIFICATION_RUN_ID,
            attempt: Number(process.env.QUALIFICATION_RUN_ATTEMPT),
            workflow: "desktop-release-qualification.yml",
            ref: `refs/tags/${tag}`,
            commitSha,
          };
          const evidenceManifestPath = path.join("incoming/release-evidence", process.env.EVIDENCE_MANIFEST);
          const manifest = JSON.parse(fs.readFileSync(evidenceManifestPath, "utf8"));
          if (manifest.$schema !== "./release-evidence-inputs.schema.json"
            || manifest.schemaVersion !== "jftrade.release-evidence-inputs.v1") {
            throw new Error("external evidence manifest has an unsupported schema");
          }
          const expectedKinds = {
            "signed-updater-inputs": "signed-updater",
            "sbom-provenance-inputs": "sbom-provenance",
            "rollback-artifact-pair": "rollback-artifact",
            "backup-restore-drill": "backup-restore",
            "security-review-inputs": "security-review",
          };
          const externalRun = {
            id: process.env.EVIDENCE_RUN_ID,
            attempt: Number(process.env.EVIDENCE_RUN_ATTEMPT),
            workflow: process.env.EVIDENCE_WORKFLOW,
            ref: sourceRun.ref,
            commitSha,
          };
          const prerequisites = [
            {
              id: "candidate-admission",
              kind: "stage9-closeout-admission",
              status: "passed",
              releaseRef: sourceRun.ref,
              commitSha,
              workflowRun: qualificationRun,
              sourceWorkflowRun: sourceRun,
              evidence: [{ path: "evidence/candidate-admission.json", kind: "stage9-closeout-admission" }],
            },
            ...Object.entries(expectedKinds).map(([id, kind]) => {
              const entry = manifest.evidence?.[id];
              if (!entry || entry.kind !== kind || !Array.isArray(entry.files) || entry.files.length === 0) {
                throw new Error(`external evidence manifest missing valid ${id}`);
              }
              const evidence = entry.files.map((relative) => {
                if (typeof relative !== "string" || relative.trim() === "" || path.isAbsolute(relative)
                  || relative.split("/").includes("..") || relative.includes("\\")) {
                  throw new Error(`${id} contains an unsafe evidence path`);
                }
                const source = path.join("incoming/release-evidence", relative);
                if (!fs.statSync(source).isFile() || fs.statSync(source).size === 0) {
                  throw new Error(`${id} evidence file is missing or empty: ${relative}`);
                }
                const target = path.join("candidate-inputs/evidence", id, path.basename(relative));
                fs.mkdirSync(path.dirname(target), { recursive: true });
                fs.copyFileSync(source, target);
                return { path: path.relative(root, target).split(path.sep).join("/"), kind };
              });
              return {
                id,
                kind,
                status: "passed",
                releaseRef: sourceRun.ref,
                commitSha,
                workflowRun: qualificationRun,
                sourceWorkflowRun: externalRun,
                evidence,
              };
            }),
          ];
          const packageFor = (platform, names) => ({
            manifest: `tauri-release-${platform}.json`,
            artifacts: names.map((name) => ({ path: name })),
          });
          const config = {
            baseDirectory: root,
            releaseRef: sourceRun.ref,
            releaseTag: tag,
            commitSha,
            workflowRun: qualificationRun,
            sourceWorkflowRun: sourceRun,
            platforms: {
              "macos-arm64": packageFor("macos-arm64", [`JFTrade-${tag}-macos-arm64.dmg`]),
              "linux-x64": packageFor("linux-x64", [`JFTrade-${tag}-linux-x64.AppImage`, `JFTrade-${tag}-linux-x64.deb`, `JFTrade-${tag}-linux-x64.rpm`]),
              "windows-x64": packageFor("windows-x64", [`JFTrade-${tag}-windows-x64-setup.exe`]),
              "windows-arm64": packageFor("windows-arm64", [`JFTrade-${tag}-windows-arm64-setup.exe`]),
            },
            sha256sums: "SHA256SUMS",
            prerequisites,
          };
          fs.writeFileSync("candidate-evidence-config.json", `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Build and validate candidate evidence
        run: |
          set -euo pipefail
          mkdir -p candidate-output
          node scripts/rust-migration/check-release-candidate.mjs \
            --build \
            --config candidate-evidence-config.json \
            --base-dir candidate-inputs \
            --output candidate-output/release-candidate-evidence.json \
            --expected-ref "refs/tags/${{ inputs.release_ref }}" \
            --expected-tag "${{ inputs.release_ref }}" \
            --expected-commit "$(git rev-parse HEAD)" \
            --expected-run-id "${{ github.run_id }}" \
            --expected-attempt "${{ github.run_attempt }}" \
            --expected-workflow "desktop-release-qualification.yml"
          node scripts/rust-migration/check-release-candidate.mjs \
            --check \
            --input candidate-output/release-candidate-evidence.json \
            --base-dir candidate-inputs \
            --expected-ref "refs/tags/${{ inputs.release_ref }}" \
            --expected-tag "${{ inputs.release_ref }}" \
            --expected-commit "$(git rev-parse HEAD)" \
            --expected-run-id "${{ github.run_id }}" \
            --expected-attempt "${{ github.run_attempt }}" \
            --expected-workflow "desktop-release-qualification.yml"

      - name: Upload artifact-bound qualification config
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-candidate-evidence
          path: |
            candidate-evidence-config.json
            candidate-output/release-candidate-evidence.json
          if-no-files-found: error
