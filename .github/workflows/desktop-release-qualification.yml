          }
          const sourceBinding = payloadMetadata.sourceBinding;
          const sourceRunApi = JSON.parse(fs.readFileSync("source-payload-run-api.json", "utf8"));
          const sourceArtifactApi = JSON.parse(fs.readFileSync("source-payload-artifact-api.json", "utf8"));
          if (!sourceBinding || typeof sourceBinding !== "object"
            || sourceRunApi.head_sha !== sourceBinding.commitSha
            || !safeIdentityEqual(sourceRunApi.run_attempt, sourceBinding.attempt)
            || !safeIdentityEqual(sourceRunApi.id, sourceBinding.runId)
            || !safeIdentityEqual(sourceArtifactApi.id, sourceBinding.artifact?.id)
            || sourceArtifactApi.name !== sourceBinding.artifact?.name
            || sourceArtifactApi.digest !== sourceBinding.artifact?.digest
            || sourceArtifactApi.expired !== false
            || !safeIdentityEqual(sourceArtifactApi.workflow_run?.id, sourceBinding.runId)) {
