      - name: Download producer staging payload by immutable id
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          MAX_SAFE_INTEGER_TEXT=9007199254740991
          safe_positive_integer() {
            local value="$1" label="$2"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            if [[ ! "$value" =~ ^[1-9][0-9]*$ ]] || (( ${#value} > ${#MAX_SAFE_INTEGER_TEXT} )) \
              || { (( ${#value} == ${#MAX_SAFE_INTEGER_TEXT} )) && [[ "$value" > "$MAX_SAFE_INTEGER_TEXT" ]]; }; then
              echo "$label must be a safe positive integer" >&2
              return 1
            fi
            printf '%s\n' "$value"
          }
          mapfile -t manifest_matches < <(find incoming/release-evidence -type f -name release-evidence-inputs.json -print | sort)
          [[ "${#manifest_matches[@]}" -eq 1 ]] || { echo "producer binding artifact must contain exactly one release-evidence-inputs.json" >&2; exit 1; }
          manifest_path="${manifest_matches[0]}"
          producer_id="$(jq -r '.artifact.id // empty' "$manifest_path")"
          producer_id="$(safe_positive_integer "$producer_id" producer_staging_artifact_id)"
          rm -rf incoming/producer-payload
          mkdir -p incoming/producer-payload
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          gh api -H "Accept: application/vnd.github+json" -H "Accept: application/zip" \
            "repos/$REPOSITORY/actions/artifacts/$producer_id/zip" > "$archive"
          while IFS= read -r entry; do
            [[ "$entry" != /* && "$entry" != *".."* && "$entry" != *"\\"* ]] || {
              echo "unsafe producer staging archive path: $entry" >&2
              exit 1
            }
          done < <(unzip -Z1 "$archive")
          unzip -q "$archive" -d incoming/producer-payload
          [[ -z "$(find incoming/producer-payload -type l -print -quit)" ]] || {
            echo "producer staging archive must not contain symlinks" >&2
            exit 1
          }
          for report in signed-updater-inputs sbom-provenance-inputs rollback-artifact-pair backup-restore-drill security-review-inputs; do
            file="incoming/producer-payload/reports/$report.json"
            [[ -f "$file" && ! -L "$file" && -s "$file" ]] || {
              echo "producer staging payload is missing regular report: $report" >&2
              exit 1
            }
          done
          metadata="incoming/producer-payload/payload-artifact-metadata.json"
          [[ -f "$metadata" && ! -L "$metadata" && -s "$metadata" ]] || {
            echo "producer staging payload is missing payload metadata" >&2
            exit 1
          }

      - name: Assemble candidate inputs and prerequisite evidence
        env:
          RELEASE_REF: ${{ inputs.planned_release_tag }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_WORKFLOW: ${{ inputs.evidence_workflow }}
          EVIDENCE_MANIFEST: ${{ inputs.evidence_manifest }}
          EVIDENCE_ARTIFACT: ${{ inputs.evidence_artifact }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
          QUALIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$RELEASE_REF"
          commit_sha="$(git rev-parse HEAD)"
          export COMMIT_SHA="$commit_sha"
          mkdir -p candidate-inputs/evidence
          find_one() {
            local search_root="$1" pattern="$2" label="$3"
            mapfile -t matches < <(find "$search_root" -type f -name "$pattern" -print | sort)
            [[ "${#matches[@]}" -eq 1 ]] || { echo "$label count is ${#matches[@]}" >&2; exit 1; }
            printf '%s\n' "${matches[0]}"
          }
          copy_one() {
            local source="$1" name="$2"
            [[ "$name" != /* && "$name" != *"/"* && "$name" != *"\\"* && "$name" != *".."* ]] || {
              echo "unsafe sealed bundle basename: $name" >&2
              exit 1
            }
            if [[ -e "candidate-inputs/$name" ]]; then
              cmp -s "$source" "candidate-inputs/$name" || {
                echo "sealed bundle basename collision: $name" >&2
                exit 1
              }
              return
            fi
            [[ -f "$source" && ! -L "$source" ]] || { echo "sealed bundle source is not a regular file: $source" >&2; exit 1; }
            cp -- "$source" "candidate-inputs/$name"
            [[ -s "candidate-inputs/$name" ]]
          }
          copy_support_files() {
            local source_root="$1"
            while IFS= read -r -d '' source; do
              local name="${source##*/}"
              case "$name" in
                tauri-release-*.json|tauri-runtime-smoke-*.json|*.spdx.json|*.sig|*.tar.gz|*.zip)
                  copy_one "$source" "$name"
                  ;;
              esac
            done < <(find "$source_root" -type f -print0 | sort -z)
          }
          [[ "$EVIDENCE_MANIFEST" =~ ^[A-Za-z0-9._/-]+$ && "$EVIDENCE_MANIFEST" != /* ]] || {
            echo "evidence_manifest must be a relative POSIX path without shell metacharacters" >&2
            exit 1
          }
          for platform in macos-arm64 linux-x64 windows-x64 windows-arm64; do
            source_dir="incoming/desktop-release-${platform%%-*}"
            [[ "$platform" == "windows-arm64" ]] && source_dir="incoming/desktop-release-windows-arm64"
            manifest="$(find_one "$source_dir" "tauri-release-$platform.json" "$platform manifest")"
            copy_one "$manifest" "tauri-release-$platform.json"
          done
          copy_one "$(find_one incoming/desktop-release-macos '*.dmg' 'macOS package')" "JFTrade-$release_tag-macos-arm64.dmg"
          copy_one "$(find_one incoming/desktop-release-linux '*.AppImage' 'Linux AppImage')" "JFTrade-$release_tag-linux-x64.AppImage"
          copy_one "$(find_one incoming/desktop-release-linux '*.deb' 'Linux deb')" "JFTrade-$release_tag-linux-x64.deb"
          copy_one "$(find_one incoming/desktop-release-linux '*.rpm' 'Linux rpm')" "JFTrade-$release_tag-linux-x64.rpm"
          copy_one "$(find_one incoming/desktop-release-windows '*-setup.exe' 'Windows x64 package')" "JFTrade-$release_tag-windows-x64-setup.exe"
          copy_one "$(find_one incoming/desktop-release-windows-arm64 '*-setup.exe' 'Windows ARM64 package')" "JFTrade-$release_tag-windows-arm64-setup.exe"
          copy_support_files incoming/desktop-release-macos
          copy_support_files incoming/desktop-release-linux
          copy_support_files incoming/desktop-release-windows
          copy_support_files incoming/desktop-release-windows-arm64
          copy_support_files incoming/desktop-release-updater-macos
          copy_support_files incoming/desktop-release-updater-linux
          copy_support_files incoming/desktop-release-updater-windows
          copy_support_files incoming/desktop-release-updater-windows-arm64
          copy_one LICENSE LICENSE
          copy_one docs/legal/third-party-notices.md THIRD-PARTY-NOTICES.md

          node scripts/check-zero-go.mjs --artifact candidate-inputs
          node scripts/rust-migration/check-stage9-closeout.mjs --candidate-static > candidate-inputs/evidence/candidate-admission.json
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
