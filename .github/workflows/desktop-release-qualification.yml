name: Desktop Release Qualification

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact vX.Y.Z tag checked out by the release candidate
        required: true
        type: string
      source_run_id:
        description: Successful Desktop Release run containing the four platform package artifacts
        required: true
        type: string
      source_run_attempt:
        description: Attempt of the source Desktop Release dry-run
        required: false
        default: "1"
        type: string
      evidence_run_id:
        description: Successful signing/evidence workflow run containing externally produced updater, SBOM, rollback, backup and security evidence
        required: true
        type: string
      evidence_run_attempt:
        description: Attempt of the external signing/evidence workflow run
        required: true
        type: string
      evidence_workflow:
        description: Workflow filename that produced the external evidence artifact
        required: true
        type: string
      evidence_artifact:
        description: Exact producer binding artifact containing release-evidence-inputs.json and payload-bound prerequisite files
        required: true
        type: string
      evidence_manifest:
        description: Relative manifest path inside evidence_artifact
        required: false
        default: release-evidence-inputs.json
        type: string

permissions: {}

jobs:
  qualify:
    name: Build artifact-bound candidate evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Verify source release run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          RELEASE_REF: ${{ inputs.release_ref }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "source_run_id must be a positive integer" >&2; exit 1; }
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo "source_run_attempt must be a positive integer" >&2; exit 1; }
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release_ref must be a vX.Y.Z tag" >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_REF" ]] || {
            echo "Qualification must be dispatched from the published tag ref; selected ref is $GITHUB_REF" >&2
            exit 1
          }
          commit_sha="$(git rev-parse HEAD)"
          [[ "$GITHUB_SHA" == "$commit_sha" ]] || { echo "qualification GITHUB_SHA does not match the release tag commit" >&2; exit 1; }
          run_json="$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e \
            --arg sha "$commit_sha" \
            --arg tag "$RELEASE_REF" \
            --arg attempt "$SOURCE_RUN_ATTEMPT" \
            '.status == "completed" and .conclusion == "success" and .head_sha == $sha and (.head_branch == $tag or .head_branch == ("refs/tags/" + $tag)) and (.run_attempt|tostring) == $attempt and (.path == ".github/workflows/desktop-release.yml" or .path == "desktop-release.yml")' \
            <<<"$run_json" >/dev/null || {
            echo "source run is not a successful Desktop Release run bound to $RELEASE_REF@$commit_sha attempt $SOURCE_RUN_ATTEMPT" >&2
            exit 1
          }
          source_artifacts_json="$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          jq -e --argjson run_id "$SOURCE_RUN_ID" \
            '[.artifacts[] | select((.name == "desktop-release-macos" or .name == "desktop-release-linux" or .name == "desktop-release-windows" or .name == "desktop-release-windows-arm64") and ((.id|type) == "number") and .id > 0 and .expired == false and .workflow_run.id == $run_id and ((.digest|type) == "string") and (.digest|test("^sha256:[0-9a-f]{64}$")))] | select(length == 4) | select([.[].name] | sort == ["desktop-release-linux", "desktop-release-macos", "desktop-release-windows", "desktop-release-windows-arm64"])' \
            <<<"$source_artifacts_json" >/dev/null || {
            echo "source release artifacts are missing, expired, ambiguous, or lack API digests" >&2
            exit 1
          }
          jq -e --argjson run_id "$SOURCE_RUN_ID" \
            '[.artifacts[] | select((.name == "desktop-release-updater-macos" or .name == "desktop-release-updater-linux" or .name == "desktop-release-updater-windows" or .name == "desktop-release-updater-windows-arm64") and ((.id|type) == "number") and .id > 0 and .expired == false and .workflow_run.id == $run_id and ((.digest|type) == "string") and (.digest|test("^sha256:[0-9a-f]{64}$")))] | select(length == 4) | select([.[].name] | sort == ["desktop-release-updater-linux", "desktop-release-updater-macos", "desktop-release-updater-windows", "desktop-release-updater-windows-arm64"])' \
            <<<"$source_artifacts_json" >/dev/null || {
            echo "source updater artifacts are missing, expired, ambiguous, or lack API digests" >&2
            exit 1
          }
          jq -c --argjson run_id "$SOURCE_RUN_ID" --argjson run_attempt "$SOURCE_RUN_ATTEMPT" \
            --arg ref "refs/tags/$RELEASE_REF" --arg commit_sha "$commit_sha" \
            '{releaseArtifacts: [.artifacts[] | select(.name == "desktop-release-macos" or .name == "desktop-release-linux" or .name == "desktop-release-windows" or .name == "desktop-release-windows-arm64") | {name, id, digest, expired, runId: .workflow_run.id, runAttempt: $run_attempt, workflow: "desktop-release.yml", ref: $ref, commitSha: $commit_sha}] | sort_by(.name), updaterArtifacts: [.artifacts[] | select(.name == "desktop-release-updater-macos" or .name == "desktop-release-updater-linux" or .name == "desktop-release-updater-windows" or .name == "desktop-release-updater-windows-arm64") | {name, id, digest, expired, runId: .workflow_run.id, runAttempt: $run_attempt, workflow: "desktop-release.yml", ref: $ref, commitSha: $commit_sha}] | sort_by(.name)}' \
            <<<"$source_artifacts_json" > source-artifact-metadata.json

      - name: Verify external release evidence run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_WORKFLOW: ${{ inputs.evidence_workflow }}
          EVIDENCE_ARTIFACT: ${{ inputs.evidence_artifact }}
          RELEASE_REF: ${{ inputs.release_ref }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "evidence_run_id must be a positive integer" >&2; exit 1; }
          [[ "$EVIDENCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo "evidence_run_attempt must be a positive integer" >&2; exit 1; }
          [[ "$EVIDENCE_WORKFLOW" == "desktop-release-evidence.yml" ]] || { echo "evidence_workflow is not a trusted producer workflow" >&2; exit 1; }
          [[ "$EVIDENCE_ARTIFACT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo "evidence_artifact must be a simple artifact name" >&2; exit 1; }
          run_json="$(gh api "repos/$REPOSITORY/actions/runs/$EVIDENCE_RUN_ID")"
          commit_sha="$(git rev-parse HEAD)"
          jq -e \
            --arg sha "$commit_sha" \
            --arg tag "$RELEASE_REF" \
            --arg attempt "$EVIDENCE_RUN_ATTEMPT" \
            --arg workflow ".github/workflows/$EVIDENCE_WORKFLOW" \
            '.status == "completed" and .conclusion == "success" and .head_sha == $sha and (.head_branch == $tag or .head_branch == ("refs/tags/" + $tag)) and (.run_attempt|tostring) == $attempt and (.path == $workflow or .path == ($workflow | sub("^\.github/workflows/"; "")))' \
            <<<"$run_json" >/dev/null || {
            echo "external evidence run is not a successful workflow bound to $RELEASE_REF@$commit_sha attempt $EVIDENCE_RUN_ATTEMPT" >&2
            exit 1
          }
          artifacts_json="$(gh api "repos/$REPOSITORY/actions/runs/$EVIDENCE_RUN_ID/artifacts?per_page=100")"
          artifact_matches="$(jq -c \
            --arg name "$EVIDENCE_ARTIFACT" \
            --argjson run_id "$EVIDENCE_RUN_ID" \
            '[.artifacts[] | select(.id | type == "number" and . > 0) | select(.name == $name and .expired == false and .workflow_run.id == $run_id and (.digest | type == "string") and (.digest | test("^sha256:[0-9a-f]{64}$"))) | {id, name, digest, runId: .workflow_run.id}]' \
            <<<"$artifacts_json")"
          [[ "$(jq 'length' <<<"$artifact_matches")" == "1" ]] || {
            echo "external evidence artifact metadata is missing, ambiguous, expired, or lacks a digest" >&2
            exit 1
          }
          evidence_artifact_id="$(jq -r '.[0].id' <<<"$artifact_matches")"
          evidence_artifact_digest="$(jq -r '.[0].digest' <<<"$artifact_matches")"
          evidence_artifact_json="$(gh api "repos/$REPOSITORY/actions/artifacts/$evidence_artifact_id")"
          jq -e \
            --arg name "$EVIDENCE_ARTIFACT" \
            --arg digest "$evidence_artifact_digest" \
            --argjson id "$evidence_artifact_id" \
            --argjson run_id "$EVIDENCE_RUN_ID" \
            '.id == $id and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run_id' \
            <<<"$evidence_artifact_json" >/dev/null || {
            echo "external evidence artifact detail does not match run metadata" >&2
            exit 1
          }
          jq --argjson attempt "$EVIDENCE_RUN_ATTEMPT" '.[0] + {runAttempt: $attempt}' <<<"$artifact_matches" > evidence-artifact-metadata.json
          printf '%s\n' "$evidence_artifact_json" > evidence-bound-artifact-api.json

      - name: Download producer binding artifact by immutable id
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVIDENCE_ARTIFACT_ID_FILE: evidence-artifact-metadata.json
        shell: bash
        run: |
          set -euo pipefail
          artifact_id="$(jq -r '.id // empty' "$EVIDENCE_ARTIFACT_ID_FILE")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || { echo "producer binding artifact id is invalid" >&2; exit 1; }
          rm -rf incoming/release-evidence
          mkdir -p incoming/release-evidence
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          gh api -H "Accept: application/vnd.github+json" -H "Accept: application/zip" \
            "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > "$archive"
          while IFS= read -r entry; do
            [[ "$entry" != /* && "$entry" != *".."* && "$entry" != *"\\"* ]] || { echo "unsafe evidence archive path: $entry" >&2; exit 1; }
          done < <(unzip -Z1 "$archive")
          unzip -q "$archive" -d incoming/release-evidence
          [[ -f incoming/release-evidence/release-evidence-inputs.json ]] || { echo "producer binding archive has no release-evidence-inputs.json" >&2; exit 1; }

      - name: Download source artifacts by immutable ids
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming
          while IFS= read -r item; do
            name="$(jq -r '.name' <<<"$item")"
            artifact_id="$(jq -r '.id' <<<"$item")"
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || { echo "source artifact id is invalid: $name" >&2; exit 1; }
            case "$name" in
              desktop-release-macos) destination="incoming/desktop-release-macos" ;;
              desktop-release-linux) destination="incoming/desktop-release-linux" ;;
              desktop-release-windows) destination="incoming/desktop-release-windows" ;;
              desktop-release-windows-arm64) destination="incoming/desktop-release-windows-arm64" ;;
              desktop-release-updater-macos) destination="incoming/desktop-release-updater-macos" ;;
              desktop-release-updater-linux) destination="incoming/desktop-release-updater-linux" ;;
              desktop-release-updater-windows) destination="incoming/desktop-release-updater-windows" ;;
              desktop-release-updater-windows-arm64) destination="incoming/desktop-release-updater-windows-arm64" ;;
              *) echo "unexpected source artifact: $name" >&2; exit 1 ;;
            esac
            rm -rf "$destination"
            mkdir -p "$destination"
            archive="$(mktemp)"
            trap 'rm -f "$archive"' EXIT
            gh api -H "Accept: application/vnd.github+json" -H "Accept: application/zip" \
              "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > "$archive"
            while IFS= read -r entry; do
              [[ "$entry" != /* && "$entry" != *".."* && "$entry" != *"\\"* ]] || { echo "unsafe source archive path: $entry" >&2; exit 1; }
            done < <(unzip -Z1 "$archive")
            unzip -q "$archive" -d "$destination"
            rm -f "$archive"
          done < <(jq -c '.releaseArtifacts[], .updaterArtifacts[]' source-artifact-metadata.json)

      - name: Verify producer binding and payload artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ inputs.release_ref }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_WORKFLOW: ${{ inputs.evidence_workflow }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifest_matches < <(find incoming/release-evidence -type f -name release-evidence-inputs.json -print | sort)
          [[ "${#manifest_matches[@]}" -eq 1 ]] || { echo "producer binding artifact must contain exactly one release-evidence-inputs.json" >&2; exit 1; }
          manifest_path="${manifest_matches[0]}"
          mapfile -t payload_metadata_matches < <(find incoming/release-evidence -type f -name payload-artifact-metadata.json -print | sort)
          [[ "${#payload_metadata_matches[@]}" -eq 1 ]] || { echo "producer binding artifact must contain exactly one payload-artifact-metadata.json" >&2; exit 1; }
          payload_metadata="${payload_metadata_matches[0]}"
          [[ -z "$(find incoming/release-evidence -type l -print -quit)" ]] || { echo "producer binding artifact must not contain symlinks" >&2; exit 1; }
          release_commit="$(git rev-parse HEAD)"
          jq -e \
            --arg repository "$REPOSITORY" \
            --arg release_ref "refs/tags/$RELEASE_REF" \
            --arg commit "$release_commit" \
            --arg workflow "$EVIDENCE_WORKFLOW" \
            --argjson run_id "$EVIDENCE_RUN_ID" \
            --arg attempt "$EVIDENCE_RUN_ATTEMPT" \
            '.repository == $repository and .releaseRef == $release_ref and .ref == $release_ref and .commitSha == $commit and .workflow == $workflow and (.runId|tonumber) == $run_id and (.attempt|tonumber) == ($attempt|tonumber)' \
            "$manifest_path" >/dev/null || { echo "producer manifest is not bound to qualification release or producer run" >&2; exit 1; }
          payload_id="$(jq -r '.artifact.id // empty' "$payload_metadata")"
          payload_name="$(jq -r '.artifact.name // empty' "$payload_metadata")"
          payload_digest="$(jq -r '.artifact.digest // empty' "$payload_metadata")"
          payload_run_id="$(jq -r '.payloadRun.id // empty' "$payload_metadata")"
          payload_run_attempt="$(jq -r '.payloadRun.attempt // empty' "$payload_metadata")"
          payload_workflow="$(jq -r '.payloadRun.workflow // empty' "$payload_metadata")"
          payload_ref="$(jq -r '.payloadRun.ref // empty' "$payload_metadata")"
          payload_commit="$(jq -r '.payloadRun.commitSha // empty' "$payload_metadata")"
          evidence_ref="$(jq -r '.evidenceRef // empty' "$payload_metadata")"
          payload_release_ref="$(jq -r '.releaseRef // empty' "$payload_metadata")"
          [[ "$payload_id" =~ ^[1-9][0-9]*$ && "$payload_run_id" =~ ^[1-9][0-9]*$ && "$payload_run_attempt" =~ ^[1-9][0-9]*$ ]] || { echo "payload binding metadata has invalid ids" >&2; exit 1; }
          [[ "$payload_name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ && "$payload_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "payload binding metadata has invalid artifact fields" >&2; exit 1; }
          [[ "$payload_workflow" == "desktop-release-evidence-payload.yml" ]] || { echo "payload binding metadata uses an untrusted workflow" >&2; exit 1; }
          [[ "$payload_release_ref" == "refs/tags/$RELEASE_REF" ]] || { echo "payload binding metadata releaseRef does not match release tag" >&2; exit 1; }
          [[ "$evidence_ref" =~ ^[A-Za-z0-9._/-]+$ && "$evidence_ref" != /* && "$evidence_ref" != *".."* ]] || { echo "payload evidence ref is unsafe" >&2; exit 1; }
          [[ "$payload_commit" == "$release_commit" && "$payload_ref" == "$evidence_ref" && "$evidence_ref" != "$RELEASE_REF" && "$evidence_ref" != "refs/tags/$RELEASE_REF" ]] || { echo "payload evidence ref/commit is not independently bound" >&2; exit 1; }
          payload_artifact_json="$(gh api "repos/$REPOSITORY/actions/artifacts/$payload_id")"
          jq -e \
            --arg name "$payload_name" \
            --arg digest "$payload_digest" \
            --argjson id "$payload_id" \
            --argjson run_id "$payload_run_id" \
            '.id == $id and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run_id' \
            <<<"$payload_artifact_json" >/dev/null || { echo "payload artifact API metadata does not match producer binding" >&2; exit 1; }
          producer_id="$(jq -r '.artifact.id // empty' "$manifest_path")"
          producer_name="$(jq -r '.artifact.name // empty' "$manifest_path")"
          producer_digest="$(jq -r '.artifact.digest // empty' "$manifest_path")"
          [[ "$producer_name" == "desktop-release-evidence-payload" ]] || { echo "producer manifest must reference the fixed staging artifact" >&2; exit 1; }
          [[ "$producer_id" =~ ^[1-9][0-9]*$ && "$producer_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "producer manifest artifact metadata is invalid" >&2; exit 1; }
          producer_artifact_json="$(gh api "repos/$REPOSITORY/actions/artifacts/$producer_id")"
          jq -e \
            --arg name "$producer_name" \
            --arg digest "$producer_digest" \
            --argjson id "$producer_id" \
            --argjson run_id "$EVIDENCE_RUN_ID" \
            '.id == $id and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run_id' \
            <<<"$producer_artifact_json" >/dev/null || { echo "producer staging artifact API metadata does not match manifest" >&2; exit 1; }
          printf '%s\n' "$producer_artifact_json" > producer-payload-artifact-api.json
          payload_run_json="$(gh api "repos/$REPOSITORY/actions/runs/$payload_run_id")"
          payload_branch="${payload_ref#refs/heads/}"
          payload_branch="${payload_branch#refs/tags/}"
          jq -e \
            --arg sha "$payload_commit" \
            --arg branch "$payload_branch" \
            --arg ref "$payload_ref" \
            --arg attempt "$payload_run_attempt" \
            --arg workflow "$payload_workflow" \
            '.status == "completed" and .conclusion == "success" and .head_sha == $sha and (.run_attempt|tostring) == $attempt and ($ref == $sha or .head_branch == $branch or .head_branch == $ref) and (.path == $workflow or .path == ($workflow | sub("^\.github/workflows/"; "")))' \
            <<<"$payload_run_json" >/dev/null || { echo "payload run API metadata does not match payload evidence ref" >&2; exit 1; }
          printf '%s\n' "$payload_artifact_json" > payload-artifact-api.json

      - name: Assemble candidate inputs and prerequisite evidence
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_WORKFLOW: ${{ inputs.evidence_workflow }}
          EVIDENCE_MANIFEST: ${{ inputs.evidence_manifest }}
          EVIDENCE_ARTIFACT: ${{ inputs.evidence_artifact }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
          QUALIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$RELEASE_REF"
          commit_sha="$(git rev-parse HEAD)"
          export COMMIT_SHA="$commit_sha"
          mkdir -p candidate-inputs/evidence
          find_one() {
            local search_root="$1" pattern="$2" label="$3"
            mapfile -t matches < <(find "$search_root" -type f -name "$pattern" -print | sort)
            [[ "${#matches[@]}" -eq 1 ]] || { echo "$label count is ${#matches[@]}" >&2; exit 1; }
            printf '%s\n' "${matches[0]}"
          }
          copy_one() {
            local source="$1" name="$2"
            [[ "$name" != /* && "$name" != *"/"* && "$name" != *"\\"* && "$name" != *".."* ]] || {
              echo "unsafe sealed bundle basename: $name" >&2
              exit 1
            }
            if [[ -e "candidate-inputs/$name" ]]; then
              cmp -s "$source" "candidate-inputs/$name" || {
                echo "sealed bundle basename collision: $name" >&2
                exit 1
              }
              return
            fi
            [[ -f "$source" && ! -L "$source" ]] || { echo "sealed bundle source is not a regular file: $source" >&2; exit 1; }
            cp -- "$source" "candidate-inputs/$name"
            [[ -s "candidate-inputs/$name" ]]
          }
          copy_support_files() {
            local source_root="$1"
            while IFS= read -r -d '' source; do
              local name="${source##*/}"
              case "$name" in
                tauri-release-*.json|tauri-runtime-smoke-*.json|*.spdx.json|*.sig|*.tar.gz|*.zip)
                  copy_one "$source" "$name"
                  ;;
              esac
            done < <(find "$source_root" -type f -print0 | sort -z)
          }
          [[ "$EVIDENCE_MANIFEST" =~ ^[A-Za-z0-9._/-]+$ && "$EVIDENCE_MANIFEST" != /* ]] || {
            echo "evidence_manifest must be a relative POSIX path without shell metacharacters" >&2
            exit 1
          }
          for platform in macos-arm64 linux-x64 windows-x64 windows-arm64; do
            source_dir="incoming/desktop-release-${platform%%-*}"
            [[ "$platform" == "windows-arm64" ]] && source_dir="incoming/desktop-release-windows-arm64"
            manifest="$(find_one "$source_dir" "tauri-release-$platform.json" "$platform manifest")"
            copy_one "$manifest" "tauri-release-$platform.json"
          done
          copy_one "$(find_one incoming/desktop-release-macos '*.dmg' 'macOS package')" "JFTrade-$release_tag-macos-arm64.dmg"
          copy_one "$(find_one incoming/desktop-release-linux '*.AppImage' 'Linux AppImage')" "JFTrade-$release_tag-linux-x64.AppImage"
          copy_one "$(find_one incoming/desktop-release-linux '*.deb' 'Linux deb')" "JFTrade-$release_tag-linux-x64.deb"
          copy_one "$(find_one incoming/desktop-release-linux '*.rpm' 'Linux rpm')" "JFTrade-$release_tag-linux-x64.rpm"
          copy_one "$(find_one incoming/desktop-release-windows '*-setup.exe' 'Windows x64 package')" "JFTrade-$release_tag-windows-x64-setup.exe"
          copy_one "$(find_one incoming/desktop-release-windows-arm64 '*-setup.exe' 'Windows ARM64 package')" "JFTrade-$release_tag-windows-arm64-setup.exe"
          copy_support_files incoming/desktop-release-macos
          copy_support_files incoming/desktop-release-linux
          copy_support_files incoming/desktop-release-windows
          copy_support_files incoming/desktop-release-windows-arm64
          copy_support_files incoming/desktop-release-updater-macos
          copy_support_files incoming/desktop-release-updater-linux
          copy_support_files incoming/desktop-release-updater-windows
          copy_support_files incoming/desktop-release-updater-windows-arm64
          copy_one LICENSE LICENSE
          copy_one docs/legal/third-party-notices.md THIRD-PARTY-NOTICES.md

          node scripts/rust-migration/check-stage9-closeout.mjs --candidate-static > candidate-inputs/evidence/candidate-admission.json
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import { validateExternalEvidenceManifest } from "./scripts/rust-migration/check-release-evidence-inputs.mjs";
          const root = "candidate-inputs";
          const tag = process.env.RELEASE_REF;
          const commitSha = process.env.COMMIT_SHA;
          const sourceRun = {
            id: process.env.SOURCE_RUN_ID,
            attempt: Number(process.env.SOURCE_RUN_ATTEMPT),
            workflow: "desktop-release.yml",
            ref: `refs/tags/${tag}`,
            commitSha,
          };
          const qualificationRun = {
            id: process.env.QUALIFICATION_RUN_ID,
            attempt: Number(process.env.QUALIFICATION_RUN_ATTEMPT),
            workflow: "desktop-release-qualification.yml",
            ref: `refs/tags/${tag}`,
            commitSha,
          };
          const evidenceRoot = path.resolve("incoming/release-evidence");
          const evidenceManifestPath = path.resolve(evidenceRoot, process.env.EVIDENCE_MANIFEST);
          const manifestRelative = path.relative(evidenceRoot, evidenceManifestPath);
          if (!manifestRelative || manifestRelative === ".." || manifestRelative.startsWith(`..${path.sep}`)
            || process.env.EVIDENCE_MANIFEST.split("/").some((part) => !part || part === "." || part === "..")) {
            throw new Error("evidence_manifest must stay inside the downloaded evidence artifact");
          }
          let manifestCursor = evidenceRoot;
          for (const part of manifestRelative.split(path.sep)) {
            manifestCursor = path.join(manifestCursor, part);
            if (fs.lstatSync(manifestCursor).isSymbolicLink()) throw new Error("evidence_manifest must not traverse a symlink");
          }
          const manifest = JSON.parse(fs.readFileSync(evidenceManifestPath, "utf8"));
          const schemaPath = "tests/fixtures/rust-migration/stage9/release-evidence-inputs.schema.json";
          const schema = JSON.parse(fs.readFileSync(schemaPath, "utf8"));
          if (schema.$id !== "https://jftrade.local/schemas/release-evidence-inputs.v2.json"
            || schema.properties?.schemaVersion?.const !== "jftrade.release-evidence-inputs.v2"
            || schema.properties?.workflow?.enum?.length !== 1
            || schema.properties.workflow.enum[0] !== process.env.EVIDENCE_WORKFLOW) {
            throw new Error(`unsupported ${schemaPath}`);
          }
          const payloadMetadata = JSON.parse(fs.readFileSync("incoming/release-evidence/payload-artifact-metadata.json", "utf8"));
          const payloadArtifact = payloadMetadata.artifact;
          const payloadApi = JSON.parse(fs.readFileSync("payload-artifact-api.json", "utf8"));
          if (!payloadArtifact || typeof payloadArtifact !== "object"
            || payloadApi.id !== Number(payloadArtifact.id)
            || payloadApi.name !== payloadArtifact.name
            || payloadApi.digest !== payloadArtifact.digest
            || payloadApi.expired !== false
            || String(payloadApi.workflow_run?.id) !== String(payloadMetadata.payloadRun?.id)) {
            throw new Error("producer payload artifact metadata is not bound to the GitHub artifact API");
          }
          const producerArtifact = manifest.artifact;
          const producerApi = JSON.parse(fs.readFileSync("producer-payload-artifact-api.json", "utf8"));
          if (!producerArtifact || typeof producerArtifact !== "object"
            || producerArtifact.name !== "desktop-release-evidence-payload"
            || producerApi.id !== Number(producerArtifact.id)
            || producerApi.name !== producerArtifact.name
            || producerApi.digest !== producerArtifact.digest
            || producerApi.expired !== false
            || String(producerApi.workflow_run?.id) !== String(process.env.EVIDENCE_RUN_ID)) {
            throw new Error("producer staging artifact metadata is not bound to the GitHub artifact API");
          }
          const payloadBinding = {
            repository: payloadMetadata.repository,
            releaseRef: payloadMetadata.releaseRef,
            ref: payloadMetadata.payloadRun.ref,
            commitSha: payloadMetadata.payloadRun.commitSha,
            workflow: payloadMetadata.payloadRun.workflow,
            runId: Number(payloadMetadata.payloadRun.id),
            attempt: Number(payloadMetadata.payloadRun.attempt),
            artifact: payloadArtifact,
          };
          const expectedKinds = {
            "signed-updater-inputs": "signed-updater",
            "sbom-provenance-inputs": "sbom-provenance",
            "rollback-artifact-pair": "rollback-artifact",
            "backup-restore-drill": "backup-restore",
            "security-review-inputs": "security-review",
          };
          const producerPayloadRoot = path.resolve("incoming/producer-payload");
          for (const id of Object.keys(expectedKinds)) {
            const staged = path.join(producerPayloadRoot, "reports", `${id}.json`);
            if (!fs.existsSync(staged) || fs.lstatSync(staged).isSymbolicLink()) {
              throw new Error(`producer staging payload is missing ${id}`);
            }
          }
          const sourceArtifactMetadata = JSON.parse(fs.readFileSync("source-artifact-metadata.json", "utf8"));
          const sourceArtifacts = sourceArtifactMetadata.releaseArtifacts;
          fs.copyFileSync("source-artifact-metadata.json", path.join(root, "source-artifact-metadata.json"));
          const releaseArtifactPaths = {
            "macos-arm64": [`${root}/JFTrade-${tag}-macos-arm64.dmg`],
            "linux-x64": [
              `${root}/JFTrade-${tag}-linux-x64.AppImage`,
              `${root}/JFTrade-${tag}-linux-x64.deb`,
              `${root}/JFTrade-${tag}-linux-x64.rpm`,
            ],
            "windows-x64": [`${root}/JFTrade-${tag}-windows-x64-setup.exe`],
            "windows-arm64": [`${root}/JFTrade-${tag}-windows-arm64-setup.exe`],
          };
          const releaseArtifactDigests = Object.fromEntries(Object.entries(releaseArtifactPaths).map(([platform, files]) => [
            platform,
            files.map((file) => createHash("sha256").update(fs.readFileSync(file)).digest("hex")),
          ]));
          const externalValidation = validateExternalEvidenceManifest(manifest, {
            baseDirectory: "incoming/release-evidence",
            expected: {
              repository: process.env.REPOSITORY,
              releaseRef: sourceRun.ref,
              ref: sourceRun.ref,
              commitSha,
              workflow: process.env.EVIDENCE_WORKFLOW,
              runId: Number(process.env.EVIDENCE_RUN_ID),
              attempt: Number(process.env.EVIDENCE_RUN_ATTEMPT),
              artifact: producerArtifact,
              sourceBinding: payloadBinding,
            },
            expectedArtifactMetadata: producerArtifact,
            releaseArtifactDigests,
          });
          if (!externalValidation.valid) {
            throw new Error(`external evidence manifest is invalid: ${externalValidation.errors.join("; ")}`);
          }
          const externalRun = {
            id: manifest.runId,
            attempt: manifest.attempt,
            workflow: manifest.workflow,
            ref: manifest.ref,
            commitSha: manifest.commitSha,
          };
          const payloadRun = {
            id: payloadBinding.runId,
            attempt: payloadBinding.attempt,
            workflow: payloadBinding.workflow,
            ref: payloadBinding.ref,
            commitSha: payloadBinding.commitSha,
          };
          const copyReleaseAsset = (sourcePath) => {
            const name = path.basename(sourcePath);
            if (!(name.endsWith(".sig") || name.endsWith(".tar.gz") || name.endsWith(".zip")
              || name === "latest.json" || name === "updater.json" || (name.startsWith("latest-") && name.endsWith(".json")))) return;
            const sourceRoot = path.resolve("incoming/release-evidence");
            const outside = path.relative(sourceRoot, path.resolve(sourcePath));
            if (outside === ".." || outside.startsWith(`..${path.sep}`)) throw new Error(`release asset escapes evidence artifact: ${name}`);
            let cursor = sourceRoot;
            for (const part of outside.split(path.sep).filter(Boolean)) {
              cursor = path.join(cursor, part);
              if (fs.lstatSync(cursor).isSymbolicLink()) throw new Error(`release asset traverses symlink: ${name}`);
            }
            const target = path.resolve(root, name);
            if (fs.existsSync(target)) {
              if (!fs.lstatSync(target).isFile() || !fs.readFileSync(target).equals(fs.readFileSync(sourcePath))) throw new Error(`release asset basename collision: ${name}`);
              return;
            }
            fs.copyFileSync(sourcePath, target);
          };
          const prerequisites = [
            {
              id: "candidate-admission",
              kind: "stage9-closeout-admission",
              status: "passed",
              releaseRef: sourceRun.ref,
              commitSha,
              workflowRun: qualificationRun,
              sourceWorkflowRun: sourceRun,
              evidence: [{
                path: "evidence/candidate-admission.json",
                kind: "stage9-closeout-admission",
                schemaVersion: "jftrade.stage9-closeout-admission.v1",
              }],
            },
            ...Object.entries(expectedKinds).map(([id, kind]) => {
              const entry = manifest.evidence?.[id];
              if (!entry || entry.kind !== kind || !Array.isArray(entry.files) || entry.files.length !== 1) {
                throw new Error(`external evidence manifest missing valid ${id}`);
              }
              const evidence = entry.files.map((file) => {
                const relative = file.path;
                const source = path.resolve("incoming/release-evidence", relative);
                const staged = path.join(producerPayloadRoot, "reports", `${id}.json`);
                if (!fs.readFileSync(source).equals(fs.readFileSync(staged))) {
                  throw new Error(`${id} report is not byte-identical to producer staging payload`);
                }
                if (id === "signed-updater-inputs") copyReleaseAsset(source);
                const target = path.resolve("candidate-inputs/evidence", id, relative);
                if (!target.startsWith(`${path.resolve("candidate-inputs/evidence", id)}${path.sep}`)) {
                  throw new Error(`${id} target path escapes candidate evidence directory`);
                }
                if (fs.existsSync(target)) throw new Error(`${id} evidence target collides: ${relative}`);
                fs.mkdirSync(path.dirname(target), { recursive: true });
                fs.copyFileSync(source, target);
                return {
                  path: path.relative(root, target).split(path.sep).join("/"),
                  sha256: file.sha256,
                  size: file.size,
                  kind,
                  schemaVersion: file.schemaVersion,
                };
              });
              return {
                id,
                kind,
                status: "passed",
                releaseRef: sourceRun.ref,
                commitSha,
                workflowRun: qualificationRun,
                sourceWorkflowRun: payloadRun,
                evidence,
              };
            }),
          ];
          const packageFor = (platform, names) => ({
            manifest: `tauri-release-${platform}.json`,
            artifacts: names.map((name) => ({ path: name })),
          });
          const config = {
            baseDirectory: root,
            releaseRef: sourceRun.ref,
            releaseTag: tag,
            commitSha,
            workflowRun: qualificationRun,
            sourceWorkflowRun: sourceRun,
            sourceArtifacts,
            platforms: {
              "macos-arm64": packageFor("macos-arm64", [`JFTrade-${tag}-macos-arm64.dmg`]),
              "linux-x64": packageFor("linux-x64", [`JFTrade-${tag}-linux-x64.AppImage`, `JFTrade-${tag}-linux-x64.deb`, `JFTrade-${tag}-linux-x64.rpm`]),
              "windows-x64": packageFor("windows-x64", [`JFTrade-${tag}-windows-x64-setup.exe`]),
              "windows-arm64": packageFor("windows-arm64", [`JFTrade-${tag}-windows-arm64-setup.exe`]),
            },
            sha256sums: "SHA256SUMS",
            prerequisites,
          };
          fs.writeFileSync("candidate-evidence-config.json", `${JSON.stringify(config, null, 2)}\n`);
          NODE
          (cd candidate-inputs && find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name source-artifact-metadata.json -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Build and validate candidate evidence
        run: |
          set -euo pipefail
          mkdir -p candidate-output
          node scripts/rust-migration/check-release-candidate.mjs \
            --build \
            --config candidate-evidence-config.json \
            --base-dir candidate-inputs \
            --output candidate-output/release-candidate-evidence.json \
            --expected-ref "refs/tags/${{ inputs.release_ref }}" \
            --expected-tag "${{ inputs.release_ref }}" \
            --expected-commit "$(git rev-parse HEAD)" \
            --expected-run-id "${{ github.run_id }}" \
            --expected-attempt "${{ github.run_attempt }}" \
            --expected-workflow "desktop-release-qualification.yml"

      - name: Seal immutable release candidate bundle
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          COMMIT_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
          QUALIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cp -- candidate-output/release-candidate-evidence.json candidate-inputs/release-candidate-evidence.json
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          const root = path.resolve("candidate-inputs");
          const hash = (file) => createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          const canonicalPath = path.join(root, "release-candidate-evidence.json");
          const canonical = JSON.parse(fs.readFileSync(canonicalPath, "utf8"));
          const sourceMetadata = JSON.parse(fs.readFileSync(path.join(root, "source-artifact-metadata.json"), "utf8"));
          const sourceArtifacts = sourceMetadata.releaseArtifacts;
          const sourceUpdaterArtifacts = sourceMetadata.updaterArtifacts;
          const requiredSource = ["desktop-release-linux", "desktop-release-macos", "desktop-release-windows", "desktop-release-windows-arm64"];
          const requiredUpdater = ["desktop-release-updater-linux", "desktop-release-updater-macos", "desktop-release-updater-windows", "desktop-release-updater-windows-arm64"];
          const exact = (values, names, label) => {
            if (!Array.isArray(values) || values.length !== names.length || new Set(values.map((entry) => entry?.name)).size !== names.length
              || names.some((name) => !values.some((entry) => entry?.name === name))) throw new Error(`${label} is not exactly the required artifact set`);
            return values;
          };
          exact(sourceArtifacts, requiredSource, "sourceArtifacts");
          exact(sourceUpdaterArtifacts, requiredUpdater, "sourceUpdaterArtifacts");
          const files = [];
          for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
            if (!entry.isFile() || entry.name === "source-artifact-metadata.json" || entry.name === "release-candidate-evidence.json" || entry.name === "sealed-release-bundle.json") continue;
            const file = path.join(root, entry.name);
            const stat = fs.lstatSync(file);
            if (stat.isSymbolicLink() || stat.size <= 0) throw new Error(`sealed release file is not a regular non-empty file: ${entry.name}`);
            files.push({ path: entry.name, size: stat.size, sha256: hash(file) });
          }
          files.sort((left, right) => left.path.localeCompare(right.path));
          const qualificationRun = {
            id: process.env.QUALIFICATION_RUN_ID,
            attempt: Number(process.env.QUALIFICATION_RUN_ATTEMPT),
            workflow: "desktop-release-qualification.yml",
            ref: `refs/tags/${process.env.RELEASE_REF}`,
            commitSha: process.env.COMMIT_SHA,
          };
          const sourceWorkflowRun = {
            id: process.env.SOURCE_RUN_ID,
            attempt: Number(process.env.SOURCE_RUN_ATTEMPT),
            workflow: "desktop-release.yml",
            ref: `refs/tags/${process.env.RELEASE_REF}`,
            commitSha: process.env.COMMIT_SHA,
          };
          const manifest = {
            $schema: "./sealed-release-bundle.schema.json",
            schemaVersion: "jftrade.sealed-release-bundle.v1",
            repository: process.env.REPOSITORY,
            releaseRef: sourceWorkflowRun.ref,
            releaseTag: process.env.RELEASE_REF,
            commitSha: process.env.COMMIT_SHA,
            qualificationRun,
            sourceWorkflowRun,
            sourceArtifacts,
            sourceUpdaterArtifacts,
            canonicalEvidence: {
              path: "release-candidate-evidence.json",
              size: fs.statSync(canonicalPath).size,
              sha256: hash(canonicalPath),
            },
            files,
          };
          fs.writeFileSync(path.join(root, "sealed-release-bundle.json"), `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          rm -rf sealed-release-check
          mkdir sealed-release-check
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const root = path.resolve("candidate-inputs");
          const target = path.resolve("sealed-release-check");
          const manifest = JSON.parse(fs.readFileSync(path.join(root, "sealed-release-bundle.json"), "utf8"));
          for (const entry of manifest.files) fs.copyFileSync(path.join(root, entry.path), path.join(target, entry.path));
          NODE
          node scripts/rust-migration/check-release-candidate-bundle.mjs \
            --sealed-manifest candidate-inputs/sealed-release-bundle.json \
            --evidence candidate-inputs/release-candidate-evidence.json \
            --candidate-root candidate-inputs \
            --release-root sealed-release-check
          node scripts/rust-migration/check-release-candidate.mjs \
            --check \
            --input candidate-output/release-candidate-evidence.json \
            --base-dir candidate-inputs \
            --expected-ref "refs/tags/${{ inputs.release_ref }}" \
            --expected-tag "${{ inputs.release_ref }}" \
            --expected-commit "$(git rev-parse HEAD)" \
            --expected-run-id "${{ github.run_id }}" \
            --expected-attempt "${{ github.run_attempt }}" \
            --expected-workflow "desktop-release-qualification.yml"

      - name: Upload artifact-bound qualification config
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-candidate-evidence
          path: |
            candidate-evidence-config.json
            candidate-output/release-candidate-evidence.json
            candidate-inputs/**
            source-artifact-metadata.json
          if-no-files-found: error
