name: Desktop Release Qualification

on:
  workflow_dispatch:
    inputs:
      qualification_mode:
        description: Produce an unsigned rehearsal receipt or a formal signed candidate
        required: true
        default: rehearsal
        type: choice
        options:
          - rehearsal
          - candidate
      candidate_ref:
        description: Exact candidate branch ref shared by all source and evidence runs
        required: true
        default: refs/heads/release/0.29.0-candidate
        type: string
      planned_release_tag:
        description: Planned vX.Y.Z tag; qualification does not require it to exist
        required: true
        default: v0.29.0
        type: string
      source_run_id:
        description: Successful Desktop Release run containing the four platform package artifacts
        required: true
        type: string
      source_run_attempt:
        description: Attempt of the source Desktop Release dry-run
        required: false
        default: "1"
        type: string
      evidence_run_id:
        description: Successful signing/evidence workflow run containing externally produced updater, SBOM, rollback, backup and security evidence
        required: true
        type: string
      evidence_run_attempt:
        description: Attempt of the external signing/evidence workflow run
        required: true
        type: string
      evidence_workflow:
        description: Workflow filename that produced the external evidence artifact
        required: true
        type: string
      evidence_artifact:
        description: Exact producer binding artifact containing release-evidence-inputs.json and payload-bound prerequisite files
        required: true
        type: string
      evidence_manifest:
        description: Relative manifest path inside evidence_artifact
        required: false
        default: release-evidence-inputs.json
        type: string

permissions: {}

jobs:
  qualify:
    name: Build artifact-bound candidate evidence
    if: inputs.qualification_mode == 'candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0

      - name: Verify source release run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          RELEASE_REF: ${{ inputs.planned_release_tag }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          MAX_SAFE_INTEGER_TEXT=9007199254740991
          safe_positive_integer() {
            local value="$1" label="$2"
            if [[ ! "$value" =~ ^[1-9][0-9]*$ ]] || (( ${#value} > ${#MAX_SAFE_INTEGER_TEXT} )) \
              || { (( ${#value} == ${#MAX_SAFE_INTEGER_TEXT} )) && [[ "$value" > "$MAX_SAFE_INTEGER_TEXT" ]]; }; then
              echo "$label must be a safe positive integer" >&2
              return 1
            fi
            printf '%s\n' "$value"
          }
          SOURCE_RUN_ID="$(safe_positive_integer "$SOURCE_RUN_ID" source_run_id)"
          SOURCE_RUN_ATTEMPT="$(safe_positive_integer "$SOURCE_RUN_ATTEMPT" source_run_attempt)"
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release_ref must be a vX.Y.Z tag" >&2; exit 1; }
          [[ "$CANDIDATE_REF" =~ ^refs/heads/[A-Za-z0-9._/-]+$ && "$CANDIDATE_REF" != *".."* ]] || { echo "candidate_ref is unsafe" >&2; exit 1; }
          [[ "$GITHUB_REF" == "$CANDIDATE_REF" ]] || {
            echo "Qualification must be dispatched from candidate_ref; selected ref is $GITHUB_REF" >&2
            exit 1
          }
          commit_sha="$(git rev-parse HEAD)"
          [[ "$GITHUB_SHA" == "$commit_sha" ]] || { echo "qualification GITHUB_SHA does not match the candidate commit" >&2; exit 1; }
          run_json="$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          candidate_branch="${CANDIDATE_REF#refs/heads/}"
          jq -e \
            --arg sha "$commit_sha" \
            --arg branch "$candidate_branch" \
            --arg attempt "$SOURCE_RUN_ATTEMPT" \
            'def safe_positive_integer_text: if type == "number" then if isfinite and floor == . and . > 0 and . <= 9007199254740991 then tostring else null end elif type == "string" then (sub("^\\s+"; "") | sub("\\s+$"; "")) as $text | if ($text | test("^[1-9][0-9]*$")) and (($text|length) < 16 or (($text|length) == 16 and $text <= "9007199254740991")) then $text else null end else null end; def safe_integer_equals($expected): (safe_positive_integer_text) as $actual | ($expected | safe_positive_integer_text) as $wanted | $actual != null and $wanted != null and $actual == $wanted; .status == "completed" and .conclusion == "success" and .head_sha == $sha and .head_branch == $branch and (.run_attempt | safe_integer_equals($attempt)) and (.path == ".github/workflows/desktop-release.yml" or .path == "desktop-release.yml")' \
            <<<"$run_json" >/dev/null || {
            echo "source run is not a successful Desktop Release run bound to $CANDIDATE_REF@$commit_sha attempt $SOURCE_RUN_ATTEMPT" >&2
            exit 1
          }
          source_artifacts_json="$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          jq -e --arg run_id "$SOURCE_RUN_ID" \
            'def safe_positive_integer_text: if type == "number" then if isfinite and floor == . and . > 0 and . <= 9007199254740991 then tostring else null end elif type == "string" then (sub("^\\s+"; "") | sub("\\s+$"; "")) as $text | if ($text | test("^[1-9][0-9]*$")) and (($text|length) < 16 or (($text|length) == 16 and $text <= "9007199254740991")) then $text else null end else null end; def safe_integer_equals($expected): (safe_positive_integer_text) as $actual | ($expected | safe_positive_integer_text) as $wanted | $actual != null and $wanted != null and $actual == $wanted; [.artifacts[] | select((.name == "desktop-release-macos" or .name == "desktop-release-linux" or .name == "desktop-release-windows" or .name == "desktop-release-windows-arm64") and ((.id | safe_positive_integer_text) != null) and (.expired == false) and (.workflow_run.id | safe_integer_equals($run_id)) and ((.digest|type) == "string") and (.digest|test("^sha256:[0-9a-f]{64}$")))] | select(length == 4) | select([.[].name] | sort == ["desktop-release-linux", "desktop-release-macos", "desktop-release-windows", "desktop-release-windows-arm64"])' \
            <<<"$source_artifacts_json" >/dev/null || {
            echo "source release artifacts are missing, expired, ambiguous, or lack API digests" >&2
            exit 1
          }
          jq -e --arg run_id "$SOURCE_RUN_ID" \
            'def safe_positive_integer_text: if type == "number" then if isfinite and floor == . and . > 0 and . <= 9007199254740991 then tostring else null end elif type == "string" then (sub("^\\s+"; "") | sub("\\s+$"; "")) as $text | if ($text | test("^[1-9][0-9]*$")) and (($text|length) < 16 or (($text|length) == 16 and $text <= "9007199254740991")) then $text else null end else null end; def safe_integer_equals($expected): (safe_positive_integer_text) as $actual | ($expected | safe_positive_integer_text) as $wanted | $actual != null and $wanted != null and $actual == $wanted; [.artifacts[] | select((.name == "desktop-release-updater-macos" or .name == "desktop-release-updater-linux" or .name == "desktop-release-updater-windows" or .name == "desktop-release-updater-windows-arm64") and ((.id | safe_positive_integer_text) != null) and (.expired == false) and (.workflow_run.id | safe_integer_equals($run_id)) and ((.digest|type) == "string") and (.digest|test("^sha256:[0-9a-f]{64}$")))] | select(length == 4) | select([.[].name] | sort == ["desktop-release-updater-linux", "desktop-release-updater-macos", "desktop-release-updater-windows", "desktop-release-updater-windows-arm64"])' \
            <<<"$source_artifacts_json" >/dev/null || {
            echo "source updater artifacts are missing, expired, ambiguous, or lack API digests" >&2
            exit 1
          }
          jq -c --arg run_id "$SOURCE_RUN_ID" --argjson run_attempt "$SOURCE_RUN_ATTEMPT" \
            --arg ref "$CANDIDATE_REF" --arg commit_sha "$commit_sha" \
            'def safe_positive_integer_text: if type == "number" then if isfinite and floor == . and . > 0 and . <= 9007199254740991 then tostring else null end elif type == "string" then (sub("^\\s+"; "") | sub("\\s+$"; "")) as $text | if ($text | test("^[1-9][0-9]*$")) and (($text|length) < 16 or (($text|length) == 16 and $text <= "9007199254740991")) then $text else null end else null end; def safe_integer_equals($expected): (safe_positive_integer_text) as $actual | ($expected | safe_positive_integer_text) as $wanted | $actual != null and $wanted != null and $actual == $wanted; {releaseArtifacts: [.artifacts[] | select(.name == "desktop-release-macos" or .name == "desktop-release-linux" or .name == "desktop-release-windows" or .name == "desktop-release-windows-arm64") | select((.id | safe_positive_integer_text) != null) | select(.workflow_run.id | safe_integer_equals($run_id)) | {name, id, digest, expired, runId: .workflow_run.id, runAttempt: $run_attempt, workflow: "desktop-release.yml", ref: $ref, commitSha: $commit_sha}] | sort_by(.name), updaterArtifacts: [.artifacts[] | select(.name == "desktop-release-updater-macos" or .name == "desktop-release-updater-linux" or .name == "desktop-release-updater-windows" or .name == "desktop-release-updater-windows-arm64") | select((.id | safe_positive_integer_text) != null) | select(.workflow_run.id | safe_integer_equals($run_id)) | {name, id, digest, expired, runId: .workflow_run.id, runAttempt: $run_attempt, workflow: "desktop-release.yml", ref: $ref, commitSha: $commit_sha}] | sort_by(.name)}' \
            <<<"$source_artifacts_json" > source-artifact-metadata.json

      - name: Verify external release evidence run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_WORKFLOW: ${{ inputs.evidence_workflow }}
          EVIDENCE_ARTIFACT: ${{ inputs.evidence_artifact }}
          RELEASE_REF: ${{ inputs.planned_release_tag }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          MAX_SAFE_INTEGER_TEXT=9007199254740991
          safe_positive_integer() {
            local value="$1" label="$2"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            if [[ ! "$value" =~ ^[1-9][0-9]*$ ]] || (( ${#value} > ${#MAX_SAFE_INTEGER_TEXT} )) \
              || { (( ${#value} == ${#MAX_SAFE_INTEGER_TEXT} )) && [[ "$value" > "$MAX_SAFE_INTEGER_TEXT" ]]; }; then
              echo "$label must be a safe positive integer" >&2
              return 1
            fi
            printf '%s\n' "$value"
          }
          EVIDENCE_RUN_ID="$(safe_positive_integer "$EVIDENCE_RUN_ID" evidence_run_id)"
          EVIDENCE_RUN_ATTEMPT="$(safe_positive_integer "$EVIDENCE_RUN_ATTEMPT" evidence_run_attempt)"
          [[ "$EVIDENCE_WORKFLOW" == "desktop-release-evidence.yml" ]] || { echo "evidence_workflow is not a trusted producer workflow" >&2; exit 1; }
          [[ "$EVIDENCE_ARTIFACT" == "desktop-release-evidence-bound" ]] || { echo "candidate qualification only trusts desktop-release-evidence-bound" >&2; exit 1; }
          run_json="$(gh api "repos/$REPOSITORY/actions/runs/$EVIDENCE_RUN_ID")"
          commit_sha="$(git rev-parse HEAD)"
          candidate_branch="${CANDIDATE_REF#refs/heads/}"
          jq -e \
            --arg sha "$commit_sha" \
            --arg branch "$candidate_branch" \
            --arg attempt "$EVIDENCE_RUN_ATTEMPT" \
            --arg workflow ".github/workflows/$EVIDENCE_WORKFLOW" \
            'def safe_positive_integer_text: if type == "number" then if isfinite and floor == . and . > 0 and . <= 9007199254740991 then tostring else null end elif type == "string" then (sub("^\\s+"; "") | sub("\\s+$"; "")) as $text | if ($text | test("^[1-9][0-9]*$")) and (($text|length) < 16 or (($text|length) == 16 and $text <= "9007199254740991")) then $text else null end else null end; def safe_integer_equals($expected): (safe_positive_integer_text) as $actual | ($expected | safe_positive_integer_text) as $wanted | $actual != null and $wanted != null and $actual == $wanted; .status == "completed" and .conclusion == "success" and .head_sha == $sha and .head_branch == $branch and (.run_attempt | safe_integer_equals($attempt)) and (.path == $workflow or .path == ($workflow | sub("^\.github/workflows/"; "")))' \
            <<<"$run_json" >/dev/null || {
            echo "external evidence run is not a successful workflow bound to $CANDIDATE_REF@$commit_sha attempt $EVIDENCE_RUN_ATTEMPT" >&2
            exit 1
          }
          artifacts_json="$(gh api "repos/$REPOSITORY/actions/runs/$EVIDENCE_RUN_ID/artifacts?per_page=100")"
          artifact_matches="$(jq -c \
            --arg name "$EVIDENCE_ARTIFACT" \
            --arg run_id "$EVIDENCE_RUN_ID" \
            'def safe_positive_integer_text: if type == "number" then if isfinite and floor == . and . > 0 and . <= 9007199254740991 then tostring else null end elif type == "string" then (sub("^\\s+"; "") | sub("\\s+$"; "")) as $text | if ($text | test("^[1-9][0-9]*$")) and (($text|length) < 16 or (($text|length) == 16 and $text <= "9007199254740991")) then $text else null end else null end; def safe_integer_equals($expected): (safe_positive_integer_text) as $actual | ($expected | safe_positive_integer_text) as $wanted | $actual != null and $wanted != null and $actual == $wanted; [.artifacts[] | select((.id | safe_positive_integer_text) != null) | select(.name == $name and .expired == false and (.workflow_run.id | safe_integer_equals($run_id)) and (.digest | type == "string") and (.digest | test("^sha256:[0-9a-f]{64}$"))) | {id, name, digest, runId: .workflow_run.id}]' \
            <<<"$artifacts_json")"
          [[ "$(jq 'length' <<<"$artifact_matches")" == "1" ]] || {
            echo "external evidence artifact metadata is missing, ambiguous, expired, or lacks a digest" >&2
            exit 1
          }
          evidence_artifact_id="$(jq -r '.[0].id' <<<"$artifact_matches")"
          evidence_artifact_id="$(safe_positive_integer "$evidence_artifact_id" evidence_artifact_id)"
          evidence_artifact_digest="$(jq -r '.[0].digest' <<<"$artifact_matches")"
          evidence_artifact_json="$(gh api "repos/$REPOSITORY/actions/artifacts/$evidence_artifact_id")"
          jq -e \
            --arg name "$EVIDENCE_ARTIFACT" \
            --arg digest "$evidence_artifact_digest" \
            --arg id "$evidence_artifact_id" \
            --arg run_id "$EVIDENCE_RUN_ID" \
            'def safe_positive_integer_text: if type == "number" then if isfinite and floor == . and . > 0 and . <= 9007199254740991 then tostring else null end elif type == "string" then (sub("^\\s+"; "") | sub("\\s+$"; "")) as $text | if ($text | test("^[1-9][0-9]*$")) and (($text|length) < 16 or (($text|length) == 16 and $text <= "9007199254740991")) then $text else null end else null end; def safe_integer_equals($expected): (safe_positive_integer_text) as $actual | ($expected | safe_positive_integer_text) as $wanted | $actual != null and $wanted != null and $actual == $wanted; (.id | safe_integer_equals($id)) and .name == $name and .digest == $digest and .expired == false and (.workflow_run.id | safe_integer_equals($run_id))' \
            <<<"$evidence_artifact_json" >/dev/null || {
            echo "external evidence artifact detail does not match run metadata" >&2
            exit 1
          }
          jq --argjson attempt "$EVIDENCE_RUN_ATTEMPT" '.[0] + {runAttempt: $attempt}' <<<"$artifact_matches" > evidence-artifact-metadata.json
          printf '%s\n' "$evidence_artifact_json" > evidence-bound-artifact-api.json

      - name: Download producer binding artifact by immutable id
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVIDENCE_ARTIFACT_ID_FILE: evidence-artifact-metadata.json
        shell: bash
        run: |
          set -euo pipefail
          MAX_SAFE_INTEGER_TEXT=9007199254740991
          safe_positive_integer() {
            local value="$1" label="$2"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            if [[ ! "$value" =~ ^[1-9][0-9]*$ ]] || (( ${#value} > ${#MAX_SAFE_INTEGER_TEXT} )) \
              || { (( ${#value} == ${#MAX_SAFE_INTEGER_TEXT} )) && [[ "$value" > "$MAX_SAFE_INTEGER_TEXT" ]]; }; then
              echo "$label must be a safe positive integer" >&2
              return 1
            fi
            printf '%s\n' "$value"
          }
          artifact_id="$(jq -r '.id // empty' "$EVIDENCE_ARTIFACT_ID_FILE")"
          artifact_id="$(safe_positive_integer "$artifact_id" producer_binding_artifact_id)"
          rm -rf incoming/release-evidence
          mkdir -p incoming/release-evidence
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          gh api -H "Accept: application/vnd.github+json" -H "Accept: application/zip" \
            "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > "$archive"
          while IFS= read -r entry; do
            [[ "$entry" != /* && "$entry" != *".."* && "$entry" != *"\\"* ]] || { echo "unsafe evidence archive path: $entry" >&2; exit 1; }
          done < <(unzip -Z1 "$archive")
          unzip -q "$archive" -d incoming/release-evidence
          [[ -z "$(find incoming/release-evidence -type l -print -quit)" ]] || { echo "producer binding archive must not contain symlinks" >&2; exit 1; }
          [[ -f incoming/release-evidence/release-evidence-inputs.json ]] || { echo "producer binding archive has no release-evidence-inputs.json" >&2; exit 1; }

      - name: Download source artifacts by immutable ids
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          MAX_SAFE_INTEGER_TEXT=9007199254740991
          safe_positive_integer() {
            local value="$1" label="$2"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            if [[ ! "$value" =~ ^[1-9][0-9]*$ ]] || (( ${#value} > ${#MAX_SAFE_INTEGER_TEXT} )) \
              || { (( ${#value} == ${#MAX_SAFE_INTEGER_TEXT} )) && [[ "$value" > "$MAX_SAFE_INTEGER_TEXT" ]]; }; then
              echo "$label must be a safe positive integer" >&2
              return 1
            fi
            printf '%s\n' "$value"
          }
          mkdir -p incoming
          while IFS= read -r item; do
            name="$(jq -r '.name' <<<"$item")"
            artifact_id="$(jq -r '.id' <<<"$item")"
            artifact_id="$(safe_positive_integer "$artifact_id" "source artifact id ($name)")"
            case "$name" in
              desktop-release-macos) destination="incoming/desktop-release-macos" ;;
              desktop-release-linux) destination="incoming/desktop-release-linux" ;;
              desktop-release-windows) destination="incoming/desktop-release-windows" ;;
              desktop-release-windows-arm64) destination="incoming/desktop-release-windows-arm64" ;;
              desktop-release-updater-macos) destination="incoming/desktop-release-updater-macos" ;;
              desktop-release-updater-linux) destination="incoming/desktop-release-updater-linux" ;;
              desktop-release-updater-windows) destination="incoming/desktop-release-updater-windows" ;;
              desktop-release-updater-windows-arm64) destination="incoming/desktop-release-updater-windows-arm64" ;;
              *) echo "unexpected source artifact: $name" >&2; exit 1 ;;
            esac
            rm -rf "$destination"
            mkdir -p "$destination"
            archive="$(mktemp)"
            trap 'rm -f "$archive"' EXIT
            gh api -H "Accept: application/vnd.github+json" -H "Accept: application/zip" \
              "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > "$archive"
            while IFS= read -r entry; do
              [[ "$entry" != /* && "$entry" != *".."* && "$entry" != *"\\"* ]] || { echo "unsafe source archive path: $entry" >&2; exit 1; }
            done < <(unzip -Z1 "$archive")
            unzip -q "$archive" -d "$destination"
            [[ -z "$(find "$destination" -type l -print -quit)" ]] || { echo "source artifact archive must not contain symlinks: $name" >&2; exit 1; }
            rm -f "$archive"
          done < <(jq -c '.releaseArtifacts[], .updaterArtifacts[]' source-artifact-metadata.json)

      - name: Verify producer binding and payload artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ inputs.planned_release_tag }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_WORKFLOW: ${{ inputs.evidence_workflow }}
        shell: bash
        run: |
          set -euo pipefail
          MAX_SAFE_INTEGER_TEXT=9007199254740991
          safe_positive_integer() {
            local value="$1" label="$2"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            if [[ ! "$value" =~ ^[1-9][0-9]*$ ]] || (( ${#value} > ${#MAX_SAFE_INTEGER_TEXT} )) \
              || { (( ${#value} == ${#MAX_SAFE_INTEGER_TEXT} )) && [[ "$value" > "$MAX_SAFE_INTEGER_TEXT" ]]; }; then
              echo "$label must be a safe positive integer" >&2
              return 1
            fi
            printf '%s\n' "$value"
          }
          EVIDENCE_RUN_ID="$(safe_positive_integer "$EVIDENCE_RUN_ID" evidence_run_id)"
          EVIDENCE_RUN_ATTEMPT="$(safe_positive_integer "$EVIDENCE_RUN_ATTEMPT" evidence_run_attempt)"
          mapfile -t manifest_matches < <(find incoming/release-evidence -type f -name release-evidence-inputs.json -print | sort)
          [[ "${#manifest_matches[@]}" -eq 1 ]] || { echo "producer binding artifact must contain exactly one release-evidence-inputs.json" >&2; exit 1; }
          manifest_path="${manifest_matches[0]}"
          mapfile -t payload_metadata_matches < <(find incoming/release-evidence -type f -name payload-artifact-metadata.json -print | sort)
          [[ "${#payload_metadata_matches[@]}" -eq 1 ]] || { echo "producer binding artifact must contain exactly one payload-artifact-metadata.json" >&2; exit 1; }
          payload_metadata="${payload_metadata_matches[0]}"
          [[ -z "$(find incoming/release-evidence -type l -print -quit)" ]] || { echo "producer binding artifact must not contain symlinks" >&2; exit 1; }
          release_commit="$(git rev-parse HEAD)"
          jq -e \
            --arg repository "$REPOSITORY" \
            --arg release_ref "$CANDIDATE_REF" \
            --arg commit "$release_commit" \
            --arg workflow "$EVIDENCE_WORKFLOW" \
            --arg run_id "$EVIDENCE_RUN_ID" \
            --arg attempt "$EVIDENCE_RUN_ATTEMPT" \
            'def safe_positive_integer_text: if type == "number" then if isfinite and floor == . and . > 0 and . <= 9007199254740991 then tostring else null end elif type == "string" then (sub("^\\s+"; "") | sub("\\s+$"; "")) as $text | if ($text | test("^[1-9][0-9]*$")) and (($text|length) < 16 or (($text|length) == 16 and $text <= "9007199254740991")) then $text else null end else null end; def safe_integer_equals($expected): (safe_positive_integer_text) as $actual | ($expected | safe_positive_integer_text) as $wanted | $actual != null and $wanted != null and $actual == $wanted; .repository == $repository and .releaseRef == $release_ref and .ref == $release_ref and .commitSha == $commit and .workflow == $workflow and (.runId | safe_integer_equals($run_id)) and (.attempt | safe_integer_equals($attempt))' \
            "$manifest_path" >/dev/null || { echo "producer manifest is not bound to qualification release or producer run" >&2; exit 1; }
          payload_id="$(jq -r '.artifact.id // empty' "$payload_metadata")"
          payload_id="$(safe_positive_integer "$payload_id" payload_id)"
          payload_name="$(jq -r '.artifact.name // empty' "$payload_metadata")"
          payload_digest="$(jq -r '.artifact.digest // empty' "$payload_metadata")"
          payload_run_id="$(jq -r '.payloadRun.id // empty' "$payload_metadata")"
          payload_run_id="$(safe_positive_integer "$payload_run_id" payload_run_id)"
          payload_run_attempt="$(jq -r '.payloadRun.attempt // empty' "$payload_metadata")"
          payload_run_attempt="$(safe_positive_integer "$payload_run_attempt" payload_run_attempt)"
          payload_workflow="$(jq -r '.payloadRun.workflow // empty' "$payload_metadata")"
          payload_ref="$(jq -r '.payloadRun.ref // empty' "$payload_metadata")"
          payload_commit="$(jq -r '.payloadRun.commitSha // empty' "$payload_metadata")"
          evidence_ref="$(jq -r '.evidenceRef // empty' "$payload_metadata")"
          payload_release_ref="$(jq -r '.releaseRef // empty' "$payload_metadata")"
