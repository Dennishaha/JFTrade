            ],
            "windows-x64": [`${root}/JFTrade-${tag}-windows-x64-setup.exe`],
            "windows-arm64": [`${root}/JFTrade-${tag}-windows-arm64-setup.exe`],
          };
          const releaseArtifactDigests = Object.fromEntries(Object.entries(releaseArtifactPaths).map(([platform, files]) => [
            platform,
            files.map((file) => createHash("sha256").update(fs.readFileSync(file)).digest("hex")),
          ]));
          const externalValidation = validateExternalEvidenceManifest(manifest, {
            baseDirectory: "incoming/release-evidence",
            expected: {
              repository: process.env.REPOSITORY,
              releaseRef: sourceRun.ref,
              ref: sourceRun.ref,
              commitSha,
              workflow: process.env.EVIDENCE_WORKFLOW,
              runId: evidenceRunId,
              attempt: Number(evidenceRunAttempt),
              artifact: producerArtifact,
              sourceBinding: payloadBinding,
            },
            expectedArtifactMetadata: producerArtifact,
            releaseArtifactDigests,
          });
          if (!externalValidation.valid) {
            throw new Error(`external evidence manifest is invalid: ${externalValidation.errors.join("; ")}`);
          }
          const externalRun = {
            id: manifest.runId,
            attempt: manifest.attempt,
            workflow: manifest.workflow,
            ref: manifest.ref,
            commitSha: manifest.commitSha,
          };
          const payloadRun = {
            id: payloadBinding.runId,
            attempt: payloadBinding.attempt,
            workflow: payloadBinding.workflow,
            ref: payloadBinding.ref,
            commitSha: payloadBinding.commitSha,
          };
          const copyReleaseAsset = (sourcePath) => {
            const name = path.basename(sourcePath);
            if (!(name.endsWith(".sig") || name.endsWith(".tar.gz") || name.endsWith(".zip")
              || name === "latest.json" || name === "updater.json" || (name.startsWith("latest-") && name.endsWith(".json")))) return;
            const sourceRoot = path.resolve("incoming/release-evidence");
            const outside = path.relative(sourceRoot, path.resolve(sourcePath));
            if (outside === ".." || outside.startsWith(`..${path.sep}`)) throw new Error(`release asset escapes evidence artifact: ${name}`);
            let cursor = sourceRoot;
            for (const part of outside.split(path.sep).filter(Boolean)) {
              cursor = path.join(cursor, part);
              if (fs.lstatSync(cursor).isSymbolicLink()) throw new Error(`release asset traverses symlink: ${name}`);
            }
            const target = path.resolve(root, name);
            if (fs.existsSync(target)) {
              if (!fs.lstatSync(target).isFile() || !fs.readFileSync(target).equals(fs.readFileSync(sourcePath))) throw new Error(`release asset basename collision: ${name}`);
              return;
            }
            fs.copyFileSync(sourcePath, target);
          };
          const prerequisites = [
            {
              id: "candidate-admission",
              kind: "stage9-closeout-admission",
              status: "passed",
              releaseRef: sourceRun.ref,
              commitSha,
              workflowRun: qualificationRun,
              sourceWorkflowRun: sourceRun,
              evidence: [{
                path: "evidence/candidate-admission.json",
                kind: "stage9-closeout-admission",
                schemaVersion: "jftrade.stage9-closeout-admission.v1",
              }],
            },
            ...Object.entries(expectedKinds).map(([id, kind]) => {
              const entry = manifest.evidence?.[id];
              if (!entry || entry.kind !== kind || !Array.isArray(entry.files) || entry.files.length !== 1) {
                throw new Error(`external evidence manifest missing valid ${id}`);
              }
              const evidence = entry.files.map((file) => {
                const relative = file.path;
                const source = path.resolve("incoming/release-evidence", relative);
                const staged = path.join(producerPayloadRoot, "reports", `${id}.json`);
                if (!fs.readFileSync(source).equals(fs.readFileSync(staged))) {
                  throw new Error(`${id} report is not byte-identical to producer staging payload`);
                }
                if (id === "signed-updater-inputs") copyReleaseAsset(source);
                const target = path.resolve("candidate-inputs/evidence", id, relative);
                if (!target.startsWith(`${path.resolve("candidate-inputs/evidence", id)}${path.sep}`)) {
                  throw new Error(`${id} target path escapes candidate evidence directory`);
                }
                if (fs.existsSync(target)) throw new Error(`${id} evidence target collides: ${relative}`);
                fs.mkdirSync(path.dirname(target), { recursive: true });
                fs.copyFileSync(source, target);
                return {
                  path: path.relative(root, target).split(path.sep).join("/"),
                  sha256: file.sha256,
                  size: file.size,
                  kind,
                  schemaVersion: file.schemaVersion,
                };
              });
              return {
                id,
                kind,
                status: "passed",
                releaseRef: sourceRun.ref,
                commitSha,
                workflowRun: qualificationRun,
                sourceWorkflowRun: payloadRun,
                evidence,
              };
            }),
          ];
          const packageFor = (platform, names) => ({
            manifest: `tauri-release-${platform}.json`,
            artifacts: names.map((name) => ({ path: name })),
          });
          const config = {
            baseDirectory: root,
            releaseRef: sourceRun.ref,
            releaseTag: tag,
            commitSha,
            workflowRun: qualificationRun,
            sourceWorkflowRun: sourceRun,
            sourceArtifacts,
            platforms: {
              "macos-arm64": packageFor("macos-arm64", [`JFTrade-${tag}-macos-arm64.dmg`]),
              "linux-x64": packageFor("linux-x64", [`JFTrade-${tag}-linux-x64.AppImage`, `JFTrade-${tag}-linux-x64.deb`, `JFTrade-${tag}-linux-x64.rpm`]),
              "windows-x64": packageFor("windows-x64", [`JFTrade-${tag}-windows-x64-setup.exe`]),
              "windows-arm64": packageFor("windows-arm64", [`JFTrade-${tag}-windows-arm64-setup.exe`]),
            },
            sha256sums: "SHA256SUMS",
            prerequisites,
          };
          fs.writeFileSync("candidate-evidence-config.json", `${JSON.stringify(config, null, 2)}\n`);
          NODE
          (cd candidate-inputs && find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name source-artifact-metadata.json -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Build and validate candidate evidence
        run: |
          set -euo pipefail
          mkdir -p candidate-output
          node scripts/rust-migration/check-release-candidate.mjs \
            --build \
            --config candidate-evidence-config.json \
            --base-dir candidate-inputs \
            --output candidate-output/release-candidate-evidence.json \
            --expected-ref "${{ inputs.candidate_ref }}" \
            --expected-tag "${{ inputs.planned_release_tag }}" \
            --expected-commit "$(git rev-parse HEAD)" \
            --expected-run-id "${{ github.run_id }}" \
            --expected-attempt "${{ github.run_attempt }}" \
            --expected-workflow "desktop-release-qualification.yml"

      - name: Seal immutable release candidate bundle
        env:
          RELEASE_REF: ${{ inputs.planned_release_tag }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          COMMIT_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
          QUALIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cp -- candidate-output/release-candidate-evidence.json candidate-inputs/release-candidate-evidence.json
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          const MAX_SAFE_INTEGER = BigInt(Number.MAX_SAFE_INTEGER);
          const parseSafePositiveInteger = (value) => {
            let text;
            if (typeof value === "number") {
              if (!Number.isSafeInteger(value) || value <= 0) return null;
              text = BigInt(value).toString();
            } else if (typeof value === "string") {
              text = value.trim();
              if (!/^[1-9][0-9]*$/.test(text)) return null;
            } else return null;
            try {
              const integer = BigInt(text);
              return integer > 0n && integer <= MAX_SAFE_INTEGER ? integer.toString() : null;
            } catch {
              return null;
            }
          };
          const requireSafePositiveInteger = (value, label) => {
            const text = parseSafePositiveInteger(value);
            if (text === null) throw new Error(`${label} must be a safe positive integer`);
            return text;
          };
          const root = path.resolve("candidate-inputs");
          const hash = (file) => createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          const canonicalPath = path.join(root, "release-candidate-evidence.json");
          const canonical = JSON.parse(fs.readFileSync(canonicalPath, "utf8"));
          const sourceMetadata = JSON.parse(fs.readFileSync(path.join(root, "source-artifact-metadata.json"), "utf8"));
          const sourceArtifacts = sourceMetadata.releaseArtifacts;
          const sourceUpdaterArtifacts = sourceMetadata.updaterArtifacts;
          const requiredSource = ["desktop-release-linux", "desktop-release-macos", "desktop-release-windows", "desktop-release-windows-arm64"];
          const requiredUpdater = ["desktop-release-updater-linux", "desktop-release-updater-macos", "desktop-release-updater-windows", "desktop-release-updater-windows-arm64"];
          const exact = (values, names, label) => {
            if (!Array.isArray(values) || values.length !== names.length || new Set(values.map((entry) => entry?.name)).size !== names.length
              || names.some((name) => !values.some((entry) => entry?.name === name))) throw new Error(`${label} is not exactly the required artifact set`);
            return values;
          };
          exact(sourceArtifacts, requiredSource, "sourceArtifacts");
          exact(sourceUpdaterArtifacts, requiredUpdater, "sourceUpdaterArtifacts");
          const files = [];
          for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
            if (!entry.isFile() || entry.name === "source-artifact-metadata.json" || entry.name === "release-candidate-evidence.json" || entry.name === "sealed-release-bundle.json") continue;
            const file = path.join(root, entry.name);
            const stat = fs.lstatSync(file);
            if (stat.isSymbolicLink() || stat.size <= 0) throw new Error(`sealed release file is not a regular non-empty file: ${entry.name}`);
            files.push({ path: entry.name, size: stat.size, sha256: hash(file) });
          }
          files.sort((left, right) => left.path.localeCompare(right.path));
          const qualificationRunId = requireSafePositiveInteger(process.env.QUALIFICATION_RUN_ID, "QUALIFICATION_RUN_ID");
          const qualificationRunAttempt = requireSafePositiveInteger(process.env.QUALIFICATION_RUN_ATTEMPT, "QUALIFICATION_RUN_ATTEMPT");
          const sourceRunId = requireSafePositiveInteger(process.env.SOURCE_RUN_ID, "SOURCE_RUN_ID");
          const sourceRunAttempt = requireSafePositiveInteger(process.env.SOURCE_RUN_ATTEMPT, "SOURCE_RUN_ATTEMPT");
          const qualificationRun = {
            id: qualificationRunId,
            attempt: Number(qualificationRunAttempt),
            workflow: "desktop-release-qualification.yml",
            ref: process.env.CANDIDATE_REF,
            commitSha: process.env.COMMIT_SHA,
          };
          const sourceWorkflowRun = {
            id: sourceRunId,
            attempt: Number(sourceRunAttempt),
            workflow: "desktop-release.yml",
            ref: process.env.CANDIDATE_REF,
            commitSha: process.env.COMMIT_SHA,
          };
          const manifest = {
            $schema: "./sealed-release-bundle.schema.json",
            schemaVersion: "jftrade.sealed-release-bundle.v1",
            repository: process.env.REPOSITORY,
            releaseRef: sourceWorkflowRun.ref,
            releaseTag: process.env.RELEASE_REF,
            commitSha: process.env.COMMIT_SHA,
            qualificationRun,
            sourceWorkflowRun,
            sourceArtifacts,
            sourceUpdaterArtifacts,
            canonicalEvidence: {
              path: "release-candidate-evidence.json",
              size: fs.statSync(canonicalPath).size,
              sha256: hash(canonicalPath),
            },
            files,
          };
          fs.writeFileSync(path.join(root, "sealed-release-bundle.json"), `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          rm -rf sealed-release-check
          mkdir sealed-release-check
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const root = path.resolve("candidate-inputs");
          const target = path.resolve("sealed-release-check");
          const manifest = JSON.parse(fs.readFileSync(path.join(root, "sealed-release-bundle.json"), "utf8"));
          for (const entry of manifest.files) fs.copyFileSync(path.join(root, entry.path), path.join(target, entry.path));
          NODE
          node scripts/rust-migration/check-release-candidate-bundle.mjs \
            --sealed-manifest candidate-inputs/sealed-release-bundle.json \
            --evidence candidate-inputs/release-candidate-evidence.json \
            --candidate-root candidate-inputs \
            --release-root sealed-release-check
          node scripts/rust-migration/check-release-candidate.mjs \
            --check \
            --input candidate-output/release-candidate-evidence.json \
            --base-dir candidate-inputs \
            --expected-ref "${{ inputs.candidate_ref }}" \
            --expected-tag "${{ inputs.planned_release_tag }}" \
            --expected-commit "$(git rev-parse HEAD)" \
            --expected-run-id "${{ github.run_id }}" \
            --expected-attempt "${{ github.run_attempt }}" \
            --expected-workflow "desktop-release-qualification.yml"

      - name: Upload artifact-bound qualification config
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-candidate-evidence
          path: |
            candidate-evidence-config.json
            candidate-output/release-candidate-evidence.json
            candidate-inputs/**
            source-artifact-metadata.json
          if-no-files-found: error

  qualify-rehearsal:
    name: Qualify unsigned rehearsal receipt
    if: inputs.qualification_mode == 'rehearsal'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0

      - name: Verify rehearsal producer run and immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          PLANNED_TAG: ${{ inputs.planned_release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVIDENCE_WORKFLOW: ${{ inputs.evidence_workflow }}
          EVIDENCE_ARTIFACT: ${{ inputs.evidence_artifact }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REF" == "refs/heads/release/0.29.0-candidate" && "$PLANNED_TAG" == "v0.29.0" ]] || { echo "rehearsal candidate ref or planned tag mismatch" >&2; exit 1; }
          [[ "$GITHUB_REF" == "$CANDIDATE_REF" ]] || { echo "rehearsal qualification must run from candidate_ref" >&2; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ && "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ && "$EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ && "$EVIDENCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo "rehearsal run identity is invalid" >&2; exit 1; }
          [[ "$EVIDENCE_WORKFLOW" == "desktop-release-evidence.yml" && "$EVIDENCE_ARTIFACT" == "desktop-release-rehearsal-evidence" ]] || { echo "rehearsal qualification rejects formal candidate or unknown evidence artifacts" >&2; exit 1; }
          commit_sha="$(git rev-parse HEAD)"
          run_json="$(gh api "repos/$REPOSITORY/actions/runs/$EVIDENCE_RUN_ID")"
          jq -e --arg sha "$commit_sha" --arg branch "release/0.29.0-candidate" --arg attempt "$EVIDENCE_RUN_ATTEMPT" \
            '.status == "completed" and .conclusion == "success" and .head_sha == $sha and .head_branch == $branch and (.run_attempt|tostring) == $attempt and (.path == ".github/workflows/desktop-release-evidence.yml" or .path == "desktop-release-evidence.yml")' \
            <<<"$run_json" >/dev/null || { echo "rehearsal producer run provenance mismatch" >&2; exit 1; }
          artifacts_json="$(gh api "repos/$REPOSITORY/actions/runs/$EVIDENCE_RUN_ID/artifacts?per_page=100")"
          match="$(jq -c --arg name "$EVIDENCE_ARTIFACT" --argjson run_id "$EVIDENCE_RUN_ID" '[.artifacts[] | select(.name == $name and .expired == false and .workflow_run.id == $run_id and (.digest|test("^sha256:[a-f0-9]{64}$")))]' <<<"$artifacts_json")"
          [[ "$(jq length <<<"$match")" == 1 ]] || { echo "rehearsal evidence artifact is missing, ambiguous, expired, or undigested" >&2; exit 1; }
          echo "EVIDENCE_ARTIFACT_ID=$(jq -r '.[0].id' <<<"$match")" >> "$GITHUB_ENV"
          echo "EVIDENCE_ARTIFACT_DIGEST=$(jq -r '.[0].digest' <<<"$match")" >> "$GITHUB_ENV"

      - name: Download, verify and archive rehearsal receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          PLANNED_TAG: ${{ inputs.planned_release_tag }}
        run: |
          set -euo pipefail
          rm -rf rehearsal-input rehearsal-output
          mkdir rehearsal-input rehearsal-output
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          gh api -H "Accept: application/zip" "repos/$REPOSITORY/actions/artifacts/$EVIDENCE_ARTIFACT_ID/zip" > "$archive"
          [[ "sha256:$(sha256sum "$archive" | awk '{print $1}')" == "$EVIDENCE_ARTIFACT_DIGEST" ]] || { echo "rehearsal evidence artifact digest drift" >&2; exit 1; }
          unzip -q "$archive" -d rehearsal-input
          mapfile -t receipts < <(find rehearsal-input -type f -name release-candidate-rehearsal.json -print)
          [[ "${#receipts[@]}" == 1 && -z "$(find rehearsal-input -type l -print -quit)" ]] || { echo "rehearsal evidence must contain exactly one regular receipt" >&2; exit 1; }
          node scripts/rust-migration/check-release-candidate-rehearsal.mjs \
            --check --input "${receipts[0]}" \
            --expected-ref "$CANDIDATE_REF" \
            --expected-tag "$PLANNED_TAG" \
            --expected-commit "$(git rev-parse HEAD)"
          cp "${receipts[0]}" rehearsal-output/release-candidate-rehearsal.json

      - name: Upload rehearsal-passed receipt
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-rehearsal-receipt
          path: rehearsal-output/release-candidate-rehearsal.json
          if-no-files-found: error
          retention-days: 90
