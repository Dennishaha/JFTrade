          }
          const sourceArtifactMetadata = JSON.parse(fs.readFileSync("source-artifact-metadata.json", "utf8"));
          const sourceArtifacts = sourceArtifactMetadata.releaseArtifacts;
          fs.copyFileSync("source-artifact-metadata.json", path.join(root, "source-artifact-metadata.json"));
          const releaseArtifactPaths = {
            "macos-arm64": [`${root}/JFTrade-${tag}-macos-arm64.dmg`],
            "linux-x64": [
              `${root}/JFTrade-${tag}-linux-x64.AppImage`,
