          const candidateRef = process.env.CANDIDATE_REF;
          const commitSha = process.env.COMMIT_SHA;
          const MAX_SAFE_INTEGER = BigInt(Number.MAX_SAFE_INTEGER);
          const parseSafePositiveInteger = (value) => {
            let text;
            if (typeof value === "number") {
              if (!Number.isSafeInteger(value) || value <= 0) return null;
              text = BigInt(value).toString();
            } else if (typeof value === "string") {
              text = value.trim();
              if (!/^[1-9][0-9]*$/.test(text)) return null;
            } else return null;
            try {
              const integer = BigInt(text);
              return integer > 0n && integer <= MAX_SAFE_INTEGER ? integer.toString() : null;
            } catch {
              return null;
            }
          };
          const requireSafePositiveInteger = (value, label) => {
            const text = parseSafePositiveInteger(value);
            if (text === null) throw new Error(`${label} must be a safe positive integer`);
            return text;
          };
          const safeIdentityEqual = (left, right) => {
            const actual = parseSafePositiveInteger(left);
            const expected = parseSafePositiveInteger(right);
            return actual !== null && expected !== null && actual === expected;
          };
          const sourceRunId = requireSafePositiveInteger(process.env.SOURCE_RUN_ID, "SOURCE_RUN_ID");
          const sourceRunAttempt = requireSafePositiveInteger(process.env.SOURCE_RUN_ATTEMPT, "SOURCE_RUN_ATTEMPT");
          const qualificationRunId = requireSafePositiveInteger(process.env.QUALIFICATION_RUN_ID, "QUALIFICATION_RUN_ID");
          const qualificationRunAttempt = requireSafePositiveInteger(process.env.QUALIFICATION_RUN_ATTEMPT, "QUALIFICATION_RUN_ATTEMPT");
          const evidenceRunId = requireSafePositiveInteger(process.env.EVIDENCE_RUN_ID, "EVIDENCE_RUN_ID");
          const evidenceRunAttempt = requireSafePositiveInteger(process.env.EVIDENCE_RUN_ATTEMPT, "EVIDENCE_RUN_ATTEMPT");
          const sourceRun = {
            id: sourceRunId,
            attempt: Number(sourceRunAttempt),
            workflow: "desktop-release.yml",
            ref: candidateRef,
            commitSha,
          };
          const qualificationRun = {
            id: qualificationRunId,
            attempt: Number(qualificationRunAttempt),
            workflow: "desktop-release-qualification.yml",
            ref: candidateRef,
            commitSha,
          };
          const evidenceRoot = path.resolve("incoming/release-evidence");
          const evidenceManifestPath = path.resolve(evidenceRoot, process.env.EVIDENCE_MANIFEST);
          const manifestRelative = path.relative(evidenceRoot, evidenceManifestPath);
          if (!manifestRelative || manifestRelative === ".." || manifestRelative.startsWith(`..${path.sep}`)
            || process.env.EVIDENCE_MANIFEST.split("/").some((part) => !part || part === "." || part === "..")) {
            throw new Error("evidence_manifest must stay inside the downloaded evidence artifact");
          }
          let manifestCursor = evidenceRoot;
          for (const part of manifestRelative.split(path.sep)) {
            manifestCursor = path.join(manifestCursor, part);
            if (fs.lstatSync(manifestCursor).isSymbolicLink()) throw new Error("evidence_manifest must not traverse a symlink");
          }
          const manifest = JSON.parse(fs.readFileSync(evidenceManifestPath, "utf8"));
          const schemaPath = "tests/fixtures/rust-migration/stage9/release-evidence-inputs.schema.json";
          const schema = JSON.parse(fs.readFileSync(schemaPath, "utf8"));
          if (schema.$id !== "https://jftrade.local/schemas/release-evidence-inputs.v2.json"
            || schema.properties?.schemaVersion?.const !== "jftrade.release-evidence-inputs.v2"
            || schema.properties?.workflow?.enum?.length !== 1
            || schema.properties.workflow.enum[0] !== process.env.EVIDENCE_WORKFLOW) {
