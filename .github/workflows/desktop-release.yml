  linux:
    name: Linux x64 Packages
    if: inputs.operation != 'publish'
    needs: release-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      JFTRADE_DESKTOP_PREPARED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.JFTRADE_DESKTOP_BUILD_REF }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Download prepared release inputs
        uses: actions/download-artifact@v8
        with:
          name: desktop-build-inputs-${{ github.run_id }}
          path: .

      - name: Install Linux desktop dependencies
        run: bash scripts/install-linux-desktop-dependencies.sh

      - name: Build and smoke market data sidecar
        uses: ./.github/actions/build-marketdata-sidecar

      - name: Verify prepared release inputs and hashes
        run: node scripts/prepare-desktop-release.mjs

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Resolve Linux release artifact names
        id: linux_artifacts
        run: |
          version="${JFTRADE_DESKTOP_RELEASE_TAG#v}"
          dir="target/release/bundle"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bundle=$dir" >> "$GITHUB_OUTPUT"

      - name: Build signed Linux x64 candidate packages
        if: env.JFTRADE_DESKTOP_SIGNED_CANDIDATE == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          JFTRADE_TAURI_UPDATER_PUBKEY: ${{ secrets.JFTRADE_TAURI_UPDATER_PUBKEY }}
          JFTRADE_TAURI_UPDATER_ENDPOINT: ${{ secrets.JFTRADE_TAURI_UPDATER_ENDPOINT }}
        run: pnpm run prepare:tauri-release && pnpm run build:desktop:tauri

      - name: Build unsigned Linux x64 rehearsal packages
        if: env.JFTRADE_DESKTOP_OPERATION == 'rehearsal'
        run: pnpm run prepare:tauri-release && pnpm run build:desktop:tauri

      - name: Verify signed Linux updater output
        if: env.JFTRADE_DESKTOP_SIGNED_CANDIDATE == 'true'
        run: |
          set -euo pipefail
          updater_dir="target/release/bundle"
          test -d "$updater_dir"
          signatures="$(find "$updater_dir" -type f -name '*.sig' -print)"
          test -n "$signatures"

      - name: Verify Linux x64 release packages
        id: artifact
        run: |
          artifact="target/release/jftrade-desktop"
          test -x "$artifact"
          file "$artifact" | grep -q 'ELF 64-bit'
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Resolve and verify Linux Tauri package manifest
        id: linux_package_artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          updater_flag=()
          if [[ "$JFTRADE_DESKTOP_SIGNED_CANDIDATE" == "true" ]]; then updater_flag=(--require-updater); fi
          node scripts/verify-tauri-release-artifacts.mjs \
            --platform linux-x64 \
            --architecture amd64 \
            --version "${JFTRADE_DESKTOP_RELEASE_TAG#v}" \
            --output artifacts/tauri-release-linux-x64.json \
            "${updater_flag[@]}"
          for format in appimage deb rpm; do
            artifact="$(find "${{ steps.linux_artifacts.outputs.bundle }}/$format" -maxdepth 1 -type f -print -quit)"
            test -n "$artifact"
            echo "$format=$artifact" >> "$GITHUB_OUTPUT"
          done

      - name: Smoke packaged Linux Tauri runtime
        env:
          JFTRADE_TAURI_BINARY: target/release/jftrade-desktop
          JFTRADE_TAURI_SMOKE_REPORT: artifacts/tauri-runtime-smoke-linux-x64.json
        run: xvfb-run -a pnpm run smoke:tauri-release

      - name: Generate Linux x64 SBOM
        uses: anchore/sbom-action@v0
        with:
          file: ${{ steps.artifact.outputs.path }}
          format: spdx-json
          output-file: artifacts/JFTrade-linux-x64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest Linux x64 build provenance
        if: ${{ github.event.repository.private == false && inputs.operation == 'candidate' }}
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ steps.linux_package_artifacts.outputs.appimage }}
            ${{ steps.linux_package_artifacts.outputs.deb }}
            ${{ steps.linux_package_artifacts.outputs.rpm }}

      - name: Upload Linux x64 release files
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-linux
          path: |
            ${{ steps.linux_package_artifacts.outputs.appimage }}
            ${{ steps.linux_package_artifacts.outputs.deb }}
            ${{ steps.linux_package_artifacts.outputs.rpm }}
            artifacts/JFTrade-linux-x64.spdx.json
            artifacts/tauri-release-linux-x64.json
            artifacts/tauri-runtime-smoke-linux-x64.json
          if-no-files-found: error

      - name: Upload Linux updater artifacts
        if: env.JFTRADE_DESKTOP_SIGNED_CANDIDATE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-updater-linux
          path: |
            target/release/bundle/appimage/*.sig
            target/release/bundle/appimage/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: inputs.operation == 'publish' && needs.release-inputs.result == 'success'
    needs: [release-inputs]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.JFTRADE_DESKTOP_BUILD_REF }}

      - name: Download sealed candidate bundle by immutable artifact id and digest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_ARTIFACT: ${{ needs.release-inputs.outputs.candidate_artifact }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.release-inputs.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.release-inputs.outputs.candidate_artifact_digest }}
          CANDIDATE_RUN_ID: ${{ needs.release-inputs.outputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "candidate artifact id provenance is invalid" >&2; exit 1; }
          [[ "$CANDIDATE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "candidate artifact digest provenance is invalid" >&2; exit 1; }
          artifact_json="$(gh api "repos/$REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID")"
          jq -e \
            --arg name "$CANDIDATE_ARTIFACT" \
            --argjson run_id "$CANDIDATE_RUN_ID" \
            --argjson artifact_id "$CANDIDATE_ARTIFACT_ID" \
            --arg digest "$CANDIDATE_ARTIFACT_DIGEST" \
            '.id > 0 and .id == $artifact_id and .name == $name and .expired == false and .workflow_run.id == $run_id and .digest == $digest' \
            <<<"$artifact_json" >/dev/null || {
            echo "candidate artifact metadata no longer matches the qualification binding" >&2
            exit 1
          }
          mkdir -p candidate-evidence
          gh api "repos/$REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > candidate-sealed-bundle.zip
          actual_digest="sha256:$(sha256sum candidate-sealed-bundle.zip | awk '{print $1}')"
          [[ "$actual_digest" == "$CANDIDATE_ARTIFACT_DIGEST" ]] || {
            echo "downloaded candidate artifact ZIP digest differs from GitHub API digest" >&2
            exit 1
          }
          while IFS= read -r entry; do
            [[ "$entry" != /* && "$entry" != *"\\"* ]] || {
              echo "candidate artifact ZIP contains an unsafe path: $entry" >&2
              exit 1
            }
            IFS='/' read -r -a segments <<< "$entry"
            for segment in "${segments[@]}"; do
              [[ -n "$segment" && "$segment" != "." && "$segment" != ".." ]] || {
                echo "candidate artifact ZIP contains an unsafe path: $entry" >&2
                exit 1
              }
            done
          done < <(unzip -Z1 candidate-sealed-bundle.zip)
          unzip -q candidate-sealed-bundle.zip -d candidate-evidence

      - name: Materialize sealed release files
        run: |
          set -euo pipefail
          sealed_root="candidate-evidence/candidate-inputs"
          sealed_manifest="$sealed_root/sealed-release-bundle.json"
          test -f "$sealed_manifest"
          mkdir release
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const root = path.resolve("candidate-evidence/candidate-inputs");
          const release = path.resolve("release");
          const manifest = JSON.parse(fs.readFileSync(path.join(root, "sealed-release-bundle.json"), "utf8"));
          if (!Array.isArray(manifest.files) || manifest.files.length === 0) throw new Error("sealed bundle has no release files");
          const seen = new Set();
          for (const entry of manifest.files) {
            if (typeof entry?.path !== "string" || path.posix.basename(entry.path) !== entry.path || entry.path.includes("\\") || entry.path === "." || entry.path === "..") {
              throw new Error(`unsafe sealed release path: ${entry?.path}`);
            }
            if (seen.has(entry.path)) throw new Error(`duplicate sealed release path: ${entry.path}`);
            seen.add(entry.path);
            const source = path.join(root, entry.path);
            const destination = path.join(release, entry.path);
            const sourceStat = fs.lstatSync(source);
            if (!sourceStat.isFile() || sourceStat.isSymbolicLink()) throw new Error(`sealed release source is not a regular file: ${entry.path}`);
            if (fs.existsSync(destination)) throw new Error(`release destination already exists: ${entry.path}`);
            fs.copyFileSync(source, destination);
          }
          NODE

      - name: Verify artifact-bound release candidate evidence
        env:
          CANDIDATE_EVIDENCE_CONFIG: ${{ needs.release-inputs.outputs.candidate_config }}
          CANDIDATE_RUN_ID: ${{ needs.release-inputs.outputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.release-inputs.outputs.candidate_run_attempt }}
          CANDIDATE_WORKFLOW: ${{ needs.release-inputs.outputs.candidate_workflow }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.release-inputs.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.release-inputs.outputs.candidate_artifact_digest }}
          RELEASE_REF: refs/tags/${{ env.JFTRADE_DESKTOP_RELEASE_TAG }}
          RELEASE_TAG: ${{ env.JFTRADE_DESKTOP_RELEASE_TAG }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Verify the downloaded canonical candidate evidence; never rebuild it in publish.
          COMMIT_SHA="$(git rev-parse HEAD)"
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "candidate artifact id provenance is invalid" >&2; exit 1; }
          [[ "$CANDIDATE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "candidate artifact digest provenance is invalid" >&2; exit 1; }
          config_path="candidate-evidence/$CANDIDATE_EVIDENCE_CONFIG"
          [[ "$CANDIDATE_EVIDENCE_CONFIG" =~ ^[A-Za-z0-9._/-]+$ && "$CANDIDATE_EVIDENCE_CONFIG" != /* ]] || {
            echo "Candidate evidence config path is not a safe artifact-relative path" >&2
            exit 1
          }
          test -f "$config_path"
          canonical_path="candidate-evidence/candidate-inputs/release-candidate-evidence.json"
          sealed_manifest="candidate-evidence/candidate-inputs/sealed-release-bundle.json"
          candidate_root="candidate-evidence/candidate-inputs"
          source_run_id="$(node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(String(m.sourceWorkflowRun.id));' "$sealed_manifest")"
          source_attempt="$(node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(String(m.sourceWorkflowRun.attempt));' "$sealed_manifest")"
          test -f "$canonical_path"
          test -f "$sealed_manifest"
          test -d "$candidate_root"
          mkdir -p artifacts
          node scripts/release/check-release-candidate.mjs \
            --expected-ref "$RELEASE_REF" \
            --expected-tag "$RELEASE_TAG" \
            --expected-commit "$COMMIT_SHA" \
            --expected-run-id "$CANDIDATE_RUN_ID" \
            --expected-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --expected-workflow "$CANDIDATE_WORKFLOW" \
            --check \
            --input "$canonical_path" \
            --base-dir "$candidate_root"
          node scripts/release/check-release-candidate-bundle.mjs \
            --sealed-manifest "$sealed_manifest" \
            --evidence "$canonical_path" \
            --candidate-root "$candidate_root" \
            --release-root release \
            --qualification-run-id "$CANDIDATE_RUN_ID" \
            --qualification-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --source-run-id "$source_run_id" \
            --source-attempt "$source_attempt" \
            --release-ref "$RELEASE_REF" \
            --expected-commit "$COMMIT_SHA"
          cp "$canonical_path" artifacts/release-candidate-evidence.json

      - name: Retain artifact-bound candidate evidence
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-candidate-evidence-${{ github.run_id }}
          path: artifacts/release-candidate-evidence.json
          if-no-files-found: error

      - name: Attest checksum manifest
        if: github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-path: release/SHA256SUMS

      - name: Upload assets and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$JFTRADE_DESKTOP_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$JFTRADE_DESKTOP_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            while IFS= read -r asset; do
              case "$asset" in
                *.AppImage|*.deb|*.rpm|*.dmg|*-setup.exe|*.spdx.json|*.sig|*.tar.gz|*.zip|tauri-release-*.json|tauri-runtime-smoke-*.json|SHA256SUMS)
                  gh release delete-asset "$JFTRADE_DESKTOP_RELEASE_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
                  ;;
              esac
            done < <(gh release view "$JFTRADE_DESKTOP_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$JFTRADE_DESKTOP_RELEASE_TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            is_draft="true"
            gh release create "$JFTRADE_DESKTOP_RELEASE_TAG" release/* --draft --verify-tag --generate-notes --title "JFTrade ${JFTRADE_DESKTOP_RELEASE_TAG#v}" --repo "$GITHUB_REPOSITORY"
          fi
          if [ "$is_draft" = "true" ]; then
            gh release edit "$JFTRADE_DESKTOP_RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          fi
