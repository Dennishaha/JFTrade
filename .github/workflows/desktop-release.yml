name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact candidate branch, commit, or ref to build or publish
        required: true
        default: release/0.29.0-candidate
        type: string
      planned_release_tag:
        description: Planned vX.Y.Z release tag; rehearsal and candidate do not require it to exist
        required: true
        default: v0.29.0
        type: string
      operation:
        description: Rehearse unsigned builds, build a signed candidate, or publish an existing formal candidate
        required: true
        default: rehearsal
        type: choice
        options:
          - rehearsal
          - candidate
          - publish
      candidate_evidence_config:
        description: Relative config path inside the candidate qualification artifact (required for publish)
        required: false
        default: candidate-evidence-config.json
        type: string
      candidate_evidence_run_id:
        description: Successful formal candidate qualification run id bound to source_ref, tag and commit (required for publish)
        required: false
        default: ''
        type: string
      candidate_evidence_artifact:
        description: Exact artifact name in the qualification run containing the config and evidence inputs (required for publish)
        required: false
        default: desktop-release-candidate-evidence
        type: string
      candidate_evidence_workflow:
        description: Qualification workflow file used for push lookup and run provenance validation
        required: false
        default: desktop-release-qualification.yml
        type: string
permissions: {}

env:
  JFTRADE_DESKTOP_BUILD_REF: ${{ inputs.source_ref }}
  JFTRADE_DESKTOP_RELEASE_TAG: ${{ inputs.planned_release_tag }}
  JFTRADE_DESKTOP_OPERATION: ${{ inputs.operation }}
  JFTRADE_DESKTOP_SIGNED_CANDIDATE: ${{ inputs.operation == 'candidate' }}
  JFTRADE_DESKTOP_PUBLISH: ${{ inputs.operation == 'publish' }}
  JFTRADE_DESKTOP_BUILD_TIME: ${{ github.event.head_commit.timestamp || '' }}

concurrency:
  group: desktop-release-${{ inputs.operation }}-${{ inputs.source_ref }}-${{ inputs.planned_release_tag }}
  cancel-in-progress: false

jobs:
  release-inputs:
    name: Prepare Release Inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_run_id: ${{ steps.resolve_candidate.outputs.run_id }}
      candidate_run_attempt: ${{ steps.resolve_candidate.outputs.run_attempt }}
      candidate_workflow: ${{ steps.resolve_candidate.outputs.workflow }}
      candidate_artifact: ${{ steps.resolve_candidate.outputs.artifact }}
      candidate_artifact_id: ${{ steps.resolve_candidate.outputs.artifact_id }}
      candidate_artifact_digest: ${{ steps.resolve_candidate.outputs.artifact_digest }}
      candidate_config: ${{ steps.resolve_candidate.outputs.config }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ env.JFTRADE_DESKTOP_BUILD_REF }}
          fetch-depth: 0

      - name: Verify release policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_commit="$(git rev-parse HEAD)"
          [[ "$JFTRADE_DESKTOP_OPERATION" =~ ^(rehearsal|candidate|publish)$ ]] || {
            echo "operation must be rehearsal, candidate, or publish" >&2
            exit 1
          }
          if [[ ! "$JFTRADE_DESKTOP_RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || [[ "$JFTRADE_DESKTOP_RELEASE_TAG" = "v0.0.0" ]]; then
            echo "Invalid planned release tag: $JFTRADE_DESKTOP_RELEASE_TAG" >&2
            exit 1
          fi
          [[ "$JFTRADE_DESKTOP_BUILD_REF" =~ ^[A-Za-z0-9._/-]+$ && "$JFTRADE_DESKTOP_BUILD_REF" != /* && "$JFTRADE_DESKTOP_BUILD_REF" != *".."* ]] || {
            echo "source_ref is unsafe" >&2
            exit 1
          }
          if [[ "$JFTRADE_DESKTOP_PUBLISH" == "true" ]]; then
            if ! git show-ref --verify --quiet "refs/tags/$JFTRADE_DESKTOP_RELEASE_TAG"; then
              echo "Publishing requires an existing tag: $JFTRADE_DESKTOP_RELEASE_TAG" >&2
              exit 1
            fi
            tag_commit="$(git rev-parse "refs/tags/$JFTRADE_DESKTOP_RELEASE_TAG^{commit}")"
            if [[ "$tag_commit" != "$head_commit" ]]; then
              echo "Checked out $head_commit, expected tag commit $tag_commit" >&2
              exit 1
            fi
          else
            [[ "$JFTRADE_DESKTOP_BUILD_REF" == "release/0.29.0-candidate" || "$JFTRADE_DESKTOP_BUILD_REF" == "refs/heads/release/0.29.0-candidate" ]] || {
              echo "0.29.0 candidate builds must use release/0.29.0-candidate" >&2
              exit 1
            }
            echo "$JFTRADE_DESKTOP_OPERATION will build $JFTRADE_DESKTOP_BUILD_REF at $head_commit for planned tag $JFTRADE_DESKTOP_RELEASE_TAG."
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$head_commit" refs/remotes/origin/main; then
            echo "Desktop release inputs must belong to main: $head_commit" >&2
            exit 1
          fi
          ci_url="$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$head_commit" \
              -f branch=main \
              -f event=push \
              -f status=success \
              -F per_page=100 \
              --jq '.workflow_runs[0].html_url // ""'
          )"
          if [[ -z "$ci_url" ]]; then
            echo "No successful main CI run found for $head_commit" >&2
            exit 1
          fi
          echo "Verified required CI run: $ci_url"
          echo "JFTRADE_SOURCE_CI_URL=$ci_url" >> "$GITHUB_ENV"

      - name: Resolve artifact-bound candidate qualification run
        id: resolve_candidate
        if: env.JFTRADE_DESKTOP_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_evidence_run_id || '' }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_evidence_artifact || 'desktop-release-candidate-evidence' }}
          CANDIDATE_CONFIG: ${{ inputs.candidate_evidence_config || 'candidate-evidence-config.json' }}
          CANDIDATE_WORKFLOW: ${{ inputs.candidate_evidence_workflow || 'desktop-release-qualification.yml' }}
          RELEASE_TAG: ${{ env.JFTRADE_DESKTOP_RELEASE_TAG }}
          RELEASE_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_WORKFLOW" == "desktop-release-qualification.yml" ]] || {
            echo "candidate_evidence_workflow is not the trusted qualification workflow" >&2
            exit 1
          }
          [[ "$CANDIDATE_ARTIFACT" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "candidate_evidence_artifact must be an exact simple artifact name" >&2
            exit 1
          }
          [[ "$CANDIDATE_CONFIG" != /* && "$CANDIDATE_CONFIG" != *".."* ]] || {
            echo "candidate_evidence_config must be a relative path without traversal" >&2
            exit 1
          }
          release_ref="refs/tags/$RELEASE_TAG"
          candidate_ref="$CANDIDATE_REF"
          [[ "$candidate_ref" == refs/heads/* ]] || candidate_ref="refs/heads/$candidate_ref"
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          run_id="$CANDIDATE_RUN_ID"
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "Publishing requires an explicitly supplied formal candidate qualification run bound to $candidate_ref and $release_ref at $RELEASE_COMMIT." >&2
            exit 1
          }
          run_json="$(gh api --method GET "repos/$REPOSITORY/actions/runs/$run_id")"
          run_path="$(jq -r '.path // empty' <<<"$run_json")"
          run_status="$(jq -r '.status // empty' <<<"$run_json")"
          run_conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
          run_sha="$(jq -r '.head_sha // empty' <<<"$run_json")"
          run_branch="$(jq -r '.head_branch // empty' <<<"$run_json")"
          run_attempt="$(jq -r '.run_attempt // empty' <<<"$run_json")"
          # Keep the binding stable across API display-name changes; the
          # checked workflow file is already validated through run_path.
          run_workflow="$CANDIDATE_WORKFLOW"
          expected_path=".github/workflows/$CANDIDATE_WORKFLOW"
          [[ "$run_path" == "$expected_path" || "$run_path" == "$CANDIDATE_WORKFLOW" ]] || {
            echo "Candidate run $run_id is not produced by $expected_path (actual: $run_path)" >&2
            exit 1
          }
          [[ "$run_status" == "completed" && "$run_conclusion" == "success" ]] || {
            echo "Candidate qualification run $run_id is not successful: status=$run_status conclusion=$run_conclusion" >&2
            exit 1
          }
          [[ "$run_sha" == "$RELEASE_COMMIT" ]] || {
            echo "Candidate run $run_id commit $run_sha does not match release commit $RELEASE_COMMIT" >&2
            exit 1
          }
          candidate_branch="${candidate_ref#refs/heads/}"
          [[ "$run_branch" == "$candidate_branch" || "$run_branch" == "$candidate_ref" ]] || {
            echo "Candidate run $run_id ref $run_branch does not match candidate ref $candidate_ref" >&2
            exit 1
          }
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ && -n "$run_workflow" ]] || {
            echo "Candidate run $run_id has incomplete workflow provenance" >&2
            exit 1
          }
          artifacts_json="$(gh api --method GET "repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
          artifact_matches="$(jq -c --arg name "$CANDIDATE_ARTIFACT" --argjson run_id "$run_id" \
            '[.artifacts[] | select((.id|type) == "number" and .id > 0 and .name == $name and .expired == false and .workflow_run.id == $run_id and ((.digest|type) == "string") and (.digest|test("^sha256:[0-9a-f]{64}$")))]' \
            <<<"$artifacts_json")"
          [[ "$(jq 'length' <<<"$artifact_matches")" == "1" ]] || {
            echo "Candidate artifact $CANDIDATE_ARTIFACT is missing, ambiguous, expired, or lacks an API digest in qualification run $run_id" >&2
            exit 1
          }
          artifact_id="$(jq -r '.[0].id' <<<"$artifact_matches")"
          artifact_digest="$(jq -r '.[0].digest' <<<"$artifact_matches")"
          {
            echo "run_id=$run_id"
            echo "run_attempt=$run_attempt"
            echo "workflow=$run_workflow"
            echo "artifact=$CANDIDATE_ARTIFACT"
            echo "artifact_id=$artifact_id"
            echo "artifact_digest=$artifact_digest"
            echo "config=$CANDIDATE_CONFIG"
          } >> "$GITHUB_OUTPUT"

      - name: Verify signed candidate prerequisites
        if: env.JFTRADE_DESKTOP_SIGNED_CANDIDATE == 'true'
        env:
          JFTRADE_MACOS_CERTIFICATE_BASE64: ${{ secrets.JFTRADE_MACOS_CERTIFICATE_BASE64 }}
          JFTRADE_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.JFTRADE_MACOS_CERTIFICATE_PASSWORD }}
          JFTRADE_MACOS_SIGN_IDENTITY: ${{ secrets.JFTRADE_MACOS_SIGN_IDENTITY }}
          JFTRADE_MACOS_NOTARY_APPLE_ID: ${{ secrets.JFTRADE_MACOS_NOTARY_APPLE_ID }}
          JFTRADE_MACOS_NOTARY_PASSWORD: ${{ secrets.JFTRADE_MACOS_NOTARY_PASSWORD }}
          JFTRADE_MACOS_NOTARY_TEAM_ID: ${{ secrets.JFTRADE_MACOS_NOTARY_TEAM_ID }}
          JFTRADE_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.JFTRADE_WINDOWS_CERTIFICATE_BASE64 }}
          JFTRADE_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.JFTRADE_WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          JFTRADE_TAURI_UPDATER_PUBKEY: ${{ secrets.JFTRADE_TAURI_UPDATER_PUBKEY }}
          JFTRADE_TAURI_UPDATER_ENDPOINT: ${{ secrets.JFTRADE_TAURI_UPDATER_ENDPOINT }}
        run: node scripts/check-desktop-release-policy.mjs --operation candidate --signing-only

      - name: Setup Node and pnpm
        if: env.JFTRADE_DESKTOP_PUBLISH != 'true'
        uses: ./.github/actions/setup-pnpm
        with:
          cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux desktop dependencies
        if: env.JFTRADE_DESKTOP_PUBLISH != 'true'
        run: bash scripts/install-linux-desktop-dependencies.sh

      - name: Install workspace dependencies
        if: env.JFTRADE_DESKTOP_PUBLISH != 'true'
        run: pnpm install --frozen-lockfile

      - name: Enforce zero-Go release inputs
        if: env.JFTRADE_DESKTOP_PUBLISH != 'true'
        run: pnpm run check:zero-go

      - name: Verify release source admission
        if: env.JFTRADE_DESKTOP_PUBLISH != 'true'
        run: |
          source_ref="$JFTRADE_DESKTOP_BUILD_REF"
          [[ "$source_ref" == refs/heads/* ]] || source_ref="refs/heads/$source_ref"
          node scripts/release/check-release-source-admission.mjs \
            --source-ref "$source_ref" \
            --commit-sha "$(git rev-parse HEAD)" \
            --planned-release-tag "$JFTRADE_DESKTOP_RELEASE_TAG" \
            --ci-status success \
            --ci-url "$JFTRADE_SOURCE_CI_URL"

      - name: Audit locked pnpm dependencies
        if: env.JFTRADE_DESKTOP_PUBLISH != 'true'
        run: pnpm run audit:dependencies

      - name: OSS license compliance
        if: env.JFTRADE_DESKTOP_PUBLISH != 'true'
        run: |
          pnpm run check:oss-license
          pnpm run check:pinets-compliance

      - name: Test Tauri release runtime contracts
        if: env.JFTRADE_DESKTOP_PUBLISH != 'true'
        run: pnpm run test:tauri-release-runtime

      - name: Verify signed updater source contracts
        if: env.JFTRADE_DESKTOP_PUBLISH != 'true'
        run: |
          node scripts/release/check-signed-updater-artifact.mjs --config-only
          node scripts/release/check-signed-updater-lifecycle.mjs

      - name: Build release inputs
        if: env.JFTRADE_DESKTOP_PUBLISH != 'true'
        run: |
          pnpm run generate:docs
          git diff --exit-code -- \
            apps/web/src/generated/openapi.ts \
            tests/fixtures/openapi-baseline.json \
            docs/reference/generated/pine-v6-support.md
          pnpm run build:frontend-assets:generated
          pnpm run build:pineworker
          node scripts/write-desktop-release-input-manifest.mjs
          git diff --check

      - name: Verify built PineTS worker with a real backtest
        if: env.JFTRADE_DESKTOP_PUBLISH != 'true'
        env:
          JFTRADE_PINEWORKER_BUNDLE: ${{ github.workspace }}/runtime-assets/pine/worker.mjs
        run: pnpm run smoke:pinets-backtest

      - name: Verify shared desktop source
        if: env.JFTRADE_DESKTOP_PUBLISH != 'true'
        run: pnpm run test:scripts -- desktop

      - name: Upload prepared release inputs
        if: env.JFTRADE_DESKTOP_PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-build-inputs-${{ github.run_id }}
          path: |
            contracts/openapi/openapi.json
            apps/web/src/generated/openapi.ts
            docs/reference/generated
            apps/web/dist
            runtime-assets/web/manifest.json
            runtime-assets/pine/worker.mjs
            artifacts/desktop-release-inputs.json
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS ARM64 DMG
    if: inputs.operation != 'publish'
    needs: release-inputs
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      JFTRADE_DESKTOP_PREPARED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.JFTRADE_DESKTOP_BUILD_REF }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Download prepared release inputs
        uses: actions/download-artifact@v8
        with:
          name: desktop-build-inputs-${{ github.run_id }}
          path: .

      - name: Verify ARM64 runner
        run: test "$(uname -m)" = "arm64"

      - name: Build and smoke market data sidecar
        uses: ./.github/actions/build-marketdata-sidecar

      - name: Verify prepared release inputs and hashes
        run: node scripts/prepare-desktop-release.mjs

      - name: Configure macOS signing and notarization
        if: env.JFTRADE_DESKTOP_SIGNED_CANDIDATE == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.JFTRADE_MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.JFTRADE_MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.JFTRADE_MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.JFTRADE_MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.JFTRADE_MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.JFTRADE_MACOS_NOTARY_TEAM_ID }}
        run: |
          values=("$CERTIFICATE_BASE64" "$CERTIFICATE_PASSWORD" "$SIGN_IDENTITY" "$NOTARY_APPLE_ID" "$NOTARY_PASSWORD" "$NOTARY_TEAM_ID")
          configured=0
          for value in "${values[@]}"; do test -n "$value" && configured=$((configured + 1)); done
          if [ "$configured" -eq 0 ]; then
            echo "Candidate requires complete macOS signing and notarization credentials." >&2
            exit 1
          fi
          if [ "$configured" -ne "${#values[@]}" ]; then echo "macOS signing secrets must be all set or all unset" >&2; exit 1; fi
          keychain="$RUNNER_TEMP/jftrade-signing.keychain-db"
          certificate="$RUNNER_TEMP/jftrade-signing.p12"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          xcrun notarytool store-credentials jftrade-ci --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID"
          echo "JFTRADE_MACOS_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "JFTRADE_MACOS_NOTARY_PROFILE=jftrade-ci" >> "$GITHUB_ENV"
          echo "QUALIFIER=signed" >> "$GITHUB_ENV"

      - name: Mark unsigned macOS rehearsal
        if: env.JFTRADE_DESKTOP_OPERATION == 'rehearsal'
        run: |
          echo "QUALIFIER=unsigned" >> "$GITHUB_ENV"
          echo "Unsigned rehearsal does not read signing or notarization secrets."

      - name: Sign native market-data helper before embedding
        run: |
          set -euo pipefail
          helper_dir="runtime-assets/marketdata/marketdata-sidecar-darwin-arm64"
          helper="$helper_dir/marketdata-sidecar-darwin-arm64"
          test -d "$helper_dir"
          test -s "$helper"
          if [[ -n "${JFTRADE_MACOS_SIGN_IDENTITY:-}" ]]; then
            codesign --force --options runtime --timestamp --deep --sign "$JFTRADE_MACOS_SIGN_IDENTITY" "$helper"
          else
            codesign --force --deep --sign - "$helper"
          fi
          codesign --verify --strict --verbose=2 "$helper"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Test macOS desktop package
        run: pnpm run test:tauri-release-runtime && cargo test -p jftrade-desktop

      - name: Build signed ARM64 DMG candidate
        if: env.JFTRADE_DESKTOP_SIGNED_CANDIDATE == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          JFTRADE_TAURI_UPDATER_PUBKEY: ${{ secrets.JFTRADE_TAURI_UPDATER_PUBKEY }}
          JFTRADE_TAURI_UPDATER_ENDPOINT: ${{ secrets.JFTRADE_TAURI_UPDATER_ENDPOINT }}
        run: pnpm run prepare:tauri-release && pnpm run build:desktop:tauri

      - name: Build unsigned ARM64 DMG rehearsal
        if: env.JFTRADE_DESKTOP_OPERATION == 'rehearsal'
        run: pnpm run prepare:tauri-release && pnpm run build:desktop:tauri

      - name: Verify signed macOS updater output
        if: env.JFTRADE_DESKTOP_SIGNED_CANDIDATE == 'true'
        run: |
          set -euo pipefail
          updater_dir="target/release/bundle"
          test -d "$updater_dir"
          signatures="$(find "$updater_dir" -type f -name '*.sig' -print)"
          test -n "$signatures"

      - name: Locate macOS artifact
        id: artifact
        run: |
          artifact="$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Verify macOS Tauri package manifest
        run: |
          mkdir -p artifacts
          updater_flag=()
          if [[ "$JFTRADE_DESKTOP_SIGNED_CANDIDATE" == "true" ]]; then updater_flag=(--require-updater); fi
          node scripts/verify-tauri-release-artifacts.mjs \
            --platform macos-arm64 \
            --architecture arm64 \
            --version "${JFTRADE_DESKTOP_RELEASE_TAG#v}" \
            --output artifacts/tauri-release-macos-arm64.json \
            "${updater_flag[@]}"

      - name: Smoke packaged macOS Tauri runtime
        env:
          JFTRADE_TAURI_BINARY: target/release/bundle/macos/JFTrade.app/Contents/MacOS/jftrade-desktop
          JFTRADE_TAURI_SMOKE_REPORT: artifacts/tauri-runtime-smoke-macos-arm64.json
        run: pnpm run smoke:tauri-release

      - name: Verify sealed macOS bundle
        run: |
          bundle="target/release/bundle/macos/JFTrade.app"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          test "$(lipo -archs "$bundle/Contents/MacOS/jftrade-desktop")" = "arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Contents/Info.plist")" = "com.jftrade.desktop"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Contents/Info.plist")" = "${JFTRADE_DESKTOP_RELEASE_TAG#v}"

      - name: Generate macOS SBOM
        uses: anchore/sbom-action@v0
        with:
          path: target/release/bundle/macos/JFTrade.app
          format: spdx-json
          output-file: artifacts/JFTrade-macos-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest macOS build provenance
        if: ${{ github.event.repository.private == false && inputs.operation == 'candidate' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.artifact.outputs.path }}

      - name: Upload macOS release files
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-macos
          path: |
            ${{ steps.artifact.outputs.path }}
            artifacts/JFTrade-macos-arm64.spdx.json
            artifacts/tauri-release-macos-arm64.json
            artifacts/tauri-runtime-smoke-macos-arm64.json
          if-no-files-found: error

      - name: Upload macOS updater artifacts
        if: env.JFTRADE_DESKTOP_SIGNED_CANDIDATE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-updater-macos
          path: |
            target/release/bundle/macos/*.sig
            target/release/bundle/macos/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64 Installer
    if: inputs.operation != 'publish'
    needs: release-inputs
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      JFTRADE_DESKTOP_PREPARED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.JFTRADE_DESKTOP_BUILD_REF }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Download prepared release inputs
        uses: actions/download-artifact@v8
        with:
          name: desktop-build-inputs-${{ github.run_id }}
          path: .

      - name: Install packaging tools
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "NSIS compiler was not installed: $makensis" }
          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Split-Path $makensis) | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure Windows signing
        if: env.JFTRADE_DESKTOP_SIGNED_CANDIDATE == 'true'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.JFTRADE_WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.JFTRADE_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $configured = @($env:CERTIFICATE_BASE64, $env:CERTIFICATE_PASSWORD) | Where-Object { $_ }
          if ($configured.Count -eq 0) { throw "Candidate requires complete Windows signing credentials." }
          if ($configured.Count -ne 2) { throw "Windows signing secrets must be all set or all unset" }
          $certificate = Join-Path $env:RUNNER_TEMP "jftrade-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $securePassword = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = @(Import-PfxCertificate -FilePath $certificate -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword) |
            Where-Object HasPrivateKey |
            Select-Object -First 1
          if (-not $imported) { throw "Windows signing certificate import failed" }
          "JFTRADE_WINDOWS_CERTIFICATE=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append
          "JFTRADE_WINDOWS_CERTIFICATE_PASSWORD=$env:CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
          "JFTRADE_WINDOWS_CERTIFICATE_THUMBPRINT=$($imported.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "QUALIFIER=signed" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Mark unsigned Windows rehearsal
        if: env.JFTRADE_DESKTOP_OPERATION == 'rehearsal'
        shell: pwsh
        run: |
          "QUALIFIER=unsigned" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Unsigned rehearsal does not read Authenticode or updater signing secrets."

      - name: Build and smoke market data sidecar
        uses: ./.github/actions/build-marketdata-sidecar

      - name: Verify prepared release inputs and hashes
        shell: pwsh
        run: node scripts/prepare-desktop-release.mjs

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Test Windows desktop package
        run: pnpm run test:tauri-release-runtime && cargo test -p jftrade-desktop

      - name: Build signed per-user NSIS candidate
        if: env.JFTRADE_DESKTOP_SIGNED_CANDIDATE == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          JFTRADE_TAURI_UPDATER_PUBKEY: ${{ secrets.JFTRADE_TAURI_UPDATER_PUBKEY }}
          JFTRADE_TAURI_UPDATER_ENDPOINT: ${{ secrets.JFTRADE_TAURI_UPDATER_ENDPOINT }}
        shell: pwsh
        run: pnpm run prepare:tauri-release && pnpm run build:desktop:tauri

      - name: Build unsigned per-user NSIS rehearsal
        if: env.JFTRADE_DESKTOP_OPERATION == 'rehearsal'
        shell: pwsh
        run: pnpm run prepare:tauri-release && pnpm run build:desktop:tauri

      - name: Verify signed Windows updater output
        if: env.JFTRADE_DESKTOP_SIGNED_CANDIDATE == 'true'
        shell: pwsh
        run: |
          $signatures = Get-ChildItem target/release/bundle -Recurse -Filter *.sig -File -ErrorAction SilentlyContinue
          if (-not $signatures) { throw "Tauri updater signature artifacts are missing" }

      - name: Locate Windows artifact
        id: artifact
        shell: pwsh
        run: |
          $artifact = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $artifact) { throw "Windows installer was not produced" }
          "path=$($artifact.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify Windows Authenticode signatures
        if: env.JFTRADE_DESKTOP_SIGNED_CANDIDATE == 'true'
        shell: pwsh
        run: |
          & signtool verify /pa target/release/jftrade-desktop.exe
          if ($LASTEXITCODE -ne 0) { throw "Tauri executable Authenticode verification failed" }
          & signtool verify /pa "${{ steps.artifact.outputs.path }}"
          if ($LASTEXITCODE -ne 0) { throw "Tauri installer Authenticode verification failed" }

      - name: Verify Windows Tauri package manifest
        shell: pwsh
        run: |
          $arguments = @(
            "scripts/verify-tauri-release-artifacts.mjs",
            "--platform", "windows-x64",
            "--architecture", "amd64",
            "--version", $env:JFTRADE_DESKTOP_RELEASE_TAG.TrimStart('v'),
            "--output", "artifacts/tauri-release-windows-x64.json"
          )
          if ($env:JFTRADE_DESKTOP_SIGNED_CANDIDATE -eq "true") { $arguments += "--require-updater" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          node @arguments

      - name: Smoke packaged Windows Tauri runtime
        shell: pwsh
        env:
          JFTRADE_TAURI_BINARY: target/release/jftrade-desktop.exe
          JFTRADE_TAURI_SMOKE_REPORT: artifacts/tauri-runtime-smoke-windows-x64.json
        run: pnpm run smoke:tauri-release

      - name: Generate Windows SBOM
        uses: anchore/sbom-action@v0
        with:
          file: target/release/jftrade-desktop.exe
          format: spdx-json
          output-file: artifacts/JFTrade-windows-x64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest Windows build provenance
        if: ${{ github.event.repository.private == false && inputs.operation == 'candidate' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.artifact.outputs.path }}

      - name: Upload Windows release files
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-windows
          path: |
            ${{ steps.artifact.outputs.path }}
            artifacts/JFTrade-windows-x64.spdx.json
            artifacts/tauri-release-windows-x64.json
            artifacts/tauri-runtime-smoke-windows-x64.json
          if-no-files-found: error

      - name: Upload Windows updater artifacts
        if: env.JFTRADE_DESKTOP_SIGNED_CANDIDATE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-updater-windows
          path: |
            target/release/bundle/nsis/*.sig
            target/release/bundle/nsis/*.zip
            target/release/bundle/msi/*.sig
            target/release/bundle/msi/*.zip
          if-no-files-found: error

