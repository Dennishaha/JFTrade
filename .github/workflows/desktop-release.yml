name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Main-validated Git ref/SHA for a dry run, or an exact vX.Y.Z tag to publish
        required: true
        default: main
        type: string
      dry_run:
        description: Build and verify artifacts without attesting or publishing a GitHub Release
        required: false
        default: true
        type: boolean
      candidate_evidence_config:
        description: Relative config path inside the candidate qualification artifact (required for publish)
        required: false
        default: candidate-evidence-config.json
        type: string
      candidate_evidence_run_id:
        description: Successful qualification workflow run id whose artifact is bound to this tag and commit (required for publish)
        required: false
        default: ''
        type: string
      candidate_evidence_artifact:
        description: Exact artifact name in the qualification run containing the config and evidence inputs (required for publish)
        required: false
        default: desktop-release-candidate-evidence
        type: string
      candidate_evidence_workflow:
        description: Qualification workflow file used for push lookup and run provenance validation
        required: false
        default: desktop-release-qualification.yml
        type: string
  push:
    tags:
      - "v*"

permissions: {}

env:
  JFTRADE_DESKTOP_BUILD_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.release_ref }}
  JFTRADE_DESKTOP_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || (inputs.dry_run && format('v0.0.{0}', github.run_number) || inputs.release_ref) }}
  JFTRADE_DESKTOP_PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true) }}
  JFTRADE_DESKTOP_BUILD_TIME: ${{ github.event.head_commit.timestamp || '' }}

concurrency:
  group: desktop-release-${{ github.event_name == 'push' && github.ref_name || inputs.release_ref }}
  cancel-in-progress: false

jobs:
  release-inputs:
    name: Prepare Release Inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_run_id: ${{ steps.resolve_candidate.outputs.run_id }}
      candidate_run_attempt: ${{ steps.resolve_candidate.outputs.run_attempt }}
      candidate_workflow: ${{ steps.resolve_candidate.outputs.workflow }}
      candidate_artifact: ${{ steps.resolve_candidate.outputs.artifact }}
      candidate_config: ${{ steps.resolve_candidate.outputs.config }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ env.JFTRADE_DESKTOP_BUILD_REF }}
          fetch-depth: 0

      - name: Verify release policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_commit="$(git rev-parse HEAD)"
          if [[ "$JFTRADE_DESKTOP_PUBLISH" == "true" ]]; then
            if [[ ! "$JFTRADE_DESKTOP_RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || [[ "$JFTRADE_DESKTOP_RELEASE_TAG" = "v0.0.0" ]]; then
              echo "Invalid release tag: $JFTRADE_DESKTOP_RELEASE_TAG" >&2
              exit 1
            fi
            if ! git show-ref --verify --quiet "refs/tags/$JFTRADE_DESKTOP_RELEASE_TAG"; then
              echo "Publishing requires an existing tag: $JFTRADE_DESKTOP_RELEASE_TAG" >&2
              exit 1
            fi
            tag_commit="$(git rev-parse "refs/tags/$JFTRADE_DESKTOP_RELEASE_TAG^{commit}")"
            if [[ "$tag_commit" != "$head_commit" ]]; then
              echo "Checked out $head_commit, expected tag commit $tag_commit" >&2
              exit 1
            fi
          else
            echo "Dry run will build $JFTRADE_DESKTOP_BUILD_REF at $head_commit as $JFTRADE_DESKTOP_RELEASE_TAG."
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$head_commit" refs/remotes/origin/main; then
            echo "Desktop release inputs must belong to main: $head_commit" >&2
            exit 1
          fi
          ci_url="$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$head_commit" \
              -f branch=main \
              -f event=push \
              -f status=success \
              -F per_page=100 \
              --jq '.workflow_runs[0].html_url // ""'
          )"
          if [[ -z "$ci_url" ]]; then
            echo "No successful main CI run found for $head_commit" >&2
            exit 1
          fi
          echo "Verified required CI run: $ci_url"

      - name: Resolve artifact-bound candidate qualification run
        id: resolve_candidate
        if: env.JFTRADE_DESKTOP_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_evidence_run_id || '' }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_evidence_artifact || 'desktop-release-candidate-evidence' }}
          CANDIDATE_CONFIG: ${{ inputs.candidate_evidence_config || 'candidate-evidence-config.json' }}
          CANDIDATE_WORKFLOW: ${{ inputs.candidate_evidence_workflow || 'desktop-release-qualification.yml' }}
          RELEASE_TAG: ${{ env.JFTRADE_DESKTOP_RELEASE_TAG }}
          RELEASE_COMMIT: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_WORKFLOW" =~ ^[A-Za-z0-9._/-]+\.yml$ ]] || {
            echo "candidate_evidence_workflow must be a workflow filename ending in .yml" >&2
            exit 1
          }
          [[ "$CANDIDATE_ARTIFACT" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "candidate_evidence_artifact must be an exact simple artifact name" >&2
            exit 1
          }
          [[ "$CANDIDATE_CONFIG" != /* && "$CANDIDATE_CONFIG" != *".."* ]] || {
            echo "candidate_evidence_config must be a relative path without traversal" >&2
            exit 1
          }
          release_ref="refs/tags/$RELEASE_TAG"
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          run_id="$CANDIDATE_RUN_ID"
          if [[ "$EVENT_NAME" == "push" && -z "$run_id" ]]; then
            runs_json="$(gh api \
              --method GET \
              "repos/$REPOSITORY/actions/workflows/$CANDIDATE_WORKFLOW/runs?status=success&head_sha=$RELEASE_COMMIT&per_page=100")"
            run_id="$(jq -r \
              --arg sha "$RELEASE_COMMIT" \
              --arg tag "$RELEASE_TAG" \
              '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success" and .head_sha == $sha and (.head_branch == $tag or .head_branch == ("refs/tags/" + $tag)))] | sort_by(.created_at) | last.id // empty' \
              <<<"$runs_json")"
          fi
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "Publishing requires a successful candidate qualification run bound to $release_ref at $RELEASE_COMMIT; no run id was provided or found." >&2
            exit 1
          }
          run_json="$(gh api --method GET "repos/$REPOSITORY/actions/runs/$run_id")"
          run_path="$(jq -r '.path // empty' <<<"$run_json")"
          run_status="$(jq -r '.status // empty' <<<"$run_json")"
          run_conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
          run_sha="$(jq -r '.head_sha // empty' <<<"$run_json")"
          run_branch="$(jq -r '.head_branch // empty' <<<"$run_json")"
          run_attempt="$(jq -r '.run_attempt // empty' <<<"$run_json")"
          # Keep the binding stable across API display-name changes; the
          # checked workflow file is already validated through run_path.
          run_workflow="$CANDIDATE_WORKFLOW"
          expected_path=".github/workflows/$CANDIDATE_WORKFLOW"
          [[ "$run_path" == "$expected_path" || "$run_path" == "$CANDIDATE_WORKFLOW" ]] || {
            echo "Candidate run $run_id is not produced by $expected_path (actual: $run_path)" >&2
            exit 1
          }
          [[ "$run_status" == "completed" && "$run_conclusion" == "success" ]] || {
            echo "Candidate qualification run $run_id is not successful: status=$run_status conclusion=$run_conclusion" >&2
            exit 1
          }
          [[ "$run_sha" == "$RELEASE_COMMIT" ]] || {
            echo "Candidate run $run_id commit $run_sha does not match release commit $RELEASE_COMMIT" >&2
            exit 1
          }
          [[ "$run_branch" == "$RELEASE_TAG" || "$run_branch" == "$release_ref" ]] || {
            echo "Candidate run $run_id ref $run_branch does not match release tag $RELEASE_TAG" >&2
            exit 1
          }
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ && -n "$run_workflow" ]] || {
            echo "Candidate run $run_id has incomplete workflow provenance" >&2
            exit 1
          }
          artifacts_json="$(gh api --method GET "repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
          jq -e --arg name "$CANDIDATE_ARTIFACT" --argjson run_id "$run_id" \
            '.artifacts[] | select(.name == $name and .expired == false and .workflow_run.id == $run_id)' \
            <<<"$artifacts_json" >/dev/null || {
            echo "Candidate artifact $CANDIDATE_ARTIFACT is missing or expired in qualification run $run_id" >&2
            exit 1
          }
          {
            echo "run_id=$run_id"
            echo "run_attempt=$run_attempt"
            echo "workflow=$run_workflow"
            echo "artifact=$CANDIDATE_ARTIFACT"
            echo "config=$CANDIDATE_CONFIG"
          } >> "$GITHUB_OUTPUT"

      - name: Verify publish signing and updater prerequisites
        if: env.JFTRADE_DESKTOP_PUBLISH == 'true'
        env:
          JFTRADE_MACOS_CERTIFICATE_BASE64: ${{ secrets.JFTRADE_MACOS_CERTIFICATE_BASE64 }}
          JFTRADE_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.JFTRADE_MACOS_CERTIFICATE_PASSWORD }}
          JFTRADE_MACOS_SIGN_IDENTITY: ${{ secrets.JFTRADE_MACOS_SIGN_IDENTITY }}
          JFTRADE_MACOS_NOTARY_APPLE_ID: ${{ secrets.JFTRADE_MACOS_NOTARY_APPLE_ID }}
          JFTRADE_MACOS_NOTARY_PASSWORD: ${{ secrets.JFTRADE_MACOS_NOTARY_PASSWORD }}
          JFTRADE_MACOS_NOTARY_TEAM_ID: ${{ secrets.JFTRADE_MACOS_NOTARY_TEAM_ID }}
          JFTRADE_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.JFTRADE_WINDOWS_CERTIFICATE_BASE64 }}
          JFTRADE_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.JFTRADE_WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          JFTRADE_TAURI_UPDATER_PUBKEY: ${{ secrets.JFTRADE_TAURI_UPDATER_PUBKEY }}
          JFTRADE_TAURI_UPDATER_ENDPOINT: ${{ secrets.JFTRADE_TAURI_UPDATER_ENDPOINT }}
        run: node scripts/check-desktop-release-policy.mjs --publish --signing-only

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux desktop dependencies
        run: bash scripts/install-linux-desktop-dependencies.sh

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Stage 9 static release-candidate admission
        if: env.JFTRADE_DESKTOP_PUBLISH == 'true'
        run: node scripts/rust-migration/check-stage9-closeout.mjs --candidate-static

      - name: Audit locked pnpm dependencies
        run: pnpm run audit:dependencies

      - name: OSS license compliance
        run: |
          pnpm run check:oss-license
          pnpm run check:pinets-compliance

      - name: Verify Tauri host & runtime
        run: pnpm run check:tauri-release-runtime

      - name: Verify signed updater source contracts
        run: |
          node scripts/rust-migration/check-signed-updater-artifact.mjs --config-only
          node scripts/rust-migration/check-signed-updater-lifecycle.mjs

      - name: Build release inputs
        run: |
          pnpm run generate:docs
          git diff --exit-code -- \
            apps/web/src/generated/openapi.ts \
            tests/fixtures/openapi-baseline.json \
            docs/reference/generated/pine-v6-support.md
          pnpm run build:frontend-assets:generated
          pnpm run build:pineworker
          node scripts/write-desktop-release-input-manifest.mjs
          git diff --check

      - name: Verify built PineTS worker with a real backtest
        env:
          JFTRADE_PINEWORKER_BUNDLE: ${{ github.workspace }}/internal/pineworkerassets/assets/bin/worker.mjs
        run: pnpm run smoke:pinets-backtest

      - name: Verify shared desktop source
        run: pnpm run test:scripts -- desktop

      - name: Verify embedded release inputs
        run: go test -tags release_assets ./internal/frontendassets ./internal/pineworkerassets -count=1

      - name: Upload prepared release inputs
        uses: actions/upload-artifact@v7
        with:
          name: desktop-build-inputs-${{ github.run_id }}
          path: |
            docs/swagger/docs.go
            docs/swagger/swagger.json
            docs/swagger/swagger.yaml
            internal/frontendassets/dist.zip
            internal/pineworkerassets/assets/bin/worker.mjs
            artifacts/desktop-release-inputs.json
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS ARM64 DMG
    needs: release-inputs
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      JFTRADE_DESKTOP_PREPARED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.JFTRADE_DESKTOP_BUILD_REF }}

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          cache: false

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Download prepared release inputs
        uses: actions/download-artifact@v8
        with:
          name: desktop-build-inputs-${{ github.run_id }}
          path: .

      - name: Verify ARM64 runner
        run: test "$(uname -m)" = "arm64"

      - name: Build and smoke market data sidecar
        uses: ./.github/actions/build-marketdata-sidecar

      - name: Verify prepared release inputs and hashes
        run: node scripts/prepare-desktop-release.mjs

      - name: Configure macOS signing and notarization
        env:
          CERTIFICATE_BASE64: ${{ secrets.JFTRADE_MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.JFTRADE_MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.JFTRADE_MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.JFTRADE_MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.JFTRADE_MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.JFTRADE_MACOS_NOTARY_TEAM_ID }}
        run: |
          values=("$CERTIFICATE_BASE64" "$CERTIFICATE_PASSWORD" "$SIGN_IDENTITY" "$NOTARY_APPLE_ID" "$NOTARY_PASSWORD" "$NOTARY_TEAM_ID")
          configured=0
          for value in "${values[@]}"; do test -n "$value" && configured=$((configured + 1)); done
          if [ "$configured" -eq 0 ]; then
            if [[ "$JFTRADE_DESKTOP_PUBLISH" == "true" ]]; then
              echo "Publishing requires complete macOS signing and notarization credentials." >&2
              exit 1
            fi
            echo "Signing credentials are not configured; this is an unsigned dry-run artifact."
            echo "QUALIFIER=unsigned" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$configured" -ne "${#values[@]}" ]; then echo "macOS signing secrets must be all set or all unset" >&2; exit 1; fi
          keychain="$RUNNER_TEMP/jftrade-signing.keychain-db"
          certificate="$RUNNER_TEMP/jftrade-signing.p12"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          xcrun notarytool store-credentials jftrade-ci --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID"
          echo "JFTRADE_MACOS_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "JFTRADE_MACOS_NOTARY_PROFILE=jftrade-ci" >> "$GITHUB_ENV"
          echo "QUALIFIER=signed" >> "$GITHUB_ENV"

      - name: Sign native market-data helper before embedding
        run: |
          set -euo pipefail
          helper_dir="internal/marketdataassets/assets/bin/marketdata-sidecar-darwin-arm64"
          helper="$helper_dir/marketdata-sidecar-darwin-arm64"
          test -d "$helper_dir"
          test -s "$helper"
          if [[ -n "${JFTRADE_MACOS_SIGN_IDENTITY:-}" ]]; then
            codesign --force --options runtime --timestamp --deep --sign "$JFTRADE_MACOS_SIGN_IDENTITY" "$helper"
          else
            codesign --force --deep --sign - "$helper"
          fi
          codesign --verify --strict --verbose=2 "$helper"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Test macOS desktop package
        run: pnpm run test:tauri-release-runtime && cargo test -p jftrade-desktop

      - name: Build ARM64 DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          JFTRADE_TAURI_UPDATER_PUBKEY: ${{ secrets.JFTRADE_TAURI_UPDATER_PUBKEY }}
          JFTRADE_TAURI_UPDATER_ENDPOINT: ${{ secrets.JFTRADE_TAURI_UPDATER_ENDPOINT }}
        run: pnpm run prepare:tauri-release && pnpm run build:desktop:tauri

      - name: Verify signed macOS updater output
        if: env.JFTRADE_DESKTOP_PUBLISH == 'true'
        run: |
          set -euo pipefail
          updater_dir="apps/desktop/src-tauri/target/release/bundle"
          test -d "$updater_dir"
          signatures="$(find "$updater_dir" -type f -name '*.sig' -print)"
          test -n "$signatures"

      - name: Locate macOS artifact
        id: artifact
        run: |
          artifact="$(find apps/desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Verify macOS Tauri package manifest
        run: |
          mkdir -p artifacts
          updater_flag=()
          if [[ "$JFTRADE_DESKTOP_PUBLISH" == "true" ]]; then updater_flag=(--require-updater); fi
          node scripts/verify-tauri-release-artifacts.mjs \
            --platform macos-arm64 \
            --architecture arm64 \
            --version "${JFTRADE_DESKTOP_RELEASE_TAG#v}" \
            --output artifacts/tauri-release-macos-arm64.json \
            "${updater_flag[@]}"

      - name: Smoke packaged macOS Tauri runtime
        env:
          JFTRADE_TAURI_BINARY: apps/desktop/src-tauri/target/release/bundle/macos/JFTrade.app/Contents/MacOS/jftrade-desktop
          JFTRADE_TAURI_SMOKE_REPORT: artifacts/tauri-runtime-smoke-macos-arm64.json
        run: pnpm run smoke:tauri-release

      - name: Verify sealed macOS bundle
        run: |
          bundle="apps/desktop/src-tauri/target/release/bundle/macos/JFTrade.app"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          test "$(lipo -archs "$bundle/Contents/MacOS/jftrade-desktop")" = "arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Contents/Info.plist")" = "com.jftrade.desktop"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Contents/Info.plist")" = "${JFTRADE_DESKTOP_RELEASE_TAG#v}"

      - name: Generate macOS SBOM
        uses: anchore/sbom-action@v0
        with:
          path: apps/desktop/src-tauri/target/release/bundle/macos/JFTrade.app
          format: spdx-json
          output-file: artifacts/JFTrade-macos-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest macOS build provenance
        if: ${{ github.event.repository.private == false && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.artifact.outputs.path }}

      - name: Upload macOS release files
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-macos
          path: |
            ${{ steps.artifact.outputs.path }}
            artifacts/JFTrade-macos-arm64.spdx.json
            artifacts/tauri-release-macos-arm64.json
            artifacts/tauri-runtime-smoke-macos-arm64.json
          if-no-files-found: error

      - name: Upload macOS updater artifacts
        if: env.JFTRADE_DESKTOP_PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-updater-macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/macos/*.sig
            apps/desktop/src-tauri/target/release/bundle/macos/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64 Installer
    needs: release-inputs
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      JFTRADE_DESKTOP_PREPARED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.JFTRADE_DESKTOP_BUILD_REF }}

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          cache: false

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Download prepared release inputs
        uses: actions/download-artifact@v8
        with:
          name: desktop-build-inputs-${{ github.run_id }}
          path: .

      - name: Install packaging tools
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "NSIS compiler was not installed: $makensis" }
          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Split-Path $makensis) | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure Windows signing
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.JFTRADE_WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.JFTRADE_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $configured = @($env:CERTIFICATE_BASE64, $env:CERTIFICATE_PASSWORD) | Where-Object { $_ }
          if ($configured.Count -eq 0) {
            if ($env:JFTRADE_DESKTOP_PUBLISH -eq "true") { throw "Publishing requires complete Windows signing credentials." }
            Write-Host "Authenticode credentials are not configured; this is an unsigned dry-run artifact."
            "QUALIFIER=unsigned" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }
          if ($configured.Count -ne 2) { throw "Windows signing secrets must be all set or all unset" }
          $certificate = Join-Path $env:RUNNER_TEMP "jftrade-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $securePassword = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = @(Import-PfxCertificate -FilePath $certificate -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword) |
            Where-Object HasPrivateKey |
            Select-Object -First 1
          if (-not $imported) { throw "Windows signing certificate import failed" }
          "JFTRADE_WINDOWS_CERTIFICATE=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append
          "JFTRADE_WINDOWS_CERTIFICATE_PASSWORD=$env:CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
          "JFTRADE_WINDOWS_CERTIFICATE_THUMBPRINT=$($imported.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "QUALIFIER=signed" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and smoke market data sidecar
        uses: ./.github/actions/build-marketdata-sidecar

      - name: Verify prepared release inputs and hashes
        shell: pwsh
        run: node scripts/prepare-desktop-release.mjs

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Test Windows desktop package
        run: pnpm run test:tauri-release-runtime && cargo test -p jftrade-desktop

      - name: Build per-user NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          JFTRADE_TAURI_UPDATER_PUBKEY: ${{ secrets.JFTRADE_TAURI_UPDATER_PUBKEY }}
          JFTRADE_TAURI_UPDATER_ENDPOINT: ${{ secrets.JFTRADE_TAURI_UPDATER_ENDPOINT }}
        shell: pwsh
        run: pnpm run prepare:tauri-release && pnpm run build:desktop:tauri

      - name: Verify signed Windows updater output
        if: env.JFTRADE_DESKTOP_PUBLISH == 'true'
        shell: pwsh
        run: |
          $signatures = Get-ChildItem apps/desktop/src-tauri/target/release/bundle -Recurse -Filter *.sig -File -ErrorAction SilentlyContinue
          if (-not $signatures) { throw "Tauri updater signature artifacts are missing" }

      - name: Locate Windows artifact
        id: artifact
        shell: pwsh
        run: |
          $artifact = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $artifact) { throw "Windows installer was not produced" }
          "path=$($artifact.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify Windows Authenticode signatures
        if: env.JFTRADE_DESKTOP_PUBLISH == 'true'
        shell: pwsh
        run: |
          & signtool verify /pa apps/desktop/src-tauri/target/release/jftrade-desktop.exe
          if ($LASTEXITCODE -ne 0) { throw "Tauri executable Authenticode verification failed" }
          & signtool verify /pa "${{ steps.artifact.outputs.path }}"
          if ($LASTEXITCODE -ne 0) { throw "Tauri installer Authenticode verification failed" }

      - name: Verify Windows Tauri package manifest
        shell: pwsh
        run: |
          $arguments = @(
            "scripts/verify-tauri-release-artifacts.mjs",
            "--platform", "windows-x64",
            "--architecture", "amd64",
            "--version", $env:JFTRADE_DESKTOP_RELEASE_TAG.TrimStart('v'),
            "--output", "artifacts/tauri-release-windows-x64.json"
          )
          if ($env:JFTRADE_DESKTOP_PUBLISH -eq "true") { $arguments += "--require-updater" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          node @arguments

      - name: Smoke packaged Windows Tauri runtime
        shell: pwsh
        env:
          JFTRADE_TAURI_BINARY: apps/desktop/src-tauri/target/release/jftrade-desktop.exe
          JFTRADE_TAURI_SMOKE_REPORT: artifacts/tauri-runtime-smoke-windows-x64.json
        run: pnpm run smoke:tauri-release

      - name: Generate Windows SBOM
        uses: anchore/sbom-action@v0
        with:
          file: apps/desktop/src-tauri/target/release/jftrade-desktop.exe
          format: spdx-json
          output-file: artifacts/JFTrade-windows-x64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest Windows build provenance
        if: ${{ github.event.repository.private == false && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.artifact.outputs.path }}

      - name: Upload Windows release files
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-windows
          path: |
            ${{ steps.artifact.outputs.path }}
            artifacts/JFTrade-windows-x64.spdx.json
            artifacts/tauri-release-windows-x64.json
            artifacts/tauri-runtime-smoke-windows-x64.json
          if-no-files-found: error

      - name: Upload Windows updater artifacts
        if: env.JFTRADE_DESKTOP_PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-updater-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*.zip
            apps/desktop/src-tauri/target/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.zip
          if-no-files-found: error

  windows_arm64:
    name: Windows ARM64 Installer
    needs: release-inputs
    runs-on: windows-11-arm
    timeout-minutes: 35
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      JFTRADE_DESKTOP_PREPARED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.JFTRADE_DESKTOP_BUILD_REF }}

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          cache: false

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Download prepared release inputs
        uses: actions/download-artifact@v8
        with:
          name: desktop-build-inputs-${{ github.run_id }}
          path: .

      - name: Verify ARM64 runner
        shell: pwsh
        run: |
          if ((go env GOARCH) -ne "arm64") { throw "Windows ARM64 runner is required" }

      - name: Install packaging tools
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "NSIS compiler was not installed: $makensis" }
          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Split-Path $makensis) | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure Windows signing
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.JFTRADE_WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.JFTRADE_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $configured = @($env:CERTIFICATE_BASE64, $env:CERTIFICATE_PASSWORD) | Where-Object { $_ }
          if ($configured.Count -eq 0) {
            if ($env:JFTRADE_DESKTOP_PUBLISH -eq "true") { throw "Publishing requires complete Windows signing credentials." }
            Write-Host "Authenticode credentials are not configured; this is an unsigned dry-run artifact."
            "QUALIFIER=unsigned" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }
          if ($configured.Count -ne 2) { throw "Windows signing secrets must be all set or all unset" }
          $certificate = Join-Path $env:RUNNER_TEMP "jftrade-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $securePassword = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = @(Import-PfxCertificate -FilePath $certificate -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword) |
            Where-Object HasPrivateKey |
            Select-Object -First 1
          if (-not $imported) { throw "Windows signing certificate import failed" }
          "JFTRADE_WINDOWS_CERTIFICATE=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append
          "JFTRADE_WINDOWS_CERTIFICATE_PASSWORD=$env:CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
          "JFTRADE_WINDOWS_CERTIFICATE_THUMBPRINT=$($imported.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "QUALIFIER=signed" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and smoke market data sidecar
        uses: ./.github/actions/build-marketdata-sidecar

      - name: Verify prepared release inputs and hashes
        shell: pwsh
        run: node scripts/prepare-desktop-release.mjs

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Test Windows ARM64 desktop package
        run: pnpm run test:tauri-release-runtime && cargo test -p jftrade-desktop

      - name: Build ARM64 NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          JFTRADE_TAURI_UPDATER_PUBKEY: ${{ secrets.JFTRADE_TAURI_UPDATER_PUBKEY }}
          JFTRADE_TAURI_UPDATER_ENDPOINT: ${{ secrets.JFTRADE_TAURI_UPDATER_ENDPOINT }}
        shell: pwsh
        run: pnpm run prepare:tauri-release && pnpm run build:desktop:tauri

      - name: Verify signed Windows ARM64 updater output
        if: env.JFTRADE_DESKTOP_PUBLISH == 'true'
        shell: pwsh
        run: |
          $signatures = Get-ChildItem apps/desktop/src-tauri/target/release/bundle -Recurse -Filter *.sig -File -ErrorAction SilentlyContinue
          if (-not $signatures) { throw "Tauri updater signature artifacts are missing" }

      - name: Locate Windows ARM64 artifact
        id: artifact
        shell: pwsh
        run: |
          $artifact = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $artifact) { throw "Windows ARM64 installer was not produced" }
          "path=$($artifact.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify Windows ARM64 Authenticode signatures
        if: env.JFTRADE_DESKTOP_PUBLISH == 'true'
        shell: pwsh
        run: |
          & signtool verify /pa apps/desktop/src-tauri/target/release/jftrade-desktop.exe
          if ($LASTEXITCODE -ne 0) { throw "Tauri ARM64 executable Authenticode verification failed" }
          & signtool verify /pa "${{ steps.artifact.outputs.path }}"
          if ($LASTEXITCODE -ne 0) { throw "Tauri ARM64 installer Authenticode verification failed" }

      - name: Verify Windows ARM64 Tauri package manifest
        shell: pwsh
        run: |
          $arguments = @(
            "scripts/verify-tauri-release-artifacts.mjs",
            "--platform", "windows-arm64",
            "--architecture", "arm64",
            "--version", $env:JFTRADE_DESKTOP_RELEASE_TAG.TrimStart('v'),
            "--output", "artifacts/tauri-release-windows-arm64.json"
          )
          if ($env:JFTRADE_DESKTOP_PUBLISH -eq "true") { $arguments += "--require-updater" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          node @arguments

      - name: Smoke packaged Windows ARM64 Tauri runtime
        shell: pwsh
        env:
          JFTRADE_TAURI_BINARY: apps/desktop/src-tauri/target/release/jftrade-desktop.exe
          JFTRADE_TAURI_SMOKE_REPORT: artifacts/tauri-runtime-smoke-windows-arm64.json
        run: pnpm run smoke:tauri-release

      - name: Generate Windows ARM64 SBOM
        uses: anchore/sbom-action@v0
        with:
          file: ${{ steps.artifact.outputs.path }}
          format: spdx-json
          output-file: artifacts/JFTrade-windows-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest Windows ARM64 build provenance
        if: ${{ github.event.repository.private == false && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.artifact.outputs.path }}

      - name: Upload Windows ARM64 release files
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-windows-arm64
          path: |
            ${{ steps.artifact.outputs.path }}
            artifacts/JFTrade-windows-arm64.spdx.json
            artifacts/tauri-release-windows-arm64.json
            artifacts/tauri-runtime-smoke-windows-arm64.json
          if-no-files-found: error

      - name: Upload Windows ARM64 updater artifacts
        if: env.JFTRADE_DESKTOP_PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-updater-windows-arm64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*.zip
            apps/desktop/src-tauri/target/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.zip
          if-no-files-found: error

  linux:
    name: Linux x64 Packages
    needs: release-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      JFTRADE_DESKTOP_PREPARED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.JFTRADE_DESKTOP_BUILD_REF }}

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          cache: false

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Download prepared release inputs
        uses: actions/download-artifact@v8
        with:
          name: desktop-build-inputs-${{ github.run_id }}
          path: .

      - name: Install Linux desktop dependencies
        run: bash scripts/install-linux-desktop-dependencies.sh

      - name: Build and smoke market data sidecar
        uses: ./.github/actions/build-marketdata-sidecar

      - name: Verify prepared release inputs and hashes
        run: node scripts/prepare-desktop-release.mjs

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Resolve Linux release artifact names
        id: linux_artifacts
        run: |
          version="${JFTRADE_DESKTOP_RELEASE_TAG#v}"
          dir="apps/desktop/src-tauri/target/release/bundle"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bundle=$dir" >> "$GITHUB_OUTPUT"

      - name: Build Linux x64 release packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          JFTRADE_TAURI_UPDATER_PUBKEY: ${{ secrets.JFTRADE_TAURI_UPDATER_PUBKEY }}
          JFTRADE_TAURI_UPDATER_ENDPOINT: ${{ secrets.JFTRADE_TAURI_UPDATER_ENDPOINT }}
        run: pnpm run prepare:tauri-release && pnpm run build:desktop:tauri

      - name: Verify signed Linux updater output
        if: env.JFTRADE_DESKTOP_PUBLISH == 'true'
        run: |
          set -euo pipefail
          updater_dir="apps/desktop/src-tauri/target/release/bundle"
          test -d "$updater_dir"
          signatures="$(find "$updater_dir" -type f -name '*.sig' -print)"
          test -n "$signatures"

      - name: Verify Linux x64 release packages
        id: artifact
        run: |
          artifact="apps/desktop/src-tauri/target/release/jftrade-desktop"
          test -x "$artifact"
          file "$artifact" | grep -q 'ELF 64-bit'
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Resolve and verify Linux Tauri package manifest
        id: linux_package_artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          updater_flag=()
          if [[ "$JFTRADE_DESKTOP_PUBLISH" == "true" ]]; then updater_flag=(--require-updater); fi
          node scripts/verify-tauri-release-artifacts.mjs \
            --platform linux-x64 \
            --architecture amd64 \
            --version "${JFTRADE_DESKTOP_RELEASE_TAG#v}" \
            --output artifacts/tauri-release-linux-x64.json \
            "${updater_flag[@]}"
          for format in appimage deb rpm; do
            artifact="$(find "${{ steps.linux_artifacts.outputs.bundle }}/$format" -maxdepth 1 -type f -print -quit)"
            test -n "$artifact"
            echo "$format=$artifact" >> "$GITHUB_OUTPUT"
          done

      - name: Smoke packaged Linux Tauri runtime
        env:
          JFTRADE_TAURI_BINARY: apps/desktop/src-tauri/target/release/jftrade-desktop
          JFTRADE_TAURI_SMOKE_REPORT: artifacts/tauri-runtime-smoke-linux-x64.json
        run: xvfb-run -a pnpm run smoke:tauri-release

      - name: Generate Linux x64 SBOM
        uses: anchore/sbom-action@v0
        with:
          file: ${{ steps.artifact.outputs.path }}
          format: spdx-json
          output-file: artifacts/JFTrade-linux-x64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest Linux x64 build provenance
        if: ${{ github.event.repository.private == false && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ steps.linux_package_artifacts.outputs.appimage }}
            ${{ steps.linux_package_artifacts.outputs.deb }}
            ${{ steps.linux_package_artifacts.outputs.rpm }}

      - name: Upload Linux x64 release files
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-linux
          path: |
            ${{ steps.linux_package_artifacts.outputs.appimage }}
            ${{ steps.linux_package_artifacts.outputs.deb }}
            ${{ steps.linux_package_artifacts.outputs.rpm }}
            artifacts/JFTrade-linux-x64.spdx.json
            artifacts/tauri-release-linux-x64.json
            artifacts/tauri-runtime-smoke-linux-x64.json
          if-no-files-found: error

      - name: Upload Linux updater artifacts
        if: env.JFTRADE_DESKTOP_PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-updater-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.sig
            apps/desktop/src-tauri/target/release/bundle/appimage/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: >-
      always() &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true)) &&
      needs.release-inputs.result == 'success' &&
      needs.macos.result == 'success' &&
      needs.windows.result == 'success' &&
      needs.windows_arm64.result == 'success' &&
      needs.linux.result == 'success'
    needs: [release-inputs, macos, windows, windows_arm64, linux]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.JFTRADE_DESKTOP_BUILD_REF }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-release-*
          merge-multiple: true
          path: incoming

      - name: Download candidate qualification artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-inputs.outputs.candidate_artifact }}
          run-id: ${{ needs.release-inputs.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: candidate-evidence

      - name: Flatten release files
        run: |
          mkdir release
          find incoming -type f -exec cp {} release/ \;
          cp LICENSE release/LICENSE
          cp docs/legal/third-party-notices.md release/THIRD-PARTY-NOTICES.md
          test -n "$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*.spdx.json' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*.sig' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name 'tauri-release-*.json' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name 'tauri-runtime-smoke-*.json' -print -quit)"
          # Linux contributes AppImage, deb, rpm and SBOM; all platforms share the legal notice assets.
          test "$(find release -maxdepth 1 -type f | wc -l)" -ge 14

      - name: Generate SHA256SUMS
        working-directory: release
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Verify artifact-bound Stage 9 release candidate evidence
        env:
          CANDIDATE_EVIDENCE_CONFIG: ${{ needs.release-inputs.outputs.candidate_config }}
          CANDIDATE_RUN_ID: ${{ needs.release-inputs.outputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.release-inputs.outputs.candidate_run_attempt }}
          CANDIDATE_WORKFLOW: ${{ needs.release-inputs.outputs.candidate_workflow }}
          RELEASE_REF: refs/tags/${{ env.JFTRADE_DESKTOP_RELEASE_TAG }}
          RELEASE_TAG: ${{ env.JFTRADE_DESKTOP_RELEASE_TAG }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          config_path="candidate-evidence/$CANDIDATE_EVIDENCE_CONFIG"
          [[ "$CANDIDATE_EVIDENCE_CONFIG" != /* && "$CANDIDATE_EVIDENCE_CONFIG" != *".."* ]] || {
            echo "Candidate evidence config path is not a safe artifact-relative path" >&2
            exit 1
          }
          test -f "$config_path"
          cp "$config_path" candidate-evidence-config.json
          node scripts/rust-migration/check-release-candidate.mjs \
            --build \
            --config candidate-evidence-config.json \
            --base-dir release \
            --output artifacts/release-candidate-evidence.json \
            --expected-ref "$RELEASE_REF" \
            --expected-tag "$RELEASE_TAG" \
            --expected-commit "$COMMIT_SHA" \
            --expected-run-id "$CANDIDATE_RUN_ID" \
            --expected-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --expected-workflow "$CANDIDATE_WORKFLOW"
          node scripts/rust-migration/check-release-candidate.mjs \
            --check \
            --input artifacts/release-candidate-evidence.json \
            --base-dir release \
            --expected-ref "$RELEASE_REF" \
            --expected-tag "$RELEASE_TAG" \
            --expected-commit "$COMMIT_SHA" \
            --expected-run-id "$CANDIDATE_RUN_ID" \
            --expected-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --expected-workflow "$CANDIDATE_WORKFLOW"

      - name: Retain artifact-bound candidate evidence
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-candidate-evidence-${{ github.run_id }}
          path: artifacts/release-candidate-evidence.json
          if-no-files-found: error

      - name: Attest checksum manifest
        if: github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-path: release/SHA256SUMS

      - name: Upload assets and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$JFTRADE_DESKTOP_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$JFTRADE_DESKTOP_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            while IFS= read -r asset; do
              case "$asset" in
                *.AppImage|*.deb|*.rpm|*.dmg|*-setup.exe|*.spdx.json|*.sig|*.tar.gz|*.zip|tauri-release-*.json|tauri-runtime-smoke-*.json|SHA256SUMS)
                  gh release delete-asset "$JFTRADE_DESKTOP_RELEASE_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
                  ;;
              esac
            done < <(gh release view "$JFTRADE_DESKTOP_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$JFTRADE_DESKTOP_RELEASE_TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            is_draft="true"
            gh release create "$JFTRADE_DESKTOP_RELEASE_TAG" release/* --draft --verify-tag --generate-notes --title "JFTrade ${JFTRADE_DESKTOP_RELEASE_TAG#v}" --repo "$GITHUB_REPOSITORY"
          fi
          if [ "$is_draft" = "true" ]; then
            gh release edit "$JFTRADE_DESKTOP_RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          fi
