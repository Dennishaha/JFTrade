name: Backtest Performance Gate

on:
  schedule:
    # Monday 03:00 Asia/Shanghai on a GitHub-hosted Apple Silicon runner.
    - cron: "0 19 * * 0"
  workflow_dispatch:
    inputs:
      compare_ref:
        description: Optional Git ref used as the same-runner baseline; empty compares HEAD^
        required: false
        type: string

jobs:
  backtest-performance:
    name: Backtest performance gate
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Scheduled runs compare the current default-branch revision with
          # its immediate predecessor in this same job and runner.
          fetch-depth: 2

      - name: Verify macOS ARM64 benchmark runner
        run: test "$(uname -m)" = "arm64"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Prepare artifact directory
        run: mkdir -p artifacts/performance

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260709024250-82a0b07e230d

      - name: Capture current revision
        id: revision
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/jftrade-pine-bench
          cp pkg/strategy/pine/public_benchmark_test.go /tmp/jftrade-pine-bench/

      - name: Resolve comparison baseline
        id: baseline
        env:
          MANUAL_COMPARE_REF: ${{ inputs.compare_ref }}
        run: |
          set -euo pipefail
          if [[ -n "$MANUAL_COMPARE_REF" ]]; then
            git fetch --no-tags origin "$MANUAL_COMPARE_REF"
            baseline="$(git rev-parse FETCH_HEAD)"
          else
            baseline="$(git rev-parse HEAD^)"
          fi
          if [[ "$baseline" == "$(git rev-parse HEAD)" ]]; then
            echo "Comparison baseline resolves to the current revision; choose an older ref or leave compare_ref empty." >&2
            exit 1
          fi
          echo "sha=$baseline" >> "$GITHUB_OUTPUT"
          echo "Comparing ${GITHUB_SHA} against $baseline"

      - name: Run base Pine parse benchmarks
        env:
          COMPARE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          git checkout --detach "${COMPARE_SHA}"
          cp /tmp/jftrade-pine-bench/public_benchmark_test.go pkg/strategy/pine/
          go test ./pkg/strategy/pine -run '^$' \
            -bench '^BenchmarkPine(AnalyzeScript|PlanRequirements)$' \
            -benchmem -count 8 | tee artifacts/performance/pine_compile_base.txt

      - name: Run head Pine parse benchmarks
        env:
          HEAD_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          rm -f pkg/strategy/pine/public_benchmark_test.go
          git checkout --detach "${HEAD_SHA}"
          go test ./pkg/strategy/pine -run '^$' \
            -bench '^BenchmarkPine(AnalyzeScript|PlanRequirements)$' \
            -benchmem -count 8 | tee artifacts/performance/pine_compile_head.txt

      - name: Compare Pine parse benchmarks
        run: |
          node --test scripts/check-pine-benchmark-gates.test.mjs
          benchstat artifacts/performance/pine_compile_base.txt artifacts/performance/pine_compile_head.txt \
            | tee artifacts/performance/pine_compile_compare.txt
          node scripts/check-pine-benchmark-gates.mjs compile \
            artifacts/performance/pine_compile_base.txt artifacts/performance/pine_compile_head.txt

      - name: Run PineTS worker performance gate
        run: |
          go test ./pkg/strategy/pineworker -bench BenchmarkCheckPerformanceGate -run '^$' -benchmem \
            | tee artifacts/performance/pinets_worker_gate.txt

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backtest-performance-gate-${{ github.run_id }}
          path: artifacts/performance
          if-no-files-found: error
