name: Desktop Release Evidence Payload

on:
  workflow_dispatch:
    inputs:
      qualification_mode:
        description: Evidence contract to preserve through payload staging
        required: true
        default: rehearsal
        type: choice
        options:
          - rehearsal
          - candidate
      candidate_ref:
        description: Exact candidate branch ref shared by intake and payload runs
        required: true
        default: refs/heads/release/0.29.0-candidate
        type: string
      planned_release_tag:
        description: Planned vX.Y.Z tag; it does not need to exist during qualification
        required: true
        default: v0.29.0
        type: string
      source_run_id:
        description: Successful Desktop Release Evidence Intake run that published raw evidence
        required: true
        type: string
      source_run_attempt:
        description: Attempt number for source_run_id
        required: true
        type: string
      source_workflow:
        description: Must be the fixed Desktop Release Evidence Intake workflow
        required: true
        type: string
      source_artifact:
        description: Raw external evidence artifact name
        required: true
        type: string
      source_artifact_id:
        description: Immutable GitHub artifact id for the raw evidence artifact
        required: true
        type: string
      source_artifact_digest:
        description: GitHub SHA-256 digest for the raw evidence artifact
        required: true
        type: string

permissions: {}

jobs:
  verify:
    name: Verify and publish external evidence payload
    if: inputs.qualification_mode == 'candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0

      - name: Verify release and source run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          PLANNED_TAG: ${{ inputs.planned_release_tag }}
          SOURCE_WORKFLOW: ${{ inputs.source_workflow }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ inputs.source_artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PLANNED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "planned_release_tag must be a vX.Y.Z tag" >&2; exit 1; }
          [[ "$CANDIDATE_REF" =~ ^refs/heads/[A-Za-z0-9._/-]+$ && "$CANDIDATE_REF" != *".."* ]] || { echo "candidate_ref is unsafe" >&2; exit 1; }
          [[ "$GITHUB_REF" == "$CANDIDATE_REF" ]] || {
            echo "payload workflow must run from candidate_ref" >&2
            exit 1
          }
          release_commit="$(git rev-parse HEAD)"
          [[ "$GITHUB_SHA" == "$release_commit" ]] || { echo "payload GITHUB_SHA does not match candidate_ref" >&2; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ && "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo "source run ids must be positive integers" >&2; exit 1; }
          [[ "$SOURCE_WORKFLOW" == "desktop-release-evidence-intake.yml" && "$SOURCE_ARTIFACT" == "desktop-release-evidence-intake" ]] || {
            echo "source workflow must be the fixed intake workflow" >&2
            exit 1
          }
          [[ -f ".github/workflows/$SOURCE_WORKFLOW" ]] || {
            echo "trusted source workflow is not present on evidence_ref: $SOURCE_WORKFLOW" >&2
            exit 1
          }
          [[ "$SOURCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "source artifact id must be a positive integer" >&2; exit 1; }
          [[ "$SOURCE_ARTIFACT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo "source artifact name is unsafe" >&2; exit 1; }
          [[ "$SOURCE_ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "source artifact digest is invalid" >&2; exit 1; }
          source_run="$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e \
            --arg sha "$release_commit" \
            --arg attempt "$SOURCE_RUN_ATTEMPT" \
            --arg workflow "$SOURCE_WORKFLOW" \
            --arg branch "${CANDIDATE_REF#refs/heads/}" \
            '.status == "completed" and .conclusion == "success" and .head_sha == $sha and .head_branch == $branch and (.run_attempt|tostring) == $attempt and (.path == $workflow or .path == (".github/workflows/" + $workflow))' \
            <<<"$source_run" >/dev/null || { echo "source run is not a successful intake run for the release commit" >&2; exit 1; }
          source_artifact="$(gh api "repos/$REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID")"
          jq -e \
            --arg name "$SOURCE_ARTIFACT" \
            --arg digest "$SOURCE_ARTIFACT_DIGEST" \
            --argjson id "$SOURCE_ARTIFACT_ID" \
            --argjson run_id "$SOURCE_RUN_ID" \
            '.id == $id and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run_id' \
            <<<"$source_artifact" >/dev/null || { echo "source artifact API metadata does not match inputs" >&2; exit 1; }

      - name: Download raw evidence by immutable artifact id
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf incoming
          mkdir -p incoming
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          gh api -H "Accept: application/vnd.github+json" -H "Accept: application/zip" \
            "repos/$REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$archive"
          while IFS= read -r entry; do
            [[ "$entry" != /* && "$entry" != *".."* && "$entry" != *"\\"* ]] || { echo "unsafe source archive path: $entry" >&2; exit 1; }
          done < <(unzip -Z1 "$archive")
          unzip -q "$archive" -d incoming
          [[ -z "$(find incoming -type l -print -quit)" ]] || { echo "raw evidence archive must not contain symlinks" >&2; exit 1; }
          [[ -f incoming/reports/signed-updater-inputs.json ]] || { echo "raw evidence artifact has no reports" >&2; exit 1; }
          [[ -f incoming/source-binding.json && ! -L incoming/source-binding.json && -s incoming/source-binding.json ]] || { echo "intake artifact has no source-binding.json" >&2; exit 1; }

      - name: Run dedicated evidence checkers
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PLANNED_TAG: ${{ inputs.planned_release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="${PLANNED_TAG#v}"
          updater_endpoint="$(jq -r '.endpoint // empty' incoming/updater-config.json)"
          updater_public_key="$(jq -r '.publicKey // empty' incoming/updater-config.json)"
          node scripts/release/check-signed-updater-artifact.mjs \
            --artifacts incoming/updater-artifacts \
            --feed incoming/updater-feed.json \
            --endpoint "$updater_endpoint" \
            --public-key "$updater_public_key" \
            --expected-version "$release_version"
          node scripts/release/check-sbom-provenance.mjs \
            --manifest incoming/sbom-provenance.json \
            --base-dir incoming \
            --require-targets
          source_workflow="$(jq -r '.binding.workflow // empty' incoming/source-binding.json)"
          source_ref="$(jq -r '.binding.ref // empty' incoming/source-binding.json)"
          source_commit="$(jq -r '.binding.commitSha // empty' incoming/source-binding.json)"
          source_run_id="$(jq -r '.binding.runId // empty' incoming/source-binding.json)"
          source_attempt="$(jq -r '.binding.attempt // empty' incoming/source-binding.json)"
          source_artifact="$(jq -r '.binding.artifact.name // empty' incoming/source-binding.json)"
          source_artifact_id="$(jq -r '.binding.artifact.id // empty' incoming/source-binding.json)"
          source_artifact_digest="$(jq -r '.binding.artifact.digest // empty' incoming/source-binding.json)"
          source_repository="$(jq -r '.sourceRepository // empty' incoming/source-binding.json)"
          [[ "$source_repository" =~ ^[^/[:space:]]+/[^/[:space:]]+$ ]] || { echo "source binding repository is invalid" >&2; exit 1; }
          source_run_json="$(gh api "repos/$source_repository/actions/runs/$source_run_id")"
          source_branch="${source_ref#refs/heads/}"
          source_branch="${source_branch#refs/tags/}"
          jq -e \
            --arg sha "$source_commit" --arg branch "$source_branch" --arg ref "$source_ref" \
            --arg attempt "$source_attempt" --arg workflow "$source_workflow" \
            '.status == "completed" and .conclusion == "success" and .head_sha == $sha and (.run_attempt|tostring) == $attempt and ($ref == $sha or .head_branch == $branch or .head_branch == $ref) and (.path == $workflow or .path == (".github/workflows/" + $workflow))' \
            <<<"$source_run_json" >/dev/null || { echo "source binding run API metadata does not match" >&2; exit 1; }
          source_artifact_json="$(gh api "repos/$source_repository/actions/artifacts/$source_artifact_id")"
          jq -e \
            --arg name "$source_artifact" --arg digest "$source_artifact_digest" \
            --argjson id "$source_artifact_id" --argjson run_id "$source_run_id" \
            '.id == $id and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run_id' \
            <<<"$source_artifact_json" >/dev/null || { echo "source binding artifact API metadata does not match" >&2; exit 1; }

      - name: Verify report semantics without synthesizing evidence
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.schemaVersion // empty' incoming/source-binding.json)" == "jftrade.release-evidence-source-binding.v1" ]] || { echo "source binding schema is invalid" >&2; exit 1; }
          SOURCE_REF="$(jq -r '.binding.ref // empty' incoming/source-binding.json)"
          SOURCE_COMMIT="$(jq -r '.binding.commitSha // empty' incoming/source-binding.json)"
          SOURCE_WORKFLOW="$(jq -r '.binding.workflow // empty' incoming/source-binding.json)"
          SOURCE_RUN_ID="$(jq -r '.binding.runId // empty' incoming/source-binding.json)"
          SOURCE_RUN_ATTEMPT="$(jq -r '.binding.attempt // empty' incoming/source-binding.json)"
          SOURCE_ARTIFACT="$(jq -r '.binding.artifact.name // empty' incoming/source-binding.json)"
          SOURCE_ARTIFACT_ID="$(jq -r '.binding.artifact.id // empty' incoming/source-binding.json)"
          SOURCE_ARTIFACT_DIGEST="$(jq -r '.binding.artifact.digest // empty' incoming/source-binding.json)"
          node scripts/release/verify-release-evidence-payload.mjs \
            --root incoming \
            --repository "$GITHUB_REPOSITORY" \
            --release-ref "$CANDIDATE_REF" \
            --payload-ref "$SOURCE_REF" \
            --payload-commit-sha "$SOURCE_COMMIT" \
            --payload-workflow "$SOURCE_WORKFLOW" \
            --payload-run-id "$SOURCE_RUN_ID" \
            --payload-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --payload-artifact "$SOURCE_ARTIFACT" \
            --payload-artifact-id "$SOURCE_ARTIFACT_ID" \
            --payload-artifact-digest "$SOURCE_ARTIFACT_DIGEST"

      - name: Publish verified payload reports byte-identically
        shell: bash
        run: |
          set -euo pipefail
          rm -rf payload-output
          mkdir -p payload-output/reports
          for report in signed-updater-inputs sbom-provenance-inputs rollback-artifact-pair backup-restore-drill security-review-inputs; do
            source="incoming/reports/$report.json"
            [[ -f "$source" && ! -L "$source" && -s "$source" ]] || { echo "missing verified report: $source" >&2; exit 1; }
            cp -- "$source" "payload-output/reports/$report.json"
          done

      - name: Upload desktop-release-evidence-payload
        id: upload_payload
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-evidence-payload
          path: payload-output
          if-no-files-found: error
          retention-days: 90

      - name: Verify published payload artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_ARTIFACT_ID: ${{ steps.upload_payload.outputs.artifact-id }}
          PRODUCER_ARTIFACT_DIGEST: ${{ steps.upload_payload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_WORKFLOW="$(jq -r '.binding.workflow // empty' incoming/source-binding.json)"
          SOURCE_RUN_ID="$(jq -r '.binding.runId // empty' incoming/source-binding.json)"
          SOURCE_RUN_ATTEMPT="$(jq -r '.binding.attempt // empty' incoming/source-binding.json)"
          SOURCE_REF="$(jq -r '.binding.ref // empty' incoming/source-binding.json)"
          SOURCE_COMMIT="$(jq -r '.binding.commitSha // empty' incoming/source-binding.json)"
          SOURCE_ARTIFACT="$(jq -r '.binding.artifact.name // empty' incoming/source-binding.json)"
          SOURCE_ARTIFACT_ID="$(jq -r '.binding.artifact.id // empty' incoming/source-binding.json)"
          SOURCE_ARTIFACT_DIGEST="$(jq -r '.binding.artifact.digest // empty' incoming/source-binding.json)"
          SOURCE_REPOSITORY="$(jq -r '.sourceRepository // empty' incoming/source-binding.json)"
          [[ "$SOURCE_WORKFLOW" == "desktop-release-evidence-source.yml" ]] || { echo "intake source binding is not the fixed external workflow" >&2; exit 1; }
          [[ "$PRODUCER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$PRODUCER_ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "published payload artifact outputs are invalid" >&2; exit 1; }
          published="$(gh api "repos/$REPOSITORY/actions/artifacts/$PRODUCER_ARTIFACT_ID")"
          jq -e \
            --arg name "desktop-release-evidence-payload" \
            --arg digest "$PRODUCER_ARTIFACT_DIGEST" \
            --argjson id "$PRODUCER_ARTIFACT_ID" \
            --argjson run_id "$PRODUCER_RUN_ID" \
            '.id == $id and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run_id' \
            <<<"$published" >/dev/null || { echo "published payload artifact API metadata mismatch" >&2; exit 1; }
          jq -n \
            --arg schema "./release-evidence-payload-binding.schema.json" \
            --arg schema_version "jftrade.release-evidence-payload-binding.v1" \
            --arg repository "$REPOSITORY" \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg release_ref "${{ inputs.candidate_ref }}" \
            --arg evidence_ref "$SOURCE_REF" \
            --argjson run_id "$PRODUCER_RUN_ID" \
            --argjson attempt "${{ github.run_attempt }}" \
            --arg workflow "desktop-release-evidence-payload.yml" \
            --arg ref "$SOURCE_REF" \
            --arg commit "$SOURCE_COMMIT" \
            --arg name "desktop-release-evidence-payload" \
            --argjson id "$PRODUCER_ARTIFACT_ID" \
            --arg digest "$PRODUCER_ARTIFACT_DIGEST" \
            --arg source_workflow "$SOURCE_WORKFLOW" \
            --argjson source_run_id "$SOURCE_RUN_ID" \
            --argjson source_attempt "$SOURCE_RUN_ATTEMPT" \
            --arg source_artifact "$SOURCE_ARTIFACT" \
            --argjson source_artifact_id "$SOURCE_ARTIFACT_ID" \
            --arg source_artifact_digest "$SOURCE_ARTIFACT_DIGEST" \
            '{"$schema":$schema,schemaVersion:$schema_version,repository:$repository,sourceRepository:$source_repository,releaseRef:$release_ref,evidenceRef:$evidence_ref,payloadRun:{id:$run_id,attempt:$attempt,workflow:$workflow,ref:$ref,commitSha:$commit},artifact:{name:$name,id:$id,digest:$digest},sourceBinding:{repository:$repository,releaseRef:$release_ref,ref:$ref,commitSha:$commit,workflow:$source_workflow,runId:$source_run_id,attempt:$source_attempt,artifact:{name:$source_artifact,id:$source_artifact_id,digest:$source_artifact_digest}}}' \
            > payload-artifact-metadata.json
          cp -- payload-artifact-metadata.json payload-output/payload-artifact-metadata.json

      - name: Upload payload provenance metadata
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-evidence-payload-provenance
          path: payload-artifact-metadata.json
          if-no-files-found: error
          retention-days: 90

  rehearsal-payload:
    name: Preserve unsigned rehearsal intake bytes
    if: inputs.qualification_mode == 'rehearsal'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0

      - name: Verify rehearsal intake run and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PLANNED_TAG: ${{ inputs.planned_release_tag }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          SOURCE_WORKFLOW: ${{ inputs.source_workflow }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ inputs.source_artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$PLANNED_TAG" == "v0.29.0" ]] || { echo "rehearsal planned_release_tag must be v0.29.0" >&2; exit 1; }
          [[ "$CANDIDATE_REF" == "refs/heads/release/0.29.0-candidate" && "$GITHUB_REF" == "$CANDIDATE_REF" ]] || { echo "rehearsal must run from the fixed candidate branch" >&2; exit 1; }
          [[ "$SOURCE_WORKFLOW" == "desktop-release-evidence-intake.yml" && "$SOURCE_ARTIFACT" == "desktop-release-rehearsal-intake" ]] || { echo "rehearsal payload only trusts the fixed intake artifact" >&2; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ && "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ && "$SOURCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$SOURCE_ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "rehearsal intake identity is invalid" >&2; exit 1; }
          commit_sha="$(git rev-parse HEAD)"
          run_json="$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg sha "$commit_sha" --arg branch "release/0.29.0-candidate" --arg attempt "$SOURCE_RUN_ATTEMPT" \
            '.status == "completed" and .conclusion == "success" and .head_sha == $sha and .head_branch == $branch and (.run_attempt|tostring) == $attempt and (.path == ".github/workflows/desktop-release-evidence-intake.yml" or .path == "desktop-release-evidence-intake.yml")' \
            <<<"$run_json" >/dev/null || { echo "rehearsal intake run provenance mismatch" >&2; exit 1; }
          artifact_json="$(gh api "repos/$REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID")"
          jq -e --arg name "$SOURCE_ARTIFACT" --arg digest "$SOURCE_ARTIFACT_DIGEST" --argjson id "$SOURCE_ARTIFACT_ID" --argjson run_id "$SOURCE_RUN_ID" \
            '.id == $id and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run_id' \
            <<<"$artifact_json" >/dev/null || { echo "rehearsal intake artifact provenance mismatch" >&2; exit 1; }

      - name: Download and verify byte-identical rehearsal intake
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ inputs.source_artifact_digest }}
        run: |
          set -euo pipefail
          rm -rf incoming
          mkdir incoming
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          gh api -H "Accept: application/zip" "repos/$REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$archive"
          [[ "sha256:$(sha256sum "$archive" | awk '{print $1}')" == "$SOURCE_ARTIFACT_DIGEST" ]] || { echo "rehearsal intake artifact digest drift" >&2; exit 1; }
          unzip -q "$archive" -d incoming
          [[ -f incoming/release-candidate-rehearsal.json && -z "$(find incoming -type l -print -quit)" ]] || { echo "rehearsal intake payload is invalid" >&2; exit 1; }
          node scripts/release/check-release-candidate-rehearsal.mjs \
            --check --input incoming/release-candidate-rehearsal.json \
            --expected-ref refs/heads/release/0.29.0-candidate \
            --expected-tag v0.29.0 \
            --expected-commit "$(git rev-parse HEAD)"

      - name: Upload byte-identical rehearsal payload
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-rehearsal-payload
          path: incoming
          if-no-files-found: error
          retention-days: 90
