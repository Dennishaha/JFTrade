name: Desktop Release Evidence Intake

# This is the single provenance root for raw release evidence.  It accepts a
# completed run from one fixed external evidence runner, verifies all GitHub
# API identities and the immutable artifact digest, then republishes the
# downloaded bytes unchanged.  It never emits a passed report itself.
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact vX.Y.Z tag covered by the external evidence run
        required: true
        type: string
      source_ref:
        description: Exact ref recorded by the external evidence run
        required: true
        type: string
      source_repository:
        description: owner/name repository that owns the external evidence run
        required: true
        type: string
      source_commit_sha:
        description: Commit SHA recorded by the external evidence run
        required: true
        type: string
      source_run_id:
        description: Completed run id from the fixed external evidence runner
        required: true
        type: string
      source_run_attempt:
        description: Attempt number for source_run_id
        required: true
        type: string
      source_artifact:
        description: Exact raw evidence artifact name
        required: true
        type: string
      source_artifact_id:
        description: Immutable GitHub artifact id for the raw evidence artifact
        required: true
        type: string
      source_artifact_digest:
        description: GitHub SHA-256 digest for the raw evidence artifact
        required: true
        type: string

permissions: {}

env:
  # Do not turn this into an input.  A source artifact from another workflow
  # is accepted only when the GitHub run API reports this exact path.
  TRUSTED_EXTERNAL_SOURCE_WORKFLOW: desktop-release-evidence-source.yml

jobs:
  intake:
    name: Intake immutable external release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Verify fixed source run and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ inputs.release_ref }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_COMMIT: ${{ inputs.source_commit_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ inputs.source_artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release_ref must be a vX.Y.Z tag" >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_REF" ]] || { echo "intake must run from the release tag" >&2; exit 1; }
          release_commit="$(git rev-parse HEAD)"
          [[ "$GITHUB_SHA" == "$release_commit" ]] || { echo "intake checkout does not match GITHUB_SHA" >&2; exit 1; }
          [[ "$SOURCE_REF" =~ ^(refs/heads/|refs/tags/)?[A-Za-z0-9._/-]+$ && "$SOURCE_REF" != /* && "$SOURCE_REF" != *".."* ]] || { echo "source_ref is unsafe" >&2; exit 1; }
          [[ "$SOURCE_REPOSITORY" =~ ^[^/[:space:]]+/[^/[:space:]]+$ ]] || { echo "source_repository must be owner/name" >&2; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$|^[a-f0-9]{64}$ ]] || { echo "source_commit_sha is invalid" >&2; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ && "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo "source run ids must be positive integers" >&2; exit 1; }
          [[ "$SOURCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "source artifact id must be a positive integer" >&2; exit 1; }
          [[ "$SOURCE_ARTIFACT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo "source artifact name is unsafe" >&2; exit 1; }
          [[ "$SOURCE_ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "source artifact digest is invalid" >&2; exit 1; }
          source_run="$(gh api "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          source_branch="${SOURCE_REF#refs/heads/}"
          source_branch="${source_branch#refs/tags/}"
          jq -e \
            --arg sha "$SOURCE_COMMIT" \
            --arg release_sha "$release_commit" \
            --arg branch "$source_branch" \
            --arg ref "$SOURCE_REF" \
            --arg attempt "$SOURCE_RUN_ATTEMPT" \
            --arg workflow "$TRUSTED_EXTERNAL_SOURCE_WORKFLOW" \
            '.status == "completed" and .conclusion == "success" and .head_sha == $sha and .head_sha == $release_sha and (.run_attempt|tostring) == $attempt and ($ref == $sha or .head_branch == $branch or .head_branch == $ref) and (.path == $workflow or .path == (".github/workflows/" + $workflow))' \
            <<<"$source_run" >/dev/null || { echo "source run is not a successful fixed external evidence run for the release commit" >&2; exit 1; }
          artifacts="$(gh api "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          jq -e \
            --arg name "$SOURCE_ARTIFACT" \
            --arg digest "$SOURCE_ARTIFACT_DIGEST" \
            --argjson id "$SOURCE_ARTIFACT_ID" \
            --argjson run_id "$SOURCE_RUN_ID" \
            '[.artifacts[] | select(.id == $id and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run_id)] | length == 1' \
            <<<"$artifacts" >/dev/null || { echo "source artifact is missing, expired, ambiguous, or digest-mismatched" >&2; exit 1; }
          source_artifact_json="$(gh api "repos/$SOURCE_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID")"
          jq -e \
            --arg name "$SOURCE_ARTIFACT" \
            --arg digest "$SOURCE_ARTIFACT_DIGEST" \
            --argjson id "$SOURCE_ARTIFACT_ID" \
            --argjson run_id "$SOURCE_RUN_ID" \
            '.id == $id and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run_id' \
            <<<"$source_artifact_json" >/dev/null || { echo "source artifact detail does not match immutable inputs" >&2; exit 1; }

      - name: Download raw evidence by immutable artifact id
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf incoming
          mkdir -p incoming
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          gh api -H "Accept: application/vnd.github+json" -H "Accept: application/zip" \
            "repos/$SOURCE_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$archive"
          while IFS= read -r entry; do
            [[ "$entry" != /* && "$entry" != *".."* && "$entry" != *"\\"* ]] || { echo "unsafe source archive path: $entry" >&2; exit 1; }
          done < <(unzip -Z1 "$archive")
          unzip -q "$archive" -d incoming
          [[ -z "$(find incoming -type l -print -quit)" ]] || { echo "raw evidence archive must not contain symlinks" >&2; exit 1; }
          [[ -d incoming/reports ]] || { echo "raw evidence artifact must contain reports/" >&2; exit 1; }

      - name: Verify incoming reports and write detached provenance only
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_COMMIT: ${{ inputs.source_commit_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ inputs.source_artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rust-migration/verify-release-evidence-source.mjs \
            --root incoming \
            --output incoming/source-binding.json \
            --repository "$GITHUB_REPOSITORY" \
            --source-repository "$SOURCE_REPOSITORY" \
            --release-ref "refs/tags/$RELEASE_REF" \
            --source-ref "$SOURCE_REF" \
            --source-commit-sha "$SOURCE_COMMIT" \
            --source-workflow "$TRUSTED_EXTERNAL_SOURCE_WORKFLOW" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --source-artifact "$SOURCE_ARTIFACT" \
            --source-artifact-id "$SOURCE_ARTIFACT_ID" \
            --source-artifact-digest "$SOURCE_ARTIFACT_DIGEST"

      - name: Publish immutable intake artifact without rewriting reports
        id: upload_intake
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-evidence-intake
          path: incoming
          if-no-files-found: error
          retention-days: 90

      - name: Verify published intake artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          INTAKE_ARTIFACT_ID: ${{ steps.upload_intake.outputs.artifact-id }}
          INTAKE_ARTIFACT_DIGEST: ${{ steps.upload_intake.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INTAKE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$INTAKE_ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "published intake artifact outputs are invalid" >&2; exit 1; }
          published="$(gh api "repos/$REPOSITORY/actions/artifacts/$INTAKE_ARTIFACT_ID")"
          jq -e \
            --arg name "desktop-release-evidence-intake" \
            --arg digest "$INTAKE_ARTIFACT_DIGEST" \
            --argjson id "$INTAKE_ARTIFACT_ID" \
            --argjson run_id "${{ github.run_id }}" \
            '.id == $id and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run_id' \
            <<<"$published" >/dev/null || { echo "published intake artifact API metadata mismatch" >&2; exit 1; }
