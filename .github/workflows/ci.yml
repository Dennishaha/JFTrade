name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts & Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          cache: true

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate contracts and reference docs
        run: pnpm run generate:docs

      - name: Verify OpenAPI contract quality
        run: |
          pnpm run check:openapi-quality
          pnpm run check:web-contract-audit
          pnpm run check:web-component-budget

      - name: Verify generated contract inputs
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            docs/swagger/docs.go \
            docs/swagger/swagger.json \
            docs/swagger/swagger.yaml \
            apps/web/src/generated/openapi.ts \
            tests/fixtures/openapi-baseline.json \
            docs/reference/generated/api.md \
            docs/reference/generated/types.md \
            docs/reference/generated/pine-v6-support.md; do
            test -s "$file"
          done
          git diff --exit-code -- \
            apps/web/src/generated/openapi.ts \
            tests/fixtures/openapi-baseline.json \
            docs/reference/generated/pine-v6-support.md

      - name: Upload generated contracts
        uses: actions/upload-artifact@v7
        with:
          name: ci-contracts-${{ github.run_id }}
          path: |
            docs/swagger
            apps/web/src/generated/openapi.ts
            tests/fixtures/openapi-baseline.json
            docs/reference/generated
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  rust-quality:
    name: Rust Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Verify locked Rust workspace
        run: cargo metadata --locked --format-version 1 --no-deps >/dev/null

      - name: Format, lint, and test Rust
        run: pnpm run check:rust

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Enforce Rust dependency policy
        run: pnpm run check:rust:policy

  rust-platform:
    name: Rust Compile (${{ matrix.label }})
    if: ${{ github.event_name == 'push' }}
    needs: rust-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - label: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
          - label: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Check native target
        run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}

  go-quality:
    name: Go Quality
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOFLAGS: "-tags=gtk3"
      JFTRADE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download generated contracts
        uses: ./.github/actions/download-contracts

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Install Linux desktop and CI dependencies
        run: |
          bash scripts/install-linux-desktop-dependencies.sh
          sudo apt-get install -y ripgrep

      - name: Install revive
        run: |
          go install github.com/mgechev/revive@v1.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Test and migration policies
        run: |
          pnpm run test:test-policy
          pnpm run check:test-names
          pnpm run check:test-quality
          pnpm run check:servercore-budget
          pnpm run check:web-api-boundary
          pnpm run check:web-contract-index
          pnpm run check:web-contract-audit
          pnpm run check:web-openapi-imports

      - name: Architecture dependency check
        run: bash scripts/check-arch-deps.sh

      - name: Go production file length gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm run check:go-file-length
          list_file="$(mktemp)"
          trap 'rm -f "$list_file"' EXIT
          find cmd internal pkg -type f -name '*.go' ! -name '*_test.go' -print0 >"$list_file" 2>/dev/null

          files=()
          while IFS= read -r -d '' file; do
            case "$file" in
              *.pb.go|*/pb/*)
                continue
                ;;
            esac

            first_line="$(sed -n '1p' "$file")"
            if [[ "$first_line" =~ ^//[[:space:]]Code[[:space:]]generated.*DO[[:space:]]NOT[[:space:]]EDIT\.?$ ]]; then
              continue
            fi

            # Frozen >800-line files are checked by check:go-file-length-budget;
            # revive enforces the global limit for every file that can be split now.
            if (( $(wc -l <"$file") > 800 )); then
              continue
            fi

            files+=("$file")
          done <"$list_file"

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No production Go files matched revive gate."
            exit 0
          fi

          revive -config .revive-file-length-prod.toml -set_exit_status "${files[@]}"

      - name: Go test file length gate
        shell: bash
        run: |
          set -euo pipefail
          list_file="$(mktemp)"
          trap 'rm -f "$list_file"' EXIT
          find cmd internal pkg -type f -name '*_test.go' -print0 >"$list_file" 2>/dev/null

          files=()
          while IFS= read -r -d '' file; do
            case "$file" in
              *.pb.go|*/pb/*)
                continue
                ;;
            esac

            first_line="$(sed -n '1p' "$file")"
            if [[ "$first_line" =~ ^//[[:space:]]Code[[:space:]]generated.*DO[[:space:]]NOT[[:space:]]EDIT\.?$ ]]; then
              continue
            fi

            files+=("$file")
          done <"$list_file"

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No test Go files matched revive gate."
            exit 0
          fi

          revive -config .revive-file-length-test.toml -set_exit_status "${files[@]}"

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0
          args: --timeout=5m --build-tags=gtk3 --max-issues-per-linter=0 --max-same-issues=0

      - name: Lint new error handling
        run: pnpm run lint:go:errorlint

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test command packages
        run: go test ./cmd/... -count=1 -timeout 300s

      - name: Check Tauri release runtime
        run: pnpm run check:tauri-release-runtime

      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  proto-generation:
    name: Proto Generation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Test cross-platform proto generators
        run: |
          go test ./cmd/generate-futu-proto ./cmd/generate-pineworker-proto ./cmd/internal/protogen -count=1 -timeout 120s
          go run ./cmd/generate-futu-proto -verify-repository

      - name: Validate cross-platform pnpm lockfile
        run: pnpm install --lockfile-only --frozen-lockfile

  go-coverage:
    name: Go Coverage
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      JFTRADE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download generated contracts
        uses: ./.github/actions/download-contracts

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          cache: true

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Install PineTS integration dependency
        run: pnpm --filter @jftrade/pineworker install --prod --frozen-lockfile

      - name: Go coverage gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/coverage
          pnpm run test:coverage:go -- -package ./cmd/jftrade-api -package ./internal/... -package ./pkg/... -package ./scripts 2>&1 | tee artifacts/coverage/go.txt
          go test ./internal/marketdata ./internal/integration/futu -run Concurrent -count=20 -timeout=120s 2>&1 | tee artifacts/coverage/go-concurrency.txt

      - name: Summarize Go coverage
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Go coverage"
            if [[ -f artifacts/coverage/go.txt ]]; then
              grep -E '^Go (diff )?coverage:|^Critical ' artifacts/coverage/go.txt || true
            else
              echo "Coverage command did not produce a report."
            fi
            echo "Full output: ci-go-coverage-${{ github.run_id }}-${{ github.run_attempt }} artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Go coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-go-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/coverage
          if-no-files-found: warn
          retention-days: 7

  go-regression:
    name: Go Regression (main)
    if: ${{ github.event_name == 'push' }}
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download generated contracts
        uses: ./.github/actions/download-contracts

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          cache: true

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Install PineTS integration dependency
        run: pnpm --filter @jftrade/pineworker install --prod --frozen-lockfile

      - name: Full deterministic Go regression
        shell: bash
        run: |
          set -euo pipefail
          # This job intentionally runs without cgo. The Wails desktop command
          # requires GTK/cgo on Linux and is covered by the dedicated desktop lanes.
          package_list="$(mktemp)"
          trap 'rm -f "$package_list"' EXIT
          go list ./... >"$package_list"
          packages=()
          while IFS= read -r package; do
            case "$package" in
              */cmd/jftrade-desktop)
                continue
                ;;
            esac
            packages+=("$package")
          done <"$package_list"
          go test "${packages[@]}" -count=1 -timeout=300s

  web-quality:
    name: Web Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JFTRADE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          cache: true

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit locked pnpm dependencies
        run: pnpm run audit:dependencies

      - name: OSS license compliance
        run: pnpm run check:oss-license

      - name: Frontend test and coverage gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/coverage
          pnpm run test:coverage:web 2>&1 | tee artifacts/coverage/web.txt

      - name: Summarize Web coverage
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Web coverage"
            if [[ -f artifacts/coverage/web.txt ]]; then
              grep -E 'All files|Web diff coverage:|Statements|Branches|Functions|Lines' artifacts/coverage/web.txt || true
            else
              echo "Coverage command did not produce a report."
            fi
            echo "Full output and JSON report: ci-web-coverage-${{ github.run_id }}-${{ github.run_attempt }} artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Web coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-web-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/coverage/web.txt
            apps/web/coverage
          if-no-files-found: warn
          retention-days: 7

      - name: Frontend typecheck
        run: pnpm run typecheck:web

      - name: Desktop release script tests
        run: pnpm run test:scripts -- desktop

  web-assets:
    name: Web Assets
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download generated contracts
        uses: ./.github/actions/download-contracts

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          cache: true

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets from generated contracts
        run: pnpm run build:frontend-assets:generated

      - name: Frontend release asset test
        run: go test -tags release_assets ./internal/frontendassets -run TestFileSystem

      - name: Upload frontend build input
        uses: actions/upload-artifact@v7
        with:
          name: ci-web-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: internal/frontendassets/dist.zip
          if-no-files-found: error
          retention-days: 1

  marketdata-sidecar:
    name: Market Data Sidecar (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Sync locked sidecar dependencies
        run: uv sync --locked --project workers/marketdata-sidecar --extra runtime --extra test --extra build

      - name: Test sidecar without external market-data access
        run: uv run --locked --project workers/marketdata-sidecar --extra runtime --extra test pytest workers/marketdata-sidecar/tests

      - name: Test native helper build script
        if: ${{ matrix.python == '3.14' }}
        run: pnpm run test:marketdata-sidecar-asset-build

      - name: Build Linux native market-data helper
        if: ${{ matrix.python == '3.14' }}
        run: pnpm run build:marketdata-sidecar

      - name: Smoke Linux native market-data helper
        if: ${{ matrix.python == '3.14' }}
        run: pnpm run smoke:marketdata-sidecar

      - name: Verify embedded Linux market-data helper
        if: ${{ matrix.python == '3.14' }}
        run: go test -tags release_assets ./internal/marketdataassets -count=1

  pine:
    name: Pine & Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          cache: true

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Install Pine dependencies
        run: pnpm --filter @jftrade/pineworker install --frozen-lockfile

      - name: PineTS worker test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/coverage
          pnpm run test:coverage:worker 2>&1 | tee artifacts/coverage/pineworker.txt

      - name: Summarize PineTS worker coverage
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## PineTS worker coverage"
            if [[ -f artifacts/coverage/pineworker.txt ]]; then
              grep -E 'All files|Statements|Branches|Functions|Lines' artifacts/coverage/pineworker.txt || true
            else
              echo "Coverage command did not produce a report."
            fi
            echo "Full output and JSON report: ci-pineworker-coverage-${{ github.run_id }}-${{ github.run_attempt }} artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PineTS worker coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-pineworker-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/coverage/pineworker.txt
            workers/pineworker/coverage
          if-no-files-found: warn
          retention-days: 7

      - name: PineTS worker typecheck
        run: pnpm run typecheck:pineworker

      - name: PineTS release check script test
        run: pnpm run test:pinets-release-check

      - name: PineTS compliance notice check
        run: pnpm run check:pinets-compliance

      - name: PineTS shadow corpus report
        env:
          JFTRADE_PINETS_SHADOW_REPORT_PATH: ${{ github.workspace }}/artifacts/pinets-shadow/report.json
        run: |
          mkdir -p artifacts/pinets-shadow
          pnpm run test:pinets-shadow-corpus

      - name: Upload PineTS shadow corpus report
        if: ${{ always() && hashFiles('artifacts/pinets-shadow/report.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: pinets-shadow-corpus-${{ github.run_id }}
          path: artifacts/pinets-shadow/report.json
          if-no-files-found: warn

      - name: PineTS worker asset build script test
        run: pnpm run test:pineworker-asset-build

      - name: Build PineTS worker input
        run: pnpm run build:pineworker

      - name: Verify embedded PineTS worker input
        run: go test -tags release_assets ./internal/pineworkerassets -count=1

      - name: Real PineTS backtest smoke (main)
        if: ${{ github.event_name == 'push' }}
        env:
          JFTRADE_PINEWORKER_BUNDLE: ${{ github.workspace }}/internal/pineworkerassets/assets/bin/worker.mjs
        run: pnpm run smoke:pinets-backtest

      - name: Upload PineTS worker build input
        uses: actions/upload-artifact@v7
        with:
          name: ci-pine-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: internal/pineworkerassets/assets/bin/worker.mjs
          if-no-files-found: error
          retention-days: 1

  desktop-linux-smoke:
    name: Desktop Linux Smoke (PR)
    if: ${{ github.event_name == 'pull_request' }}
    needs: [contracts, go-quality, proto-generation, go-coverage, web-quality, web-assets, marketdata-sidecar, pine]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JFTRADE_DESKTOP_PREPARED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Build and smoke market data sidecar
        uses: ./.github/actions/build-marketdata-sidecar

      - name: Download desktop build inputs
        uses: ./.github/actions/download-desktop-assets
        with:
          frontend_artifact: ci-web-assets-${{ github.run_id }}-${{ github.run_attempt }}
          pine_artifact: ci-pine-assets-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Install Linux desktop dependencies
        run: bash scripts/install-linux-desktop-dependencies.sh

      - name: Test desktop release profile
        run: pnpm run test:tauri-release-runtime && cargo test -p jftrade-desktop

      - name: Build Linux desktop application
        run: pnpm run build:desktop:tauri

      - name: Upload Linux desktop smoke artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-desktop-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/src-tauri/target/release/jftrade-desktop
          if-no-files-found: error
          retention-days: 1

  desktop-build:
    name: Desktop Build (${{ matrix.label }})
    if: ${{ github.event_name == 'push' }}
    needs: [contracts, go-quality, proto-generation, go-coverage, go-regression, web-quality, web-assets, marketdata-sidecar, pine]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            build_command: pnpm run build:desktop:tauri
            artifact_id: linux-x64
            artifact_path: apps/desktop/src-tauri/target/release/jftrade-desktop
          - label: macOS ARM64
            runner: macos-15
            platform: macos
            build_command: pnpm run build:desktop:tauri
            artifact_id: macos-arm64
            artifact_path: apps/desktop/src-tauri/target/release/jftrade-desktop
          - label: Windows x64
            runner: windows-latest
            platform: windows
            build_command: pnpm run build:desktop:tauri
            artifact_id: windows-x64
            artifact_path: apps/desktop/src-tauri/target/release/jftrade-desktop.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      JFTRADE_DESKTOP_PREPARED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Build and smoke market data sidecar
        uses: ./.github/actions/build-marketdata-sidecar

      - name: Download desktop build inputs
        uses: ./.github/actions/download-desktop-assets
        with:
          frontend_artifact: ci-web-assets-${{ github.run_id }}-${{ github.run_attempt }}
          pine_artifact: ci-pine-assets-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Install Linux desktop dependencies
        if: ${{ matrix.platform == 'linux' }}
        run: bash scripts/install-linux-desktop-dependencies.sh

      - name: Verify macOS ARM64 runner
        if: ${{ matrix.platform == 'macos' }}
        run: test "$(uname -m)" = "arm64"

      - name: Verify Windows x64 runner
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          if ((go env GOARCH) -ne "amd64") {
            throw "Windows x64 runner is required"
          }

      - name: Test desktop release profile
        run: pnpm run test:tauri-release-runtime && cargo test -p jftrade-desktop

      - name: Build desktop application
        run: ${{ matrix.build_command }}

      - name: Verify Linux desktop binary
        if: ${{ matrix.platform == 'linux' }}
        run: |
          binary="apps/desktop/src-tauri/target/release/jftrade-desktop"
          test -x "$binary"
          file "$binary" | grep -q 'ELF 64-bit'

      - name: Verify macOS desktop application
        if: ${{ matrix.platform == 'macos' }}
        run: |
          binary="apps/desktop/src-tauri/target/release/jftrade-desktop"
          test -x "$binary"
          file "$binary" | grep -q 'Mach-O 64-bit executable arm64'
          test "$(lipo -archs "$binary")" = "arm64"

      - name: Verify Windows desktop executable
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          $artifact = (Resolve-Path "apps/desktop/src-tauri/target/release/jftrade-desktop.exe").Path
          if ((Get-Item $artifact).Length -le 0) {
            throw "Windows desktop executable is empty"
          }

          $stream = [System.IO.File]::OpenRead($artifact)
          $reader = [System.IO.BinaryReader]::new($stream)
          try {
            if ($reader.ReadUInt16() -ne 0x5A4D) {
              throw "Windows desktop executable is missing the MZ header"
            }
            $stream.Position = 0x3C
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) {
              throw "Windows desktop executable is missing the PE header"
            }
            if ($reader.ReadUInt16() -ne 0x8664) {
              throw "Windows desktop executable is not x64"
            }
            $stream.Position = $peOffset + 24 + 68
            if ($reader.ReadUInt16() -ne 2) {
              throw "Windows desktop executable is not using the Windows GUI subsystem"
            }
          } finally {
            $reader.Dispose()
            $stream.Dispose()
          }

          $buildInfo = & go version -m $artifact
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read Windows desktop Go build metadata"
          }
          $buildInfo | Out-Host
          if (-not ($buildInfo -match "github.com/jftrade/jftrade-main/cmd/jftrade-desktop")) {
            throw "Windows desktop executable has unexpected Go module metadata"
          }
          if (-not ($buildInfo -match "GOARCH=amd64")) {
            throw "Windows desktop executable has unexpected Go architecture metadata"
          }

      - name: Upload desktop build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-desktop-${{ matrix.artifact_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 1

  build-and-test:
    name: Build & Test
    if: ${{ always() }}
    needs: [contracts, rust-quality, rust-platform, go-quality, proto-generation, go-coverage, go-regression, web-quality, web-assets, marketdata-sidecar, pine, desktop-linux-smoke, desktop-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          RUST_QUALITY_RESULT: ${{ needs.rust-quality.result }}
          RUST_PLATFORM_RESULT: ${{ needs.rust-platform.result }}
          GO_QUALITY_RESULT: ${{ needs.go-quality.result }}
          PROTO_GENERATION_RESULT: ${{ needs.proto-generation.result }}
          GO_COVERAGE_RESULT: ${{ needs.go-coverage.result }}
          GO_REGRESSION_RESULT: ${{ needs.go-regression.result }}
          WEB_QUALITY_RESULT: ${{ needs.web-quality.result }}
          WEB_ASSETS_RESULT: ${{ needs.web-assets.result }}
          MARKETDATA_SIDECAR_RESULT: ${{ needs.marketdata-sidecar.result }}
          PINE_RESULT: ${{ needs.pine.result }}
          DESKTOP_LINUX_SMOKE_RESULT: ${{ needs.desktop-linux-smoke.result }}
          DESKTOP_BUILD_RESULT: ${{ needs.desktop-build.result }}
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "$CONTRACTS_RESULT" \
            "$RUST_QUALITY_RESULT" \
            "$GO_QUALITY_RESULT" \
            "$PROTO_GENERATION_RESULT" \
            "$GO_COVERAGE_RESULT" \
            "$WEB_QUALITY_RESULT" \
            "$WEB_ASSETS_RESULT" \
            "$MARKETDATA_SIDECAR_RESULT" \
            "$PINE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done

          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$RUST_PLATFORM_RESULT" == "success" ]] || failed=1
            [[ "$GO_REGRESSION_RESULT" == "success" ]] || failed=1
            [[ "$DESKTOP_BUILD_RESULT" == "success" ]] || failed=1
            [[ "$DESKTOP_LINUX_SMOKE_RESULT" == "skipped" ]] || failed=1
          else
            [[ "$RUST_PLATFORM_RESULT" == "skipped" ]] || failed=1
            [[ "$GO_REGRESSION_RESULT" == "skipped" ]] || failed=1
            [[ "$DESKTOP_BUILD_RESULT" == "skipped" ]] || failed=1
            [[ "$DESKTOP_LINUX_SMOKE_RESULT" == "success" ]] || failed=1
          fi

          if [[ "$failed" -ne 0 ]]; then
            echo "Contracts & Docs: $CONTRACTS_RESULT"
            echo "Rust Quality: $RUST_QUALITY_RESULT"
            echo "Rust Compile Matrix: $RUST_PLATFORM_RESULT"
            echo "Go Quality: $GO_QUALITY_RESULT"
            echo "Proto Generation: $PROTO_GENERATION_RESULT"
            echo "Go Coverage: $GO_COVERAGE_RESULT"
            echo "Go Regression: $GO_REGRESSION_RESULT"
            echo "Web Quality: $WEB_QUALITY_RESULT"
            echo "Web Assets: $WEB_ASSETS_RESULT"
            echo "Market Data Sidecar: $MARKETDATA_SIDECAR_RESULT"
            echo "Pine & Workers: $PINE_RESULT"
            echo "Desktop Linux Smoke: $DESKTOP_LINUX_SMOKE_RESULT"
            echo "Desktop Build Matrix: $DESKTOP_BUILD_RESULT"
            exit 1
          fi
