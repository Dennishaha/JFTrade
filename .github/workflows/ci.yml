name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate-plan:
    name: Gate Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      reason: ${{ steps.plan.outputs.reason }}
      contracts: ${{ steps.plan.outputs.contracts }}
      rust_static: ${{ steps.plan.outputs.rust_static }}
      rust_tests: ${{ steps.plan.outputs.rust_tests }}
      compatibility: ${{ steps.plan.outputs.compatibility }}
      compatibility_capabilities: ${{ steps.plan.outputs.compatibility_capabilities }}
      web: ${{ steps.plan.outputs.web }}
      pine: ${{ steps.plan.outputs.pine }}
      python: ${{ steps.plan.outputs.python }}
      desktop: ${{ steps.plan.outputs.desktop }}
    steps:
      - name: Checkout with merge-base history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Plan fail-closed product gates
        id: plan
        env:
          JFTRADE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/test-affected.mjs --github-output

      - name: Summarize gate plan
        env:
          PLAN_REASON: ${{ steps.plan.outputs.reason }}
          PLAN_FULL: ${{ steps.plan.outputs.full }}
          PLAN_CAPABILITIES: ${{ steps.plan.outputs.compatibility_capabilities }}
        run: |
          {
            echo "## Product gate plan"
            echo "- Full: $PLAN_FULL"
            echo "- Reason: $PLAN_REASON"
            echo "- Compatibility: $PLAN_CAPABILITIES"
          } >> "$GITHUB_STEP_SUMMARY"

  policy:
    name: Policy
    needs: gate-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Enforce permanent product policy
        run: pnpm run check:policy

  contracts:
    name: Contracts
    if: ${{ needs.gate-plan.outputs.contracts == 'true' }}
    needs: gate-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Verify generated and registered contracts
        run: pnpm run check:contracts

  rust-static:
    name: Rust Static
    if: ${{ needs.gate-plan.outputs.rust_static == 'true' }}
    needs: gate-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/install-linux-desktop-dependencies.sh
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-rust
        with:
          cache-job: static
          install-cargo-deny: "true"
          sccache: "true"
          fast-linker: "true"
      - name: Format Clippy architecture and dependency policy
        run: pnpm run check:rust:static

  rust-unit-tests:
    name: Rust Unit Tests
    if: ${{ needs.gate-plan.outputs.rust_tests == 'true' }}
    needs: gate-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/install-linux-desktop-dependencies.sh
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-rust
        with:
          cache-job: unit-tests
          sccache: "true"
          fast-linker: "true"
      - name: Run Rust unit and target tests
        run: pnpm run test:rust:unit

  rust-integration-tests:
    name: Rust Integration Tests
    if: ${{ needs.gate-plan.outputs.rust_tests == 'true' }}
    needs: gate-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/install-linux-desktop-dependencies.sh
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-rust
        with:
          cache-job: integration-tests
          sccache: "true"
          fast-linker: "true"
      - name: Run Rust integration tests
        run: pnpm run test:rust:integration

  compatibility:
    name: Compatibility
    if: ${{ needs.gate-plan.outputs.compatibility == 'true' }}
    needs: gate-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/install-linux-desktop-dependencies.sh
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-rust
        with:
          cache-job: compatibility
          sccache: "true"
          fast-linker: "true"
      - name: Replay affected compatibility capabilities in parallel
        env:
          CAPABILITIES_JSON: ${{ needs.gate-plan.outputs.compatibility_capabilities }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t capabilities < <(jq -r '.[]' <<< "$CAPABILITIES_JSON")
          pids=()
          for capability in "${capabilities[@]}"; do
            pnpm run "check:compatibility:$capability" > "compatibility-$capability.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for index in "${!pids[@]}"; do
            if ! wait "${pids[$index]}"; then failed=1; fi
            cat "compatibility-${capabilities[$index]}.log"
          done
          exit "$failed"

  web:
    name: Web
    if: ${{ needs.gate-plan.outputs.web == 'true' || needs.gate-plan.outputs.desktop == 'true' }}
    needs: gate-plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Test and typecheck Web
        if: ${{ needs.gate-plan.outputs.web == 'true' }}
        run: pnpm run check:web
      - name: Build desktop Web assets
        run: pnpm run build:frontend-assets:generated
      - uses: actions/upload-artifact@v7
        with:
          name: ci-web-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/dist
            runtime-assets/web/manifest.json
          if-no-files-found: error
          retention-days: 1

  pine:
    name: Pine
    if: ${{ needs.gate-plan.outputs.pine == 'true' || needs.gate-plan.outputs.desktop == 'true' }}
    needs: gate-plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Test and typecheck Pine worker
        if: ${{ needs.gate-plan.outputs.pine == 'true' }}
        run: pnpm run check:pine
      - name: Build Pine worker asset
        run: |
          pnpm run test:pineworker-asset-build
          pnpm run build:pineworker
      - uses: actions/upload-artifact@v7
        with:
          name: ci-pine-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-assets/pine/worker.mjs
          if-no-files-found: error
          retention-days: 1

  python:
    name: Python Market Data
    if: ${{ needs.gate-plan.outputs.python == 'true' }}
    needs: gate-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.14"
      - name: Test locked sidecar without external access
        run: pnpm run check:python

  desktop-linux-smoke:
    name: Desktop Linux Smoke
    if: ${{ always() && github.event_name == 'pull_request' && needs.gate-plan.outputs.desktop == 'true' && needs.contracts.result == 'success' && needs.web.result == 'success' && needs.pine.result == 'success' }}
    needs: [gate-plan, contracts, web, pine]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JFTRADE_DESKTOP_PREPARED: "1"
      JFTRADE_DESKTOP_RELEASE_TAG: "v0.29.0"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/install-linux-desktop-dependencies.sh
      - uses: ./.github/actions/setup-rust
        with:
          cache-job: desktop-pr
          sccache: "true"
          fast-linker: "true"
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/build-marketdata-sidecar
      - uses: ./.github/actions/download-desktop-assets
        with:
          contracts_artifact: ""
          frontend_artifact: ci-web-assets-${{ github.run_id }}-${{ github.run_attempt }}
          pine_artifact: ci-pine-assets-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Test and build Linux desktop
        run: |
          node scripts/write-desktop-release-input-manifest.mjs
          pnpm run prepare:tauri-release
          pnpm run test:tauri-release-runtime
          pnpm run build:desktop:tauri

  desktop-build:
    name: Desktop Build (${{ matrix.label }})
    if: ${{ always() && github.event_name == 'push' && needs.gate-plan.outputs.desktop == 'true' && needs.contracts.result == 'success' && needs.web.result == 'success' && needs.pine.result == 'success' }}
    needs: [gate-plan, contracts, web, pine]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Linux x64, runner: ubuntu-24.04, platform: linux, target: x86_64-unknown-linux-gnu }
          - { label: macOS ARM64, runner: macos-15, platform: macos, target: aarch64-apple-darwin }
          - { label: Windows x64, runner: windows-latest, platform: windows, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      JFTRADE_DESKTOP_PREPARED: "1"
      JFTRADE_DESKTOP_RELEASE_TAG: "v0.29.0"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - if: ${{ matrix.platform == 'linux' }}
        run: bash scripts/install-linux-desktop-dependencies.sh
      - uses: ./.github/actions/setup-rust
        with:
          cache-job: desktop-main
          target: ${{ matrix.target }}
          sccache: "true"
          fast-linker: ${{ matrix.platform == 'linux' && 'true' || 'false' }}
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/build-marketdata-sidecar
      - uses: ./.github/actions/download-desktop-assets
        with:
          contracts_artifact: ""
          frontend_artifact: ci-web-assets-${{ github.run_id }}-${{ github.run_attempt }}
          pine_artifact: ci-pine-assets-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Test release profile and build desktop
        run: |
          node scripts/write-desktop-release-input-manifest.mjs
          pnpm run prepare:tauri-release
          pnpm run test:tauri-release-runtime
          pnpm run build:desktop:tauri

  windows-arm64-compile:
    name: Windows ARM64 Native Compile
    if: ${{ github.event_name == 'push' }}
    needs: gate-plan
    runs-on: windows-11-arm
    timeout-minutes: 25
    env:
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-job: native-compile
          target: aarch64-pc-windows-msvc
      - run: cargo check --workspace --all-targets --locked --target aarch64-pc-windows-msvc

  build-and-test:
    name: Build & Test
    if: ${{ always() }}
    needs:
      - gate-plan
      - policy
      - contracts
      - rust-static
      - rust-unit-tests
      - rust-integration-tests
      - compatibility
      - web
      - pine
      - python
      - desktop-linux-smoke
      - desktop-build
      - windows-arm64-compile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every planned lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_STATUS: ${{ needs.gate-plan.result }}
          POLICY_STATUS: ${{ needs.policy.result }}
          CONTRACTS_PLANNED: ${{ needs.gate-plan.outputs.contracts }}
          CONTRACTS_STATUS: ${{ needs.contracts.result }}
          RUST_STATIC_PLANNED: ${{ needs.gate-plan.outputs.rust_static }}
          RUST_STATIC_STATUS: ${{ needs.rust-static.result }}
          RUST_TESTS_PLANNED: ${{ needs.gate-plan.outputs.rust_tests }}
          COMPATIBILITY_PLANNED: ${{ needs.gate-plan.outputs.compatibility }}
          RUST_UNIT_STATUS: ${{ needs.rust-unit-tests.result }}
          RUST_INTEGRATION_STATUS: ${{ needs.rust-integration-tests.result }}
          COMPATIBILITY_STATUS: ${{ needs.compatibility.result }}
          WEB_PLANNED: ${{ needs.gate-plan.outputs.web }}
          WEB_STATUS: ${{ needs.web.result }}
          PINE_PLANNED: ${{ needs.gate-plan.outputs.pine }}
          PINE_STATUS: ${{ needs.pine.result }}
          PYTHON_PLANNED: ${{ needs.gate-plan.outputs.python }}
          PYTHON_STATUS: ${{ needs.python.result }}
          DESKTOP_PLANNED: ${{ needs.gate-plan.outputs.desktop }}
          DESKTOP_PR_STATUS: ${{ needs.desktop-linux-smoke.result }}
          DESKTOP_MAIN_STATUS: ${{ needs.desktop-build.result }}
          WINDOWS_ARM_STATUS: ${{ needs.windows-arm64-compile.result }}
        shell: bash
        run: |
          set -euo pipefail
          require_lane() {
            local planned="$1" status="$2" name="$3"
            if [[ "$planned" == "true" ]]; then
              [[ "$status" == "success" ]] || { echo "$name was planned but ended $status"; return 1; }
            else
              [[ "$status" == "skipped" || "$status" == "success" ]] || { echo "$name unexpectedly ended $status"; return 1; }
            fi
          }
          [[ "$PLAN_STATUS" == "success" ]]
          [[ "$POLICY_STATUS" == "success" ]]
          require_lane "$CONTRACTS_PLANNED" "$CONTRACTS_STATUS" Contracts
          require_lane "$RUST_STATIC_PLANNED" "$RUST_STATIC_STATUS" RustStatic
          require_lane "$RUST_TESTS_PLANNED" "$RUST_UNIT_STATUS" RustUnitTests
          require_lane "$RUST_TESTS_PLANNED" "$RUST_INTEGRATION_STATUS" RustIntegrationTests
          require_lane "$COMPATIBILITY_PLANNED" "$COMPATIBILITY_STATUS" Compatibility
          if [[ "$WEB_PLANNED" == "true" || "$DESKTOP_PLANNED" == "true" ]]; then web_lane=true; else web_lane=false; fi
          require_lane "$web_lane" "$WEB_STATUS" Web
          if [[ "$PINE_PLANNED" == "true" || "$DESKTOP_PLANNED" == "true" ]]; then pine_lane=true; else pine_lane=false; fi
          require_lane "$pine_lane" "$PINE_STATUS" Pine
          require_lane "$PYTHON_PLANNED" "$PYTHON_STATUS" Python
          if [[ "$EVENT_NAME" == "push" ]]; then
            require_lane "$DESKTOP_PLANNED" "$DESKTOP_MAIN_STATUS" DesktopMain
            [[ "$DESKTOP_PR_STATUS" == "skipped" ]]
            [[ "$WINDOWS_ARM_STATUS" == "success" ]]
          else
            require_lane "$DESKTOP_PLANNED" "$DESKTOP_PR_STATUS" DesktopPR
            [[ "$DESKTOP_MAIN_STATUS" == "skipped" ]]
            [[ "$WINDOWS_ARM_STATUS" == "skipped" ]]
          fi
