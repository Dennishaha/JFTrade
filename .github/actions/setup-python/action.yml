name: Setup Python
description: Setup Python with a pip cache keyed on the sidecar dependency manifest

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.14"
  cache-dependency-path:
    description: Dependency manifest used to key the pip cache
    required: false
    default: workers/marketdata-sidecar/pyproject.toml

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
