name: Setup Python
description: Setup Python and pinned uv with a cache keyed on the sidecar manifests

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.14"
  cache-dependency-path:
    description: Dependency manifests used to key the pip cache
    required: false
    default: |
      workers/marketdata-sidecar/pyproject.toml
      workers/marketdata-sidecar/uv.lock

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install pinned uv
      shell: bash
      run: python -m pip install --disable-pip-version-check uv==0.12.5
