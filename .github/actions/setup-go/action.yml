name: Setup Go
description: Install Go from go.mod and cache its module dependencies

inputs:
  cache:
    description: Whether to cache Go module dependencies
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
        cache: ${{ inputs.cache }}
