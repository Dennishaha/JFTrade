name: Build and smoke market data sidecar
description: Install sidecar build dependencies and verify the native helper builds and runs

runs:
  using: composite
  steps:
    - name: Sync locked sidecar build dependencies
      shell: bash
      run: uv sync --locked --project workers/marketdata-sidecar --extra runtime --extra build

    - name: Build native market-data helper
      shell: bash
      run: pnpm run build:marketdata-sidecar

    - name: Smoke native market-data helper
      shell: bash
      run: pnpm run smoke:marketdata-sidecar
