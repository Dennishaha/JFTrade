name: Verify Linux desktop binary
description: Verify the Tauri Linux desktop binary is an executable ELF with resolved shared libraries

inputs:
  artifact_path:
    description: Path to the Linux desktop binary
    required: false
    default: apps/desktop/src-tauri/target/release/jftrade-desktop

runs:
  using: composite
  steps:
    - name: Verify Linux desktop binary
      shell: bash
      run: |
        set -euo pipefail
        artifact="${{ inputs.artifact_path }}"
        test -x "$artifact"
        file "$artifact" | grep -q 'ELF 64-bit'
        ldd "$artifact" | tee /tmp/jftrade-linux-ldd.txt
        ! grep -q 'not found' /tmp/jftrade-linux-ldd.txt
