name: Setup Rust
description: Install the pinned Rust and protoc toolchains and cache workspace dependencies

inputs:
  cache:
    description: Whether to cache Cargo registry and build outputs
    required: false
    default: "true"
  cache-job:
    description: Stable cache namespace for the CI job
    required: false
    default: rust
  target:
    description: Rust compilation target or native
    required: false
    default: native
  install-cargo-deny:
    description: Install the pinned cargo-deny binary
    required: false
    default: "false"
  sccache:
    description: Enable the shared GitHub Actions compiler cache
    required: false
    default: "false"
  fast-linker:
    description: Use mold for Linux x64 linking; mold and clang must already be installed
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
        rustup default 1.97.1
        rustc --version --verbose
        cargo --version

    - name: Install pinned sccache
      if: ${{ inputs.sccache == 'true' }}
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: "v0.16.0"

    - name: Enable the shared compiler cache
      if: ${{ inputs.sccache == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_VERSION=jftrade-rust-1.97.1-v1" >> "$GITHUB_ENV"
        sccache --version

    - name: Enable mold on Linux x64
      if: ${{ inputs.fast-linker == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        [[ "${RUNNER_OS:?}" == "Linux" && "${RUNNER_ARCH:?}" == "X64" ]] || {
          echo "mold is only configured for Linux x64 CI runners" >&2
          exit 1
        }
        command -v clang
        command -v mold
        clang --version
        mold --version
        echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang" >> "$GITHUB_ENV"
        echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

    - name: Install pinned protoc toolchain
      id: protoc-config
      shell: bash
      run: |
        set -euo pipefail
        version="34.1"
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)
            archive_name="protoc-${version}-linux-x86_64.zip"
            expected_sha256="af27ea66cd26938fe48587804ca7d4817457a08350021a1c6e23a27ccc8c6904"
            executable_name="protoc"
            ;;
          Linux-ARM64)
            archive_name="protoc-${version}-linux-aarch_64.zip"
            expected_sha256="31c5e9e3c7bf013cf41fb97765ee255c140024a6b175b6cc9b64beddd7c23ba7"
            executable_name="protoc"
            ;;
          macOS-X64)
            archive_name="protoc-${version}-osx-x86_64.zip"
            expected_sha256="ab124429c1f49951f03b6c0c0e911fec04e2c7c20de5c935e0cde7353bbd016c"
            executable_name="protoc"
            ;;
          macOS-ARM64)
            archive_name="protoc-${version}-osx-aarch_64.zip"
            expected_sha256="2c7e92b8b578916937df132b3032e2e8e6c170862ecf7a8333094a6f3d03650c"
            executable_name="protoc"
            ;;
          Windows-X64|Windows-ARM64)
            archive_name="protoc-${version}-win64.zip"
            expected_sha256="6d7ebdc75e9c1f0026d4fb28f17ef1d0aae77d36744d83a9e052d79ba493724f"
            executable_name="protoc.exe"
            ;;
          *)
            echo "Unsupported protoc runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac

        install_dir="${RUNNER_TEMP:?}/jftrade-protoc-${version}"
        cache_dir="${HOME:?}/.cache/jftrade/protoc/${version}/${RUNNER_OS}-${RUNNER_ARCH}"
        archive_path="$cache_dir/$archive_name"
        download_url="https://github.com/protocolbuffers/protobuf/releases/download/v${version}/${archive_name}"
        mkdir -p "$cache_dir"
        echo "cache_dir=$cache_dir" >> "$GITHUB_OUTPUT"
        echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
        echo "expected_sha256=$expected_sha256" >> "$GITHUB_OUTPUT"
        echo "executable_name=$executable_name" >> "$GITHUB_OUTPUT"

    - name: Restore pinned protoc archive
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@v5
      with:
        path: ${{ steps.protoc-config.outputs.cache_dir }}
        key: protoc-34.1-${{ runner.os }}-${{ runner.arch }}

    - name: Activate pinned protoc toolchain
      shell: bash
      run: |
        set -euo pipefail
        version="34.1"
        install_dir="${RUNNER_TEMP:?}/jftrade-protoc-${version}"
        cache_dir="${{ steps.protoc-config.outputs.cache_dir }}"
        archive_path="$cache_dir/${{ steps.protoc-config.outputs.archive_name }}"
        expected_sha256="${{ steps.protoc-config.outputs.expected_sha256 }}"
        executable_name="${{ steps.protoc-config.outputs.executable_name }}"
        download_url="https://github.com/protocolbuffers/protobuf/releases/download/v${version}/${{ steps.protoc-config.outputs.archive_name }}"
        rm -rf "$install_dir"
        mkdir -p "$install_dir"
        if [[ ! -f "$archive_path" ]]; then
          curl --fail --location --silent --show-error "$download_url" --output "$archive_path"
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          actual_sha256="$(sha256sum "$archive_path" | awk '{print $1}')"
          # GNU coreutils prefixes the complete output line with a backslash
          # when a Windows path contains backslashes and needs escaping.
          actual_sha256="${actual_sha256#\\}"
        else
          actual_sha256="$(shasum -a 256 "$archive_path" | awk '{print $1}')"
        fi
        if [[ "$actual_sha256" != "$expected_sha256" ]]; then
          echo "protoc archive checksum mismatch: expected $expected_sha256, got $actual_sha256" >&2
          exit 1
        fi
        unzip -q "$archive_path" -d "$install_dir"
        chmod +x "$install_dir/bin/$executable_name"
        "$install_dir/bin/$executable_name" --version | grep -Fx "libprotoc ${version}"
        echo "$install_dir/bin" >> "$GITHUB_PATH"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "PROTOC=$(cygpath -w "$install_dir/bin/$executable_name")" >> "$GITHUB_ENV"
        else
          echo "PROTOC=$install_dir/bin/$executable_name" >> "$GITHUB_ENV"
        fi

    - name: Restore pinned cargo-deny
      if: ${{ inputs.install-cargo-deny == 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/cargo-deny
        key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}

    - name: Install pinned cargo-deny
      if: ${{ inputs.install-cargo-deny == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if ! cargo deny --version 2>/dev/null | grep -Fq 'cargo-deny 0.20.2'; then
          cargo install cargo-deny --version 0.20.2 --locked
        fi
        cargo deny --version

    - name: Cache Cargo dependencies
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: rust-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ inputs.cache-job }}-sccache-${{ inputs.sccache }}-linker-${{ inputs.fast-linker }}-1.97.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          rust-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ inputs.cache-job }}-sccache-${{ inputs.sccache }}-linker-${{ inputs.fast-linker }}-1.97.1-${{ hashFiles('Cargo.lock') }}-
          rust-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ inputs.cache-job }}-sccache-${{ inputs.sccache }}-linker-${{ inputs.fast-linker }}-1.97.1-
