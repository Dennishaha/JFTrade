[graph]
all-features = true
targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
ignore = [
  # Tauri 2.11.5 resolves these informational "unmaintained" notices through
  # its official Linux GTK3 and urlpattern graph even with default features
  # disabled. None is a vulnerability/unsound advisory. Keep IDs explicit and
  # remove them when the official Tauri graph no longer resolves the crates.
  { id = "RUSTSEC-2024-0370", reason = "transitive through official Tauri Linux GTK3 support" },
  { id = "RUSTSEC-2024-0411", reason = "transitive through official Tauri Linux tray support" },
  { id = "RUSTSEC-2024-0412", reason = "transitive through official Tauri Linux GTK3 support" },
  { id = "RUSTSEC-2024-0413", reason = "transitive through official Tauri Linux GTK3 support" },
  { id = "RUSTSEC-2024-0415", reason = "transitive through official Tauri Linux GTK3 support" },
  { id = "RUSTSEC-2024-0416", reason = "transitive through official Tauri Linux GTK3 support" },
  { id = "RUSTSEC-2024-0418", reason = "transitive through official Tauri Linux GTK3 support" },
  { id = "RUSTSEC-2024-0419", reason = "transitive through official Tauri Linux GTK3 support" },
  { id = "RUSTSEC-2024-0420", reason = "transitive through official Tauri Linux GTK3 support" },
  { id = "RUSTSEC-2025-0075", reason = "transitive through official Tauri urlpattern support" },
  { id = "RUSTSEC-2025-0080", reason = "transitive through official Tauri urlpattern support" },
  { id = "RUSTSEC-2025-0081", reason = "transitive through official Tauri urlpattern support" },
  { id = "RUSTSEC-2025-0098", reason = "transitive through official Tauri urlpattern support" },
  { id = "RUSTSEC-2025-0100", reason = "transitive through official Tauri urlpattern support" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
]
exceptions = [
  { crate = "cssparser@0.36.0", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros@0.6.1", allow = ["MPL-2.0"] },
  { crate = "dtoa-short@0.3.5", allow = ["MPL-2.0"] },
  { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
  { crate = "selectors@0.36.1", allow = ["MPL-2.0"] },
  { crate = "foldhash@0.1.5", allow = ["Zlib"] },
  { crate = "foldhash@0.2.0", allow = ["Zlib"] },
  { crate = "zlib-rs@0.6.7", allow = ["Zlib"] },
  { crate = "libloading@0.7.4", allow = ["ISC"] },
  # Exact rustls signing/TLS graph used by the official Tauri updater.
  { crate = "ring@0.17.14", allow = ["ISC"] },
  { crate = "rustls-webpki@0.103.14", allow = ["ISC"] },
  { crate = "target-lexicon@0.12.16", allow = ["Apache-2.0 WITH LLVM-exception"] },
  { crate = "untrusted@0.9.0", allow = ["ISC"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
